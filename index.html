              <div className="space-y-6">
                {groupedRoutines.map(group => (
                  <div key={`${group.class_name}-${group.section}-${group.shift}`} className="border rounded-2xl overflow-hidden">
                    <div className="bg-slate-900 text-white px-4 py-2.5 font-bold text-sm">
                      Class {group.class_name} · Section {group.section} · {group.shift} Shift
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead className="bg-slate-50">
                          <tr>
                            {SCHOOL_DAYS.map(day => (
                              <th key={day} className="p-3 font-bold border-b align-top min-w-[140px]">{day}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            {SCHOOL_DAYS.map(day => (
                              <td key={day} className="p-3 border-b align-top vertical-align-top">
                                {group.byDay[day].length === 0 ? (
                                  <span className="text-slate-300 italic">—</span>
                                ) : (
                                  <div className="space-y-2">
                                    {group.byDay[day].map(entry => (
                                      <div key={entry.id} className="bg-slate-50 border rounded-lg p-2 relative group">
                                        <p className="font-bold text-slate-800">{entry.teacher_name}</p>
                                        <p className="text-sky-700 font-semibold mt-0.5">{entry.subject_name}</p>
                                        {routineIdToDelete === entry.id ? (
                                          <div className="flex gap-1 mt-2">
                                            <button onClick={() => { onDeleteRoutine(entry.id); setRoutineIdToDelete(null); }} className="bg-rose-600 text-white text-[10px] px-2 py-0.5 rounded font-bold cursor-pointer">Confirm</button>
                                            <button onClick={() => setRoutineIdToDelete(null)} className="bg-slate-200 text-[10px] px-2 py-0.5 rounded font-bold cursor-pointer">No</button>
                                          </div>
                                        ) : (
                                          <button onClick={() => setRoutineIdToDelete(entry.id)} className="absolute top-1 right-1 text-rose-400 hover:text-rose-600 p-0.5 opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"><TrashIcon /></button>
                                        )}
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </td>
                            ))}
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function WeeklyLessonPlanTable({ dayColumns }) {
      if (!dayColumns || dayColumns.length === 0) return null;
      return (
        <table className="weekly-lesson-table">
          <thead>
            <tr>
              {dayColumns.map(col => (
                <th key={col.dateStr}>
                  <span className="weekly-date">{formatShortDate(col.dateStr)}</span>
                  <span className="weekly-day">{col.dayName}</span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            <tr>
              {dayColumns.map(col => (
                <td key={col.dateStr}>
                  {col.entries.map((entry, idx) => (
                    <div key={`${col.dateStr}-${entry.subject_name}-${idx}`} className="weekly-entry">
                      <div className="weekly-subject">{entry.subject_name}</div>
                      <div className="weekly-plan">{entry.classWork}</div>
                      {entry.homework && (
                        <div className="weekly-hw">
                          <span className="weekly-hw-label">HW:</span> {entry.homework}
                        </div>
                      )}
                    </div>
                  ))}
                </td>
              ))}
            </tr>
          </tbody>
        </table>
      );
    }

    function findPlanForRoutine(lessonPlans, assignment, dateStr) {
      return lessonPlans.find(p =>
        (p.teacher_id === assignment.teacher_id || p.teacher_name === assignment.teacher_name) &&
        p.class_name === assignment.class_name &&
        p.section === assignment.section &&
        p.shift === assignment.shift &&
        p.subject_name === assignment.subject_name &&
        p.lesson_date === dateStr
      );
    }

    function buildWeeklyRoutineColumns(schoolDates, routines, lessonPlans, printClass, printSection, printShift) {
      return schoolDates.map(({ dateStr, dayName }) => {
        const dayAssignments = routines.filter(r =>
          r.class_name === printClass &&
          r.section === printSection &&
          r.shift === printShift &&
          r.day_name === dayName
        );
        if (dayAssignments.length === 0) return null;

        const entries = dayAssignments.map(assignment => {
          const plan = findPlanForRoutine(lessonPlans, assignment, dateStr);
          return {
            subject_name: assignment.subject_name,
            classWork: plan ? plan.class_work : `${assignment.subject_name} — scheduled (plan pending)`,
            homework: plan && plan.homework && plan.homework !== 'No Homework' ? plan.homework : null
          };
        });

        return { dateStr, dayName, entries };
      }).filter(Boolean);
    }

    function buildWeeklyLessonPlanColumns(schoolDates, routines, lessonPlans, printClass, printSection, printShift) {
      return schoolDates.map(({ dateStr, dayName }) => {
        const dayAssignments = routines.filter(r =>
          r.class_name === printClass &&
          r.section === printSection &&
          r.shift === printShift &&
          r.day_name === dayName
        );

        const entries = dayAssignments.map(assignment => {
          const plan = findPlanForRoutine(lessonPlans, assignment, dateStr);
          if (!plan) return null;
          return {
            subject_name: assignment.subject_name,
            classWork: plan.class_work,
            homework: plan.homework && plan.homework !== 'No Homework' ? plan.homework : null
          };
        }).filter(Boolean);

        if (entries.length === 0) return null;
        return { dateStr, dayName, entries };
      }).filter(Boolean);
    }

    function TeacherManagementPanel({ teachersList, onAddTeacher, onDeleteTeacher }) {
      const [newTeacherName, setNewTeacherName] = useState('');
      const [newTeacherId, setNewTeacherId] = useState('');
      const [newTeacherPass, setNewTeacherPass] = useState('');
      const [teacherIdToDelete, setTeacherIdToDelete] = useState(null);
      const [dirAlert, setDirAlert] = useState(null);

      const handleAddTeacherSubmit = (e) => {
        e.preventDefault();
        setDirAlert(null);

        const nameClean = newTeacherName.trim();
        const idClean = newTeacherId.trim();
        const passClean = newTeacherPass.trim();

        if (!nameClean || !idClean || !passClean) return;

        if (teachersList.some(t => t.teacher_id.toLowerCase() === idClean.toLowerCase())) {
          setDirAlert({ type: 'error', text: 'Error: This Teacher ID is already registered.' });
          return;
        }

        onAddTeacher(nameClean, idClean, passClean);

        setNewTeacherName('');
        setNewTeacherId('');
        setNewTeacherPass('');
        setDirAlert({ type: 'success', text: 'Success: Teacher profile saved and synced.' });
      };

      return (
        <div className="bg-white border p-6 sm:p-8 rounded-3xl space-y-6 max-w-3xl mx-auto shadow-sm">
          <div>
            <h3 className="font-bold border-b pb-3 text-slate-900 text-lg">Teacher Management</h3>
            <p className="text-xs text-slate-500 mt-2">Register and manage teacher login credentials. Changes sync across all portals.</p>
          </div>

          <form onSubmit={handleAddTeacherSubmit} className="bg-slate-50 p-4 rounded-2xl border space-y-4">
            <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Register New Teacher Profile</h4>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label className="text-[11px] font-bold text-slate-600 block mb-1">Full Name</label>
                <input type="text" value={newTeacherName} onChange={e => setNewTeacherName(e.target.value)} placeholder="e.g. Tasnim Alom" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
              </div>
              <div>
                <label className="text-[11px] font-bold text-slate-600 block mb-1">User Login ID</label>
                <input type="text" value={newTeacherId} onChange={e => setNewTeacherId(e.target.value)} placeholder="e.g. t106" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
              </div>
              <div>
                <label className="text-[11px] font-bold text-slate-600 block mb-1">Secret Password</label>
                <input type="text" value={newTeacherPass} onChange={e => setNewTeacherPass(e.target.value)} placeholder="Passcode string" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
              </div>
            </div>
            <div className="flex justify-end pt-1">
              <button type="submit" className="bg-violet-700 hover:bg-violet-800 text-white font-bold text-xs py-2 px-4 rounded-xl flex items-center gap-1.5 cursor-pointer"><PlusIcon /> Save Credentials</button>
            </div>
          </form>

          {dirAlert && (
            <p className={`p-3 rounded-xl text-xs font-semibold ${dirAlert.type === 'success' ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-50 text-rose-900'}`}>
              {dirAlert.text}
            </p>
          )}

          <div className="border rounded-xl overflow-hidden mt-4">
            <table className="w-full text-left text-sm divide-y">
              <thead className="bg-slate-50">
                <tr>
                  <th className="p-4 font-bold">Teacher Name</th>
                  <th className="p-4 font-bold">Login ID</th>
                  <th className="p-4 font-bold text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y bg-white">
                {teachersList.map((teacher) => (
                  <tr key={teacher.id}>
                    <td className="p-4 font-bold text-slate-800">{teacher.teacher_name}</td>
                    <td className="p-4 font-mono text-xs text-violet-700 bg-violet-50/40 font-bold">{teacher.teacher_id}</td>
                    <td className="p-4 text-right">
                      {teacherIdToDelete === teacher.id ? (
                        <div className="inline-flex gap-1.5 items-center">
                          <button onClick={() => { onDeleteTeacher(teacher.id); setTeacherIdToDelete(null); }} className="bg-rose-600 text-white text-xs px-2 py-1 rounded cursor-pointer font-bold">Confirm</button>
                          <button onClick={() => setTeacherIdToDelete(null)} className="bg-slate-200 text-slate-700 text-xs px-2 py-1 rounded cursor-pointer font-bold">No</button>
                        </div>
                      ) : (
                        <button onClick={() => setTeacherIdToDelete(teacher.id)} className="text-rose-500 hover:text-rose-700 p-1 bg-rose-50 rounded-lg cursor-pointer"><TrashIcon /></button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function CoordinatorPortal({ loggedInCoordinator, onCoordinatorLogin, teachersList, lessonPlans, routines, onAddRoutine, onDeleteRoutine, onAddTeacher, onDeleteTeacher }) {
      const [userId, setUserId] = useState('');
      const [password, setPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [activeCoordTab, setActiveCoordTab] = useState('routine_setup');

      const [targetClass, setTargetClass] = useState('');
      const [targetSection, setTargetSection] = useState('');
      const [targetShift, setTargetShift] = useState('');
      const [targetDate, setTargetDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [viewPlanModal, setViewPlanModal] = useState(null);

      const [printStartDate, setPrintStartDate] = useState('');
      const [printEndDate, setPrintEndDate] = useState('');
      const [printClass, setPrintClass] = useState('');
      const [printSection, setPrintSection] = useState('');
      const [printShift, setPrintShift] = useState('');
      const [summaryReportReady, setSummaryReportReady] = useState(false);
      const [detailReportReady, setDetailReportReady] = useState(false);

      const targetDayName = useMemo(() => getDayNameFromDate(targetDate), [targetDate]);
      const isSearchParameterSet = !!(targetClass && targetSection && targetShift && targetDate);

      const isPrintParameterSet = !!(printStartDate && printEndDate && printClass && printSection && printShift);

      const assignedForDate = useMemo(() => {
        if (!isSearchParameterSet) return [];
        return routines.filter(r =>
          r.class_name === targetClass &&
          r.section === targetSection &&
          r.shift === targetShift &&
          r.day_name === targetDayName
        );
      }, [routines, targetClass, targetSection, targetShift, targetDayName, isSearchParameterSet]);

      const schoolDatesInPrintRange = useMemo(() => {
        if (!isPrintParameterSet) return [];
        return getSchoolDatesInRange(printStartDate, printEndDate);
      }, [printStartDate, printEndDate, isPrintParameterSet]);

      const summaryDayColumns = useMemo(() => {
        if (!isPrintParameterSet || schoolDatesInPrintRange.length === 0) return [];
        return buildWeeklyRoutineColumns(schoolDatesInPrintRange, routines, lessonPlans, printClass, printSection, printShift);
      }, [routines, lessonPlans, printClass, printSection, printShift, schoolDatesInPrintRange, isPrintParameterSet]);

      const detailDayColumns = useMemo(() => {
        if (!isPrintParameterSet || schoolDatesInPrintRange.length === 0) return [];
        return buildWeeklyLessonPlanColumns(schoolDatesInPrintRange, routines, lessonPlans, printClass, printSection, printShift);
      }, [routines, lessonPlans, printClass, printSection, printShift, schoolDatesInPrintRange, isPrintParameterSet]);

      const findPlanForAssignment = (assignment) => {
        return lessonPlans.find(p =>
          p.teacher_name === assignment.teacher_name &&
          p.class_name === assignment.class_name &&
          p.section === assignment.section &&
          p.shift === assignment.shift &&
          p.subject_name === assignment.subject_name &&
          p.lesson_date === targetDate
        );
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        const success = await onCoordinatorLogin(userId, password);
        if (!success) {
          setLoginError('Invalid Coordinator ID or password. Contact the Headmaster office.');
        }
      };

      const handleGenerateSummary = (e) => {
        e.preventDefault();
        if (!isPrintParameterSet) return;
        if (new Date(printStartDate) > new Date(printEndDate)) {
          alert('Start date must be before or equal to end date.');
          return;
        }
        setSummaryReportReady(true);
      };

      const handleGenerateDetail = (e) => {
        e.preventDefault();
        if (!isPrintParameterSet) return;
        if (new Date(printStartDate) > new Date(printEndDate)) {
          alert('Start date must be before or equal to end date.');
          return;
        }
        setDetailReportReady(true);
      };

      const PrintFilterForm = ({ onSubmit, submitLabel }) => (
        <form onSubmit={onSubmit} className="bg-white p-6 rounded-3xl border space-y-4 no-print">
          <h3 className="font-bold text-slate-900 flex items-center gap-1.5"><SearchIcon /> Select Date Range & Class</h3>
          <p className="text-xs text-slate-500">Choose starting date, ending date, class, section, and shift before generating the report.</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div>
              <label className="text-xs font-semibold text-slate-600 block mb-1">Starting Date</label>
              <input type="date" value={printStartDate} onChange={e => { setPrintStartDate(e.target.value); setSummaryReportReady(false); setDetailReportReady(false); }} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11" required />
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 block mb-1">Ending Date</label>
              <input type="date" value={printEndDate} onChange={e => { setPrintEndDate(e.target.value); setSummaryReportReady(false); setDetailReportReady(false); }} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11" required />
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
              <select value={printClass} onChange={e => { setPrintClass(e.target.value); setSummaryReportReady(false); setDetailReportReady(false); }} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer" required>
                <option value="">-- Choose Class --</option>
                {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
              <select value={printSection} onChange={e => { setPrintSection(e.target.value); setSummaryReportReady(false); setDetailReportReady(false); }} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer" required>
                <option value="">-- Choose Section --</option>
                {SECTIONS.map(sec => <option key={sec} value={sec}>Section {sec}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 block mb-1">Shift</label>
              <select value={printShift} onChange={e => { setPrintShift(e.target.value); setSummaryReportReady(false); setDetailReportReady(false); }} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer" required>
                <option value="">-- Choose Shift --</option>
                {SHIFTS.map(sh => <option key={sh} value={sh}>{sh} Shift</option>)}
              </select>
            </div>
          </div>
          <div className="flex justify-end">
            <button type="submit" className="bg-violet-700 hover:bg-violet-800 text-white font-bold text-sm py-2.5 px-6 rounded-xl cursor-pointer">{submitLabel}</button>
          </div>
        </form>
      );

      if (!loggedInCoordinator) {
        return (
          <div className="max-w-md w-full mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 mt-10 text-left space-y-6 shadow-xl animate-fade-in">
            <h3 className="text-lg font-bold font-display text-slate-900 text-center flex justify-center items-center gap-1.5"><UsersIcon /> Coordinator Portal</h3>
            <p className="text-xs text-slate-500 text-center">Use the login ID and password provided by the Headmaster office.</p>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 p-2 rounded-xl text-center font-bold">{loginError}</p>}
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold block mb-1">Coordinator Login ID</label>
                <input type="text" value={userId} onChange={e => setUserId(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm" placeholder="e.g. coord01" required />
              </div>
              <div>
                <label className="text-xs font-semibold block mb-1">Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm" required />
              </div>
              <button type="submit" className="w-full bg-violet-700 hover:bg-violet-800 font-bold text-white py-3 rounded-xl text-xs sm:text-sm cursor-pointer">Sign In</button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-6 animate-fade-in text-left">
          <div className="bg-violet-50 border border-violet-100 rounded-2xl px-4 py-3 no-print flex items-center justify-between">
            <p className="text-sm font-semibold text-violet-900">Signed in as <span className="font-bold">{loggedInCoordinator.coordinator_name}</span> ({loggedInCoordinator.coordinator_id})</p>
          </div>

          <div className="flex bg-slate-200 p-1.5 rounded-2xl border no-print overflow-x-auto">
            <button onClick={() => setActiveCoordTab('teachers')} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer whitespace-nowrap ${activeCoordTab === 'teachers' ? 'bg-violet-700 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>Teachers List</button>
            <button onClick={() => setActiveCoordTab('routine_setup')} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer whitespace-nowrap ${activeCoordTab === 'routine_setup' ? 'bg-violet-700 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>Routine Setup</button>
            <button onClick={() => setActiveCoordTab('routine_check')} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer whitespace-nowrap ${activeCoordTab === 'routine_check' ? 'bg-violet-700 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>Check by Date</button>
            <button onClick={() => { setActiveCoordTab('print_summary'); setSummaryReportReady(false); }} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer whitespace-nowrap ${activeCoordTab === 'print_summary' ? 'bg-violet-700 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>Print Weekly Routine</button>

      const isSearchParameterSet = !!(targetClass && targetSection && targetShift && targetDate);

      const assignedForDate = useMemo(() => {
        if (!isSearchParameterSet) return [];
        return routines.filter(r =>
          r.class_name === targetClass &&
          r.section === targetSection &&
          r.shift === targetShift &&
          r.day_name === targetDayName
        );
      }, [routines, targetClass, targetSection, targetShift, targetDayName, isSearchParameterSet]);

      const findPlanForAssignment = (assignment) => {
        return lessonPlans.find(p =>
          p.teacher_name === assignment.teacher_name &&
          p.class_name === assignment.class_name &&
          p.section === assignment.section &&
          p.shift === assignment.shift &&
          p.subject_name === assignment.subject_name &&
          p.lesson_date === targetDate
        );

        e.preventDefault();
        setLoginError('');
        const success = onLogin(passwordInput);
        if (!success) {
          setLoginError('Passcode invalid! Enter correct system administrator password.');
        }
      };

      const handleAddCoordinatorSubmit = (e) => {
        e.preventDefault();
        setCoordAlert(null);

        const nameClean = newCoordName.trim();
        const idClean = newCoordId.trim();
        const passClean = newCoordPass.trim();

        if (!nameClean || !idClean || !passClean) return;

        if (coordinatorsList.some(c => c.coordinator_id.toLowerCase() === idClean.toLowerCase())) {
          setCoordAlert({ type: 'error', text: 'Error: This Coordinator ID is already registered.' });
          return;
        }

        onAddCoordinator(nameClean, idClean, passClean);

        setNewCoordName('');
        setNewCoordId('');
        setNewCoordPass('');
        setCoordAlert({ type: 'success', text: 'Success: Coordinator login credentials saved.' });

                <div className="space-y-2 text-sm">
                  <p><span className="font-bold text-slate-600">Teacher:</span> {viewPlanModal.teacher_name}</p>
                  <p><span className="font-bold text-slate-600">Date:</span> {viewPlanModal.lesson_date} ({getDayNameFromDate(viewPlanModal.lesson_date)})</p>
                  <p><span className="font-bold text-slate-600">Class:</span> {viewPlanModal.class_name} · Section {viewPlanModal.section} · {viewPlanModal.shift}</p>
                  <p><span className="font-bold text-slate-600">Subject:</span> {viewPlanModal.subject_name}</p>
                </div>
                <div>
                  <p className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Class Work</p>
                  <p className="text-sm text-slate-800 bg-slate-50 border rounded-xl p-3 whitespace-pre-wrap">{viewPlanModal.class_work}</p>
                </div>
                <div>
                  <p className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Homework</p>
                  <p className="text-sm text-slate-800 bg-slate-50 border rounded-xl p-3 whitespace-pre-wrap italic">
                    {viewPlanModal.homework === 'No Homework' ? 'None assigned' : viewPlanModal.homework}
                  </p>
                </div>
                <button onClick={() => setViewPlanModal(null)} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm cursor-pointer">Close</button>
              </div>
            </div>
          )}

          {activeOfficeTab === 'coordinators' && (
            <div className="bg-white border p-6 sm:p-8 rounded-3xl space-y-6 max-w-3xl mx-auto shadow-sm">
              <h3 className="font-bold border-b pb-3 text-slate-900 text-lg">Coordinator Account Management</h3>
              <p className="text-xs text-slate-500">Create login ID and password for coordinators. Coordinators manage teachers, routines, and printable reports.</p>

              <form onSubmit={handleAddCoordinatorSubmit} className="bg-slate-50 p-4 rounded-2xl border space-y-4">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Register New Coordinator</h4>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Full Name</label>
                    <input type="text" value={newCoordName} onChange={e => setNewCoordName(e.target.value)} placeholder="e.g. Karim Hassan" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Login ID</label>
                    <input type="text" value={newCoordId} onChange={e => setNewCoordId(e.target.value)} placeholder="e.g. coord01" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Password</label>
                    <input type="text" value={newCoordPass} onChange={e => setNewCoordPass(e.target.value)} placeholder="Secret password" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
                  </div>
                </div>
                <div className="flex justify-end pt-1">
                  <button type="submit" className="bg-violet-700 hover:bg-violet-800 text-white font-bold text-xs py-2 px-4 rounded-xl flex items-center gap-1.5 cursor-pointer"><PlusIcon /> Save Coordinator</button>
                </div>
              </form>

              {coordAlert && (
                <p className={`p-3 rounded-xl text-xs font-semibold ${coordAlert.type === 'success' ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-50 text-rose-900'}`}>
                  {coordAlert.text}
                </p>
              )}

              <div className="border rounded-xl overflow-hidden mt-4">
                <table className="w-full text-left text-sm divide-y">
                  <thead className="bg-slate-50">
                    <tr>
                      <th className="p-4 font-bold">Coordinator Name</th>
                      <th className="p-4 font-bold">Login ID</th>
                      <th className="p-4 font-bold">Password</th>
                      <th className="p-4 font-bold text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y bg-white">
                    {coordinatorsList.length === 0 ? (
                      <tr><td colSpan="4" className="p-8 text-center text-slate-400 italic">No coordinator accounts created yet.</td></tr>
                    ) : coordinatorsList.map((coord) => (
                      <tr key={coord.id}>
                        <td className="p-4 font-bold text-slate-800">{coord.coordinator_name}</td>
                        <td className="p-4 font-mono text-xs text-violet-700 bg-violet-50/40 font-bold">{coord.coordinator_id}</td>
                        <td className="p-4 font-mono text-xs text-slate-600 font-medium">{coord.passcode}</td>
                        <td className="p-4 text-right">
                          {coordIdToDelete === coord.id ? (
                            <div className="inline-flex gap-1.5 items-center">
                              <button onClick={() => { onDeleteCoordinator(coord.id); setCoordIdToDelete(null); }} className="bg-rose-600 text-white text-xs px-2 py-1 rounded cursor-pointer font-bold">Confirm</button>
                              <button onClick={() => setCoordIdToDelete(null)} className="bg-slate-200 text-slate-700 text-xs px-2 py-1 rounded cursor-pointer font-bold">No</button>
                            </div>
                          ) : (
                            <button onClick={() => setCoordIdToDelete(coord.id)} className="text-rose-500 hover:text-rose-700 p-1 bg-rose-50 rounded-lg cursor-pointer"><TrashIcon /></button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeOfficeTab === 'sql_console' && (
            <SQLConsole supabase={supabase} />
          )}
        </div>
      );
    }

    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
</html>
