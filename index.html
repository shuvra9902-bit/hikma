<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hikma International School - Lesson Plan Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        color: black !important;
      }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.4/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Initialize Supabase Client Connection
    const SUPABASE_URL = "https://noddojjnufbemzdqukjr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vZGRvampudWZiZW16ZHF1a2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDg3NTQsImV4cCI6MjA5NjEyNDc1NH0.bdVOO10mcwAaV2R26aGG-vhRBkef-Su37x0oJagsGDM";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Config defaults
    const CLASSES = ['Play Group', 'Nursery', 'KG', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'SSC'];
    const SECTIONS = ['A', 'B', 'C', 'Gold', 'Silver'];
    const SHIFTS = ['Morning', 'Day'];
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WEEKS_IN_MONTH = ['Week 1', 'Week 2', 'Week 3', 'Week 4'];

    const SEED_TEACHERS = [
      { id: 'teach_1', teacher_name: 'Mustafa Rahman' },
      { id: 'teach_2', teacher_name: 'Dr. Fatema Nasrin' },
      { id: 'teach_3', teacher_name: 'Sheikh Abdullah' },
      { id: 'teach_4', teacher_name: 'Rumana Chowdhury' },
      { id: 'teach_5', teacher_name: 'Farhan Ahmed' },
    ];

    const SEED_PLANS = [
      {
        id: 'seed_plan_1',
        teacher_name: 'Mustafa Rahman',
        class_name: 'KG',
        section: 'A',
        shift: 'Morning',
        subject_name: 'English Writing',
        lesson_date: new Date().toISOString().split('T')[0],
        month_name: 'January',
        week_number: 'Week 1',
        class_work: 'Practiced tracing lowercase letters a to f on the whiteboard. Spelled simple vocabulary: cat, dog, sun. (অ্যালফাবেট লিখতে সাহায্য করা হয়েছে ও বোর্ডে অনুশীলন করানো হয়েছে।)',
        homework: 'Practice writing letters a to f in class script copy twice.',
        created_at: Date.now() - 3600000 * 2,
      },
      {
        id: 'seed_plan_2',
        teacher_name: 'Dr. Fatema Nasrin',
        class_name: 'Play Group',
        section: 'B',
        shift: 'Morning',
        subject_name: 'Arts & Crafts',
        lesson_date: new Date().toISOString().split('T')[0],
        month_name: 'January',
        week_number: 'Week 1',
        class_work: 'Completed fingerprint painting of trees using water-soluble organic colors. Encouraged collaboration and neat clean-up. (আঙুলের ছাপ দিয়ে রঙিন ছবি আঁকার অনুশীলন)।',
        homework: 'Collect three fall leaves and glue them on clean drawing paper.',
        created_at: Date.now() - 3600000 * 5,
      }
    ];

    // High fidelity school logo SVG
    function Logo({ className = "h-12 w-12" }) {
      return (
        <svg viewBox="0 0 320 300" className={className} xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="100" height="300" fill="#0082C8" rx="4" />
          <rect x="110" y="0" width="100" height="300" fill="#0082C8" rx="4" />
          <rect x="220" y="0" width="100" height="300" fill="#0082C8" rx="4" />
          <path d="M 0,0 L 100,0 L 100,102.4 Q 50,110.5 0,105 Z" fill="#046582" />
          <path d="M 110,0 L 210,0 L 210,81.3 Q 160,93.5 110,101.4 Z" fill="#942A2D" />
          <path d="M 220,0 L 320,0 L 320,35 Q 270,59.3 220,79.1 Z" fill="#046582" />
          <path d="M 0,105 Q 160,115 320,35" stroke="#FFFFFF" strokeWidth="8" fill="none" strokeLinecap="round" />
          <text x="50" y="225" fill="#FFFFFF" fontFamily="'Times New Roman', Georgia, serif" fontWeight="bold" fontSize="88" textAnchor="middle">H</text>
          <text x="160" y="225" fill="#FFFFFF" fontFamily="'Times New Roman', Georgia, serif" fontWeight="bold" fontSize="88" textAnchor="middle">I</text>
          <text x="270" y="225" fill="#FFFFFF" fontFamily="'Times New Roman', Georgia, serif" fontWeight="bold" fontSize="88" textAnchor="middle">S</text>
        </svg>
      );
    }

    // SVG Icons
    function BookOpenIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>; }
    function ShieldIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2A1 1 0 0 1 20 6z"/></svg>; }
    function LogOutIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>; }
    function TrashIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>; }
    function EditIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/></svg>; }
    function PrinterIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>; }
    function FileDownIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>; }
    function SearchIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>; }
    function PlusIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>; }

    function App() {
      const [activeTab, setActiveTab] = useState('teacher');
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => localStorage.getItem('hikma_admin_auth') === 'true');
      const [teachers, setTeachers] = useState([]);
      const [plans, setPlans] = useState([]);
      
      const [globalMonth, setGlobalMonth] = useState(() => localStorage.getItem('hikma_current_month_html') || 'January');
      const [globalWeek, setGlobalWeek] = useState(() => localStorage.getItem('hikma_current_week_html') || 'Week 1');

      // Fetch cloud data from Supabase on launch
      useEffect(() => {
        async function fetchInitialData() {
          try {
            // Load Teachers
            let { data: dbTeachers, error: tErr } = await supabaseClient.from('hikma_teachers').select('*');
            if (tErr) throw tErr;
            if (dbTeachers && dbTeachers.length > 0) {
              setTeachers(dbTeachers);
            } else {
              setTeachers(SEED_TEACHERS);
            }

            // Load Plans
            let { data: dbPlans, error: pErr } = await supabaseClient.from('hikma_plans').select('*').order('created_at', { ascending: false });
            if (pErr) throw pErr;
            if (dbPlans) {
              setPlans(dbPlans);
            } else {
              setPlans(SEED_PLANS);
            }
          } catch (e) {
            console.warn("Supabase fetch failed, loading local system database backup:", e);
            const cachedT = localStorage.getItem('hikma_teachers_roster_html');
            const cachedP = localStorage.getItem('hikma_lessons_plans_html');
            setTeachers(cachedT ? JSON.parse(cachedT) : SEED_TEACHERS);
            setPlans(cachedP ? JSON.parse(cachedP) : SEED_PLANS);
          }
        }
        fetchInitialData();
      }, []);

      // Backup local cache syncs
      useEffect(() => { if (teachers.length > 0) localStorage.setItem('hikma_teachers_roster_html', JSON.stringify(teachers)); }, [teachers]);
      useEffect(() => { if (plans.length > 0) localStorage.setItem('hikma_lessons_plans_html', JSON.stringify(plans)); }, [plans]);
      useEffect(() => { localStorage.setItem('hikma_admin_auth', String(isAdminLoggedIn)); }, [isAdminLoggedIn]);
      useEffect(() => { localStorage.setItem('hikma_current_month_html', globalMonth); }, [globalMonth]);
      useEffect(() => { localStorage.setItem('hikma_current_week_html', globalWeek); }, [globalWeek]);

      const handleAddPlan = async (newPlan) => {
        setPlans((prev) => [newPlan, ...prev]);
        try { await supabaseClient.from('hikma_plans').insert([newPlan]); } catch(e) { console.error(e); }
      };

      const handleUpdatePlan = async (updatedPlan) => {
        setPlans((prev) => prev.map((p) => (p.id === updatedPlan.id ? updatedPlan : p)));
        try { await supabaseClient.from('hikma_plans').update(updatedPlan).eq('id', updatedPlan.id); } catch(e) { console.error(e); }
      };

      const handleDeletePlan = async (id) => {
        setPlans((prev) => prev.filter((p) => p.id !== id));
        try { await supabaseClient.from('hikma_plans').delete().eq('id', id); } catch(e) { console.error(e); }
      };

      const handleAddTeacher = async (name) => {
        const newTeach = { id: 'teach_' + Date.now(), teacher_name: name };
        setTeachers((prev) => [...prev, newTeach]);
        try { await supabaseClient.from('hikma_teachers').insert([newTeach]); } catch(e) { console.error(e); }
      };

      const handleDeleteTeacher = async (id) => {
        setTeachers((prev) => prev.filter((t) => t.id !== id));
        try { await supabaseClient.from('hikma_teachers').delete().eq('id', id); } catch(e) { console.error(e); }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans pb-12">
          <header className="bg-slate-900 border-b border-slate-800 text-white shadow-xl no-print mt-4 rounded-2xl mx-4 px-4 py-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-4">
                <div className="bg-white p-2 rounded-xl shadow-md shrink-0 flex items-center justify-center">
                  <Logo className="h-[56px] w-[56px]" />
                </div>
                <div className="text-left">
                  <h1 className="text-lg sm:text-xl font-bold font-display tracking-tight text-white">Hikma International School</h1>
                  <p className="text-xs sm:text-sm text-sky-400 font-medium mt-1">Weekly Lesson Plan Portal • স্কুল পোর্টাল</p>
                </div>
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto justify-end">
                <button
                  onClick={() => setActiveTab('teacher')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm cursor-pointer flex-1 sm:flex-initial ${activeTab === 'teacher' ? 'bg-sky-600 text-white shadow-lg' : 'bg-slate-800 text-slate-300'}`}
                >
                  <BookOpenIcon /> <span>Teacher Portal</span>
                </button>

                {isAdminLoggedIn ? (
                  <div className="flex items-center gap-3 flex-1 sm:flex-initial">
                    <button
                      onClick={() => setActiveTab('admin')}
                      className={`flex-1 sm:flex-initial flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm cursor-pointer ${activeTab === 'admin' ? 'bg-rose-600 text-white shadow-lg' : 'bg-slate-800 text-slate-300'}`}
                    >
                      <ShieldIcon /> <span>Headmaster Office</span>
                    </button>
                    <button onClick={() => { setIsAdminLoggedIn(false); setActiveTab('teacher'); }} className="p-2.5 bg-slate-800 text-red-400 rounded-xl cursor-pointer"><LogOutIcon /></button>
                  </div>
                ) : (
                  <button onClick={() => setActiveTab('admin')} className="flex-1 sm:flex-initial bg-slate-800 text-slate-300 flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm cursor-pointer"><ShieldIcon /> <span>Headmaster Office</span></button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'teacher' ? (
              <TeacherPortal
                teachersList={teachers}
                lessonPlans={plans}
                onAddPlan={handleAddPlan}
                onUpdatePlan={handleUpdatePlan}
                onDeletePlan={handleDeletePlan}
                globalMonth={globalMonth}
                globalWeek={globalWeek}
                onGlobalMonthChange={setGlobalMonth}
                onGlobalWeekChange={setGlobalWeek}
              />
            ) : (
              <HeadmasterPortal
                isAdminLoggedIn={isAdminLoggedIn}
                teachersList={teachers}
                lessonPlans={plans}
                onLogin={(pass) => { if (pass === 'hikma123') { setIsAdminLoggedIn(true); return true; } return false; }}
                onAddTeacher={handleAddTeacher}
                onDeleteTeacher={handleDeleteTeacher}
                globalMonth={globalMonth}
                globalWeek={globalWeek}
                onGlobalMonthChange={setGlobalMonth}
                onGlobalWeekChange={setGlobalWeek}
              />
            )}
          </main>
          <footer className="w-full text-center py-6 mt-12 border-t text-slate-500 font-semibold text-xs no-print">
            <div className="max-w-7xl mx-auto"><span>Developed by Chinmoy</span></div>
          </footer>
        </div>
      );
    }

    function TeacherPortal({ teachersList, lessonPlans, onAddPlan, onUpdatePlan, onDeletePlan, globalMonth, globalWeek, onGlobalMonthChange, onGlobalWeekChange }) {
      const [selectedTeacher, setSelectedTeacher] = useState('');
      const [selectedClass, setSelectedClass] = useState(CLASSES[0]);
      const [section, setSection] = useState(SECTIONS[0]);
      const [shift, setShift] = useState('Morning');
      const [subjectName, setSubjectName] = useState('');
      const [classDate, setClassDate] = useState(() => new Date().toISOString().split('T')[0]);
      
      const [monthName, setMonthName] = useState(globalMonth);
      const [weekNumber, setWeekNumber] = useState(globalWeek);
      
      const [classWork, setClassWork] = useState('');
      const [hasHomework, setHasHomework] = useState(false);
      const [homeworkText, setHomeworkText] = useState('');

      const [editingPlanId, setEditingPlanId] = useState(null);
      const [planIdToDelete, setPlanIdToDelete] = useState(null);
      const [successMsg, setSuccessMsg] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterClass, setFilterClass] = useState('All');
      const [currentPage, setCurrentPage] = useState(1);

      useEffect(() => { if (!editingPlanId) { setMonthName(globalMonth); setWeekNumber(globalWeek); } }, [globalMonth, globalWeek, editingPlanId]);
      useEffect(() => { setCurrentPage(1); }, [filterClass, searchQuery, globalMonth, globalWeek]);

      const handleEditClick = (plan) => {
        setEditingPlanId(plan.id);
        setSelectedTeacher(plan.teacher_name);
        setSelectedClass(plan.class_name);
        setSection(plan.section);
        setShift(plan.shift);
        setSubjectName(plan.subject_name);
        setClassDate(plan.lesson_date);
        setMonthName(plan.month_name || 'January');
        setWeekNumber(plan.week_number);
        setClassWork(plan.class_work);
        if (plan.homework && plan.homework !== 'No Homework') {
          setHasHomework(true);
          setHomeworkText(plan.homework);
        } else {
          setHasHomework(false);
          setHomeworkText('');
        }
        window.scrollTo({ top: 300, behavior: 'smooth' });
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!selectedTeacher || !subjectName.trim() || !classWork.trim()) {
          setErrorMsg('Please complete all required entries.');
          return;
        }

        const payload = {
          id: editingPlanId || 'plan_' + Date.now(),
          teacher_name: selectedTeacher,
          class_name: selectedClass,
          section,
          shift,
          subject_name: subjectName.trim(),
          lesson_date: classDate,
          month_name: monthName,
          week_number: weekNumber,
          class_work: classWork.trim(),
          homework: hasHomework && homeworkText.trim() ? homeworkText.trim() : 'No Homework',
          created_at: Date.now()
        };

        if (editingPlanId) {
          onUpdatePlan(payload);
          setSuccessMsg('Lesson plan updated successfully in Supabase!');
          setEditingPlanId(null);
        } else {
          onAddPlan(payload);
          setSuccessMsg('Lesson plan saved to cloud database!');
        }
        setSubjectName(''); setClassWork(''); setHasHomework(false); setHomeworkText('');
      };

      const filteredPlans = useMemo(() => {
        return lessonPlans.filter(plan => {
          const matchSearch = plan.subject_name.toLowerCase().includes(searchQuery.toLowerCase()) || plan.teacher_name.toLowerCase().includes(searchQuery.toLowerCase());
          const matchClass = filterClass === 'All' || plan.class_name === filterClass;
          const matchDateFilter = (plan.month_name || 'January') === globalMonth && plan.week_number === globalWeek;
          return matchSearch && matchClass && matchDateFilter;
        });
      }, [lessonPlans, searchQuery, filterClass, globalMonth, globalWeek]);

      const paginatedPlans = useMemo(() => {
        const start = (currentPage - 1) * 10;
        return filteredPlans.slice(start, start + 10);
      }, [filteredPlans, currentPage]);

      return (
        <div className="space-y-8 text-left animate-fade-in">
          <div className="bg-slate-900 rounded-3xl p-6 text-white shadow-xl">
            <h2 className="text-xl font-bold font-display flex items-center gap-2"><BookOpenIcon /><span>Teacher Dashboard Portal</span></h2>
            <p className="text-sm text-slate-300 mt-2">Log curriculum targets and student assignments. Data is persistently hosted inside Supabase database infrastructure.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 bg-white rounded-3xl border p-6 space-y-6">
              <h3 className="text-base font-bold text-slate-900 border-b pb-2">{editingPlanId ? 'Edit Existing Lesson Entry' : 'Record Classroom Lesson Plan'}</h3>
              <form onSubmit={handleFormSubmit} className="space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Teacher</label>
                    <select value={selectedTeacher} onChange={e => setSelectedTeacher(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11" required>
                      <option value="">-- Choose Teacher --</option>
                      {teachersList.map(t => <option key={t.id} value={t.teacher_name}>{t.teacher_name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
                    <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11">{CLASSES.map(c => <option key={c} value={c}>Class {c}</option>)}</select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
                    <select value={section} onChange={e => setSection(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11">{SECTIONS.map(s => <option key={s} value={s}>Section {s}</option>)}</select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Shift</label>
                    <select value={shift} onChange={e => setShift(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11">{SHIFTS.map(s => <option key={s} value={s}>{s} Shift</option>)}</select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Subject</label>
                    <input type="text" value={subjectName} onChange={e => setSubjectName(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11" required />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Date</label>
                    <input type="date" value={classDate} onChange={e => setClassDate(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11" required />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">1. Choose Targeted Month</label>
                    <select value={monthName} onChange={e => setMonthName(e.target.value)} className="w-full bg-white border px-3 py-2 rounded-xl text-sm h-11 font-medium shadow-sm">
                      {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">2. Choose Monthly Week</label>
                    <select value={weekNumber} onChange={e => setWeekNumber(e.target.value)} className="w-full bg-white border px-3 py-2 rounded-xl text-sm h-11 font-medium shadow-sm">
                      {WEEKS_IN_MONTH.map(w => <option key={w} value={w}>{w} (4-Week Cycle)</option>)}
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Class Work Details</label>
                  <textarea value={classWork} onChange={e => setClassWork(e.target.value)} className="w-full bg-slate-50 border p-3 rounded-xl text-sm min-h-[90px]" required />
                </div>

                <div className="space-y-2">
                  <div onClick={() => setHasHomework(!hasHomework)} className="flex items-center space-x-3 bg-slate-50 p-3 rounded-xl border cursor-pointer select-none">
                    <input type="checkbox" checked={hasHomework} onChange={e => setHasHomework(e.target.checked)} className="h-4 w-4" />
                    <span className="text-sm font-semibold">Assign Home Tasks?</span>
                  </div>
                  {hasHomework && <textarea value={homeworkText} onChange={e => setHomeworkText(e.target.value)} className="w-full bg-slate-50 border p-3 rounded-xl text-sm min-h-[60px]" placeholder="Homework details..." />}
                </div>

                <div className="flex justify-between items-center pt-2">
                  <div className="flex-grow mr-4">
                    {successMsg && <div className="text-emerald-800 bg-emerald-50 text-xs p-2.5 rounded-xl">{successMsg}</div>}
                    {errorMsg && <div className="text-rose-800 bg-rose-50 text-xs p-2.5 rounded-xl">{errorMsg}</div>}
                  </div>
                  <button type="submit" className="bg-slate-900 text-white font-bold py-2.5 px-5 rounded-xl text-sm shrink-0">
                    {editingPlanId ? 'Save Updates' : 'Publish Plan'}
                  </button>
                </div>
              </form>
            </div>

            <div className="bg-white p-6 rounded-3xl border space-y-4">
              <h4 className="font-bold text-slate-900 border-b pb-2 flex items-center gap-1.5"><BookOpenIcon /> Portal Information</h4>
              <p className="text-xs text-slate-600 leading-relaxed">Your application points natively to Supabase server references. Every update updates both table indexes and live browser caches instantaneously.</p>
              <div className="bg-sky-50 text-sky-950 p-4 rounded-xl text-xs font-medium">✨ Calendar tracking runs strictly in localized 4-week monthly bounds rather than continuous year numbers.</div>
            </div>
          </div>

          <div className="bg-white rounded-3xl border p-6 space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between border-b pb-4 gap-4">
              <h3 className="text-base font-bold text-slate-900">Live Lesson Directory</h3>
              <div className="flex gap-2">
                <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Search..." className="border px-3 py-1.5 rounded-xl text-xs bg-slate-50 w-44 h-10" />
                <select value={filterClass} onChange={e => setFilterClass(e.target.value)} className="border rounded-xl text-xs bg-slate-50 h-10">
                  <option value="All">All Classes</option>
                  {CLASSES.map(c => <option key={c} value={c}>Class {c}</option>)}
                </select>
              </div>
            </div>

            {/* Active Time Horizon Banner */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900 p-4 rounded-2xl text-white shadow-md">
              <div className="flex items-center space-x-2">
                <span className="text-sm font-semibold text-slate-300">Viewing Records for:</span>
                <span className="bg-sky-600 text-white text-xs font-bold px-3 py-1 rounded-md">{globalMonth} — {globalWeek}</span>
              </div>
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center space-x-1">
                  <span className="text-xs text-slate-400 font-medium">Month:</span>
                  <select value={globalMonth} onChange={e => onGlobalMonthChange(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-lg p-1 text-xs text-white cursor-pointer">
                    {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>
                <div className="flex items-center space-x-1">
                  <span className="text-xs text-slate-400 font-medium">Week:</span>
                  <select value={globalWeek} onChange={e => onGlobalWeekChange(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-lg p-1 text-xs text-white cursor-pointer">
                    {WEEKS_IN_MONTH.map(w => <option key={w} value={w}>{w}</option>)}
                  </select>
                </div>
              </div>
            </div>

            <div className="overflow-x-auto rounded-xl border">
              <table className="w-full text-left text-sm border-collapse">
                <thead className="bg-slate-50">
                  <tr>
                    <th className="p-4 font-bold border-b">Schedule</th>
                    <th className="p-4 font-bold border-b">Subject/Class</th>
                    <th className="p-4 font-bold border-b">Class Work Details</th>
                    <th className="p-4 font-bold border-b">Homework Task</th>
                    <th className="p-4 font-bold border-b text-center">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y">
                  {paginatedPlans.length === 0 ? (
                    <tr><td colSpan="5" className="p-8 text-center text-slate-400">No matching plans on file for {globalMonth}, {globalWeek}.</td></tr>
                  ) : (
                    paginatedPlans.map(plan => (
                      <tr key={plan.id} className="hover:bg-slate-50/40">
                        <td className="p-4">
                          <b>{plan.lesson_date}</b>
                          <div className="text-xs text-slate-500 mt-0.5">By: {plan.teacher_name}</div>
                        </td>
                        <td className="p-4">
                          <span className="bg-sky-50 text-sky-800 text-[11px] font-bold px-2 py-0.5 rounded border">Class {plan.class_name} ({plan.section})</span>
                          <div className="font-bold text-slate-700 mt-1">{plan.subject_name}</div>
                        </td>
                        <td className="p-4 text-xs max-w-sm whitespace-pre-wrap">{plan.class_work}</td>
                        <td className="p-4 text-xs italic text-slate-700">{plan.homework === 'No Homework' ? <span className="text-slate-400">None</span> : plan.homework}</td>
                        <td className="p-4 text-center">
                          <div className="inline-flex gap-2">
                            {planIdToDelete === plan.id ? (
                              <div className="flex items-center gap-1">
                                <button onClick={() => { onDeletePlan(plan.id); setPlanIdToDelete(null); }} className="bg-rose-600 text-white px-2 py-0.5 rounded text-xs">Confirm</button>
                                <button onClick={() => setPlanIdToDelete(null)} className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-xs">Cancel</button>
                              </div>
                            ) : (
                              <>
                                <button onClick={() => handleEditClick(plan)} className="text-sky-500 bg-sky-50 p-1.5 rounded-lg"><EditIcon /></button>
                                <button onClick={() => setPlanIdToDelete(plan.id)} className="text-rose-500 bg-rose-50 p-1.5 rounded-lg"><TrashIcon /></button>
                              </>
                            )}
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function HeadmasterPortal({ isAdminLoggedIn, teachersList, lessonPlans, onLogin, onAddTeacher, onDeleteTeacher, globalMonth, globalWeek, onGlobalMonthChange, onGlobalWeekChange }) {
      const [passInput, setPassInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [officeTab, setOfficeTab] = useState('routine');
      const [newTeacherName, setNewTeacherName] = useState('');
      const [teacherIdToDelete, setTeacherIdToDelete] = useState(null);

      const [targetClass, setTargetClass] = useState('');
      const [targetSection, setTargetSection] = useState('');
      const [targetShift, setTargetShift] = useState('');
      const [targetMonth, setTargetMonth] = useState(globalMonth);
      const [targetWeek, setTargetWeek] = useState(globalWeek);

      const routineSearchReady = targetClass && targetSection && targetShift && targetMonth && targetWeek;

      const filteredRoutinePlans = useMemo(() => {
        if (!routineSearchReady) return [];
        return lessonPlans.filter(p => p.class_name === targetClass && p.section === targetSection && p.shift === targetShift && (p.month_name || 'January') === targetMonth && p.week_number === targetWeek);
      }, [lessonPlans, targetClass, targetSection, targetShift, targetMonth, targetWeek, routineSearchReady]);

      if (!isAdminLoggedIn) {
        return (
          <div className="max-w-md mx-auto bg-white p-8 rounded-3xl border text-left space-y-4 shadow-xl">
            <h3 className="text-lg font-bold text-center flex justify-center items-center gap-1.5"><ShieldIcon /> Office Passcode Vault</h3>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 p-2 rounded-xl text-center font-bold">{loginError}</p>}
            <form onSubmit={e => { e.preventDefault(); if (!onLogin(passInput)) setLoginError('Incorrect passcode! Try "hikma123"'); }} className="space-y-4">
              <input type="password" value={passInput} onChange={e => setPassInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm" placeholder="Passcode (hikma123)" required />
              <button type="submit" className="w-full bg-rose-600 font-bold text-white py-2.5 rounded-xl text-sm">Unlock Dashboard</button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-6 text-left animate-fade-in">
          <div className="flex bg-slate-200 p-1 rounded-xl max-w-md border no-print">
            <button onClick={() => setOfficeTab('routine')} className={`flex-1 py-1.5 px-3 text-xs font-bold rounded-lg ${officeTab === 'routine' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>Review Log Routines</button>
            <button onClick={() => setOfficeTab('teachers')} className={`flex-1 py-1.5 px-3 text-xs font-bold rounded-lg ${officeTab === 'teachers' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>Faculty Registry</button>
          </div>

          {officeTab === 'routine' ? (
            <div className="space-y-6">
              <div className="bg-white p-6 rounded-3xl border space-y-4 no-print">
                <h3 className="font-bold text-slate-900 flex items-center gap-1.5"><SearchIcon /> Set Verification Audit Parameters</h3>
                <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
                    <select value={targetClass} onChange={e => setTargetClass(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl text-xs h-10">
                      <option value="">-- Select --</option>{CLASSES.map(c => <option key={c} value={c}>Class {c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
                    <select value={targetSection} onChange={e => setTargetSection(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl text-xs h-10">
                      <option value="">-- Select --</option>{SECTIONS.map(s => <option key={s} value={s}>Section {s}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Shift</label>
                    <select value={targetShift} onChange={e => setTargetShift(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl text-xs h-10">
                      <option value="">-- Select --</option>{SHIFTS.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Month</label>
                    <select value={targetMonth} onChange={e => setTargetMonth(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl text-xs h-10">
                      {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Week</label>
                    <select value={targetWeek} onChange={e => setTargetWeek(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl text-xs h-10">
                      {WEEKS_IN_MONTH.map(w => <option key={w} value={w}>{w}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              {routineSearchReady ? (
                <div className="bg-white rounded-3xl border p-6 space-y-4" id="printable-report-card">
                  <div className="flex justify-between items-center border-b pb-3 no-print">
                    <h4 className="font-bold text-slate-900">Compiled Syllabus Worksheet</h4>
                    <button onClick={() => window.print()} className="bg-slate-900 text-white font-bold text-xs px-4 py-2 rounded-xl"><PrinterIcon /> Print / PDF</button>
                  </div>

                  <div className="text-center pb-4 border-b-2 border-slate-800 space-y-2">
                    <h2 className="text-xl font-extrabold text-indigo-900 tracking-wide uppercase">Hikma International School</h2>
                    <p className="text-xs text-slate-600 font-bold">Class Routine Tracker Audit Summary</p>
                    <div className="text-xs bg-slate-100 px-3 py-1.5 rounded-xl inline-block font-semibold">
                      Class: {targetClass} | Section: {targetSection} | {targetShift} Shift | Timeline: {targetMonth}, {targetWeek}
                    </div>
                  </div>

                  {filteredRoutinePlans.length === 0 ? (
                    <p className="text-center text-slate-400 py-6 italic">No recorded lesson plans found for this filter scope.</p>
                  ) : (
                    <table className="w-full text-sm text-left">
                      <thead>
                        <tr className="bg-slate-50 border-b">
                          <th className="p-3 font-bold">Date</th>
                          <th className="p-3 font-bold">Educator</th>
                          <th className="p-3 font-bold">Subject</th>
                          <th className="p-3 font-bold">Class Work Description</th>
                          <th className="p-3 font-bold">Homework</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {filteredRoutinePlans.map(p => (
                          <tr key={p.id}>
                            <td className="p-3"><b>{p.lesson_date}</b></td>
                            <td className="p-3 text-indigo-900 font-semibold">{p.teacher_name}</td>
                            <td className="p-3 font-bold">{p.subject_name}</td>
                            <td className="p-3 text-xs whitespace-pre-wrap">{p.class_work}</td>
                            <td className="p-3 text-xs italic">{p.homework}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              ) : (
                <div className="bg-slate-100 p-8 rounded-2xl text-center text-slate-400 text-sm">Please select Class, Section, Shift, Month, and Week options to view data.</div>
              )}
            </div>
          ) : (
            <div className="bg-white border p-6 rounded-3xl space-y-4 max-w-xl mx-auto">
              <h3 className="font-bold border-b pb-2 text-slate-900">Faculty Registry Management</h3>
              <form onSubmit={e => { e.preventDefault(); if (newTeacherName.trim()) { onAddTeacher(newTeacherName.trim()); setNewTeacherName(''); } }} className="flex gap-2">
                <input type="text" value={newTeacherName} onChange={e => setNewTeacherName(e.target.value)} placeholder="Full Faculty Name..." className="border p-2 rounded-xl text-xs flex-grow bg-slate-50" required />
                <button type="submit" className="bg-slate-900 text-white font-bold text-xs px-4 rounded-xl flex items-center gap-1"><PlusIcon /> Add</button>
              </form>
              <div className="border rounded-xl overflow-hidden mt-2">
                <table className="w-full text-left text-xs divide-y">
                  <thead className="bg-slate-50">
                    <tr><th className="p-3">Teacher Roster Name</th><th className="p-3 text-right">System Action</th></tr>
                  </thead>
                  <tbody className="divide-y">
                    {teachersList.map(t => (
                      <tr key={t.id}>
                        <td className="p-3 font-bold text-slate-700">{t.teacher_name}</td>
                        <td className="p-3 text-right">
                          {teacherIdToDelete === t.id ? (
                            <div className="inline-flex gap-2 items-center">
                              <span className="text-xs font-bold text-rose-600">Delete?</span>
                              <button onClick={() => { onDeleteTeacher(t.id); setTeacherIdToDelete(null); }} className="bg-rose-600 text-white px-2 py-0.5 rounded text-[10px]">Yes</button>
                              <button onClick={() => setTeacherIdToDelete(null)} className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-[10px]">No</button>
                            </div>
                          ) : (
                            <button onClick={() => setTeacherIdToDelete(t.id)} className="text-rose-500 hover:text-rose-700 p-1 bg-rose-50 rounded-md"><TrashIcon /></button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
