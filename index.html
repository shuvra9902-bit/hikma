<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hikma International School - Lesson Plan Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        color: black !important;
      }
      .print-visible {
        display: block !important;
      }
      #printable-report-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.4/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CLASSES = ['Play Group', 'Nursery', 'KG', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'SSC'];
    const SECTIONS = ['A', 'B', 'C', 'Gold', 'Silver'];
    const SHIFTS = ['Morning', 'Day'];
    const WEEKS = Array.from({ length: 52 }, (_, i) => `Week ${i + 1}`);

    const SEED_TEACHERS = [
      { id: 'teach_1', teacher_id: 't101', teacher_name: 'Mustafa Rahman', passcode: 'hikma11' },
      { id: 'teach_2', teacher_id: 't102', teacher_name: 'Dr. Fatema Nasrin', passcode: 'hikma22' },
      { id: 'teach_3', teacher_id: 't103', teacher_name: 'Sheikh Abdullah', passcode: 'hikma33' },
      { id: 'teach_4', teacher_id: 't104', teacher_name: 'Rumana Chowdhury', passcode: 'hikma44' },
      { id: 'teach_5', teacher_id: 't105', teacher_name: 'Farhan Ahmed', passcode: 'hikma55' },
    ];

    const SEED_PLANS = [
      {
        id: 'seed_plan_1',
        teacher_name: 'Mustafa Rahman',
        class_name: 'KG',
        section: 'A',
        shift: 'Morning',
        subject_name: 'English Writing',
        lesson_date: new Date().toISOString().split('T')[0],
        week_number: 'Week 1',
        class_work: 'Practiced tracing lowercase letters a to f on the whiteboard. Spelled simple vocabulary: cat, dog, sun. (অ্যালফাবেট লিখতে সাহায্য করা হয়েছে ও বোর্ডে অনুশীলন করানো হয়েছে।)',
        homework: 'Practice writing letters a to f in class script copy twice.',
        created_at: Date.now() - 7200000,
      },
      {
        id: 'seed_plan_2',
        teacher_name: 'Dr. Fatema Nasrin',
        class_name: 'Play Group',
        section: 'B',
        shift: 'Morning',
        subject_name: 'Arts & Crafts',
        lesson_date: new Date().toISOString().split('T')[0],
        week_number: 'Week 1',
        class_work: 'Completed fingerprint painting of trees using water-soluble organic colors. Encouraged collaboration and neat clean-up. (আঙুলের ছাপ দিয়ে রঙিন ছবি আঁকার অনুশীলন)।',
        homework: 'Collect three fall leaves and glue them on clean drawing paper.',
        created_at: Date.now() - 18000000,
      }
    ];

    function Logo({ className = "h-12 w-12" }) {
      return (
        <svg viewBox="0 0 320 300" className={className} xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="100" height="300" fill="#0082C8" rx="4" />
          <rect x="110" y="0" width="100" height="300" fill="#0082C8" rx="4" />
          <rect x="220" y="0" width="100" height="300" fill="#0082C8" rx="4" />
          <path d="M 0,0 L 100,0 L 100,102.4 Q 50,110.5 0,105 Z" fill="#046582" />
          <path d="M 110,0 L 210,0 L 210,81.3 Q 160,93.5 110,101.4 Z" fill="#942A2D" />
          <path d="M 220,0 L 320,0 L 320,35 Q 270,59.3 220,79.1 Z" fill="#046582" />
          <path d="M 0,105 Q 160,115 320,35" stroke="#FFFFFF" strokeWidth="8" fill="none" strokeLinecap="round" />
          <text x="50" y="225" fill="#FFFFFF" fontFamily="'Times New Roman', Georgia, serif" fontWeight="bold" fontSize="88" textAnchor="middle">H</text>
          <text x="160" y="225" fill="#FFFFFF" fontFamily="'Times New Roman', Georgia, serif" fontWeight="bold" fontSize="88" textAnchor="middle">I</text>
          <text x="270" y="225" fill="#FFFFFF" fontFamily="'Times New Roman', Georgia, serif" fontWeight="bold" fontSize="88" textAnchor="middle">S</text>
        </svg>
      );
    }

    function BookOpenIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
    }

    function ShieldIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2A1 1 0 0 1 20 6z"/></svg>;
    }

    function LogOutIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    }

    function TrashIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
    }

    function EditIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/></svg>;
    }

    function PrinterIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>;
    }

    function FileDownIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    }

    function SearchIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    }

    function PlusIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    }

    function KeyIcon() {
      return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('teacher');
      
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('hikma_admin_auth') === 'true';
      });

      const [loggedInTeacher, setLoggedInTeacher] = useState(() => {
        const cached = localStorage.getItem('hikma_logged_in_teacher');
        return cached ? JSON.parse(cached) : null;
      });

      const [teachers, setTeachers] = useState(() => {
        const cached = localStorage.getItem('hikma_teachers_roster_html');
        return cached ? JSON.parse(cached) : SEED_TEACHERS;
      });

      const [plans, setPlans] = useState(() => {
        const cached = localStorage.getItem('hikma_lessons_plans_html');
        return cached ? JSON.parse(cached) : SEED_PLANS;
      });

      const [currentWeek, setCurrentWeek] = useState(() => {
        return localStorage.getItem('hikma_current_week_html') || 'Week 1';
      });

      useEffect(() => {
        localStorage.setItem('hikma_teachers_roster_html', JSON.stringify(teachers));
      }, [teachers]);

      useEffect(() => {
        localStorage.setItem('hikma_lessons_plans_html', JSON.stringify(plans));
      }, [plans]);

      useEffect(() => {
        localStorage.setItem('hikma_admin_auth', String(isAdminLoggedIn));
      }, [isAdminLoggedIn]);

      useEffect(() => {
        if (loggedInTeacher) {
          localStorage.setItem('hikma_logged_in_teacher', JSON.stringify(loggedInTeacher));
        } else {
          localStorage.removeItem('hikma_logged_in_teacher');
        }
      }, [loggedInTeacher]);

      useEffect(() => {
        localStorage.setItem('hikma_current_week_html', currentWeek);
      }, [currentWeek]);

      const handleAddPlan = (newPlan) => {
        setPlans((prev) => [newPlan, ...prev]);
      };

      const handleUpdatePlan = (updatedPlan) => {
        setPlans((prev) => prev.map((p) => (p.id === updatedPlan.id ? updatedPlan : p)));
      };

      const handleDeletePlan = (id) => {
        setPlans((prev) => prev.filter((p) => p.id !== id));
      };

      const handleAddTeacher = (name, customId, password) => {
        const newTeach = {
          id: 'teach_' + Date.now(),
          teacher_id: customId.trim(),
          teacher_name: name.trim(),
          passcode: password.trim()
        };
        setTeachers((prev) => [...prev, newTeach]);
      };

      const handleDeleteTeacher = (id) => {
        setTeachers((prev) => prev.filter((t) => t.id !== id));
      };

      const handleAdminLogin = (passcode) => {
        if (passcode === 'hikma123') {
          setIsAdminLoggedIn(true);
          return true;
        }
        return false;
      };

      const handleTeacherLogin = (userId, password) => {
        const matched = teachers.find(
          (t) => t.teacher_id.toLowerCase() === userId.trim().toLowerCase() && t.passcode === password.trim()
        );
        if (matched) {
          setLoggedInTeacher(matched);
          return true;
        }
        return false;
      };

      const handleLogout = () => {
        setIsAdminLoggedIn(false);
        setLoggedInTeacher(null);
        setActiveTab('teacher');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans pb-12">
          <header className="bg-slate-900 border-b border-slate-800 text-white shadow-xl no-print mt-4 md:mt-2 rounded-2xl mx-4 sm:mx-6 md:mx-8 px-4 py-3 md:py-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-4">
                <div className="bg-white p-2 rounded-xl shadow-md shrink-0 flex items-center justify-center">
                  <Logo className="h-[56px] w-[56px]" />
                </div>
                <div className="text-left">
                  <h1 className="text-lg sm:text-xl font-bold font-display tracking-tight text-white">
                    Hikma International School
                  </h1>
                  <p className="text-xs sm:text-sm text-sky-450 font-medium mt-1">
                    Weekly Lesson Plan Portal • স্কুল পোর্টাল
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto justify-end">
                <button
                  onClick={() => setActiveTab('teacher')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'teacher'
                      ? 'bg-sky-600 text-white shadow-lg border border-sky-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <BookOpenIcon />
                  <span>Teacher Portal</span>
                </button>

                <button
                  onClick={() => setActiveTab('admin')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'admin'
                      ? 'bg-rose-600 text-white shadow-lg border border-rose-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <ShieldIcon />
                  <span>Headmaster Office</span>
                </button>

                {(isAdminLoggedIn || loggedInTeacher) && (
                  <button
                    onClick={handleLogout}
                    className="px-4 py-2.5 bg-slate-800 hover:bg-rose-950/40 text-rose-400 font-bold rounded-xl text-sm transition-all border border-slate-700 min-h-[44px] flex items-center justify-center gap-1.5 cursor-pointer"
                  >
                    <LogOutIcon />
                    <span>Sign Out</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'teacher' ? (
              <TeacherPortal
                loggedInTeacher={loggedInTeacher}
                onTeacherLogin={handleTeacherLogin}
                teachersList={teachers}
                lessonPlans={plans}
                onAddPlan={handleAddPlan}
                onUpdatePlan={handleUpdatePlan}
                onDeletePlan={handleDeletePlan}
                currentWeek={currentWeek}
                onCurrentWeekChange={setCurrentWeek}
              />
            ) : (
              <HeadmasterPortal
                isAdminLoggedIn={isAdminLoggedIn}
                teachersList={teachers}
                lessonPlans={plans}
                onLogin={handleAdminLogin}
                onAddTeacher={handleAddTeacher}
                onDeleteTeacher={handleDeleteTeacher}
                currentWeek={currentWeek}
                onCurrentWeekChange={setCurrentWeek}
              />
            )}
          </main>

          <footer className="w-full text-center py-6 mt-12 border-t border-slate-200 text-slate-500 font-semibold text-xs sm:text-sm no-print">
            <div className="max-w-7xl mx-auto px-4">
              <span>Developed by Chinmoy</span>
            </div>
          </footer>
        </div>
      );
    }

    function TeacherPortal({ loggedInTeacher, onTeacherLogin, teachersList, lessonPlans, onAddPlan, onUpdatePlan, onDeletePlan, currentWeek, onCurrentWeekChange }) {
      const [uIdInput, setUIdInput] = useState('');
      const [uPassInput, setUPassInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [selectedTeacher, setSelectedTeacher] = useState('');
      const [selectedClass, setSelectedClass] = useState(CLASSES[0]);
      const [section, setSection] = useState(SECTIONS[0]);
      const [shift, setShift] = useState('Morning');
      const [subjectName, setSubjectName] = useState('');
      const [classDate, setClassDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [weekNumber, setWeekNumber] = useState(currentWeek);
      const [classWork, setClassWork] = useState('');
      const [hasHomework, setHasHomework] = useState(false);
      const [homeworkText, setHomeworkText] = useState('');

      const [editingPlanId, setEditingPlanId] = useState(null);
      const [planIdToDelete, setPlanIdToDelete] = useState(null);

      const [successMsg, setSuccessMsg] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterClass, setFilterClass] = useState('All');
      const [currentPage, setCurrentPage] = useState(1);

      useEffect(() => {
        if (loggedInTeacher) {
          setSelectedTeacher(loggedInTeacher.teacher_name);
        } else {
          setSelectedTeacher('');
        }
      }, [loggedInTeacher]);

      useEffect(() => {
        if (!editingPlanId) {
          setWeekNumber(currentWeek);
        }
      }, [currentWeek, editingPlanId]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const success = onTeacherLogin(uIdInput, uPassInput);
        if (!success) {
          setLoginError('Invalid Teacher ID or Password passcode combination.');
        }
      };

      const handleEditClick = (plan) => {
        setEditingPlanId(plan.id);
        setSelectedTeacher(plan.teacher_name);
        setSelectedClass(plan.class_name);
        setSection(plan.section);
        setShift(plan.shift);
        setSubjectName(plan.subject_name);
        setClassDate(plan.lesson_date);
        setWeekNumber(plan.week_number);
        setClassWork(plan.class_work);
        
        if (plan.homework && plan.homework !== 'No Homework') {
          setHasHomework(true);
          setHomeworkText(plan.homework);
        } else {
          setHasHomework(false);
          setHomeworkText('');
        }
        window.scrollTo({ top: 100, behavior: 'smooth' });
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        const payload = {
          id: editingPlanId || 'plan_' + Date.now(),
          teacher_name: selectedTeacher,
          class_name: selectedClass,
          section,
          shift,
          subject_name: subjectName.trim(),
          lesson_date: classDate,
          week_number: weekNumber,
          class_work: classWork.trim(),
          homework: hasHomework && homeworkText.trim() ? homeworkText.trim() : 'No Homework',
          created_at: Date.now()
        };

        if (editingPlanId) {
          onUpdatePlan(payload);
          setSuccessMsg('Lesson plan successfully updated!');
          setEditingPlanId(null);
        } else {
          onAddPlan(payload);
          setSuccessMsg('Lesson plan successfully submitted!');
        }

        setSubjectName('');
        setClassWork('');
        setHasHomework(false);
        setHomeworkText('');
      };

      const filteredTeacherPlans = useMemo(() => {
        return lessonPlans.filter(plan => {
          const matchSearch = plan.subject_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              plan.teacher_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              plan.class_work.toLowerCase().includes(searchQuery.toLowerCase());
          const matchClass = filterClass === 'All' || plan.class_name === filterClass;
          const matchTab = plan.week_number === currentWeek;
          return matchSearch && matchClass && matchTab;
        });
      }, [lessonPlans, searchQuery, filterClass, currentWeek]);

      const paginatedPlans = useMemo(() => {
        const startIdx = (currentPage - 1) * 10;
        return filteredTeacherPlans.slice(startIdx, startIdx + 10);
      }, [filteredTeacherPlans, currentPage]);

      const totalPages = Math.max(1, Math.ceil(filteredTeacherPlans.length / 10));

      if (!loggedInTeacher) {
        return (
          <div className="max-w-md w-full mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 mt-10 text-left space-y-6 shadow-xl animate-fade-in">
            <h3 className="text-lg font-bold font-display text-slate-900 text-center flex justify-center items-center gap-1.5"><KeyIcon /> Teacher Security Access</h3>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 p-2.5 rounded-xl text-center font-semibold">{loginError}</p>}
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold block mb-1 text-slate-600">Teacher ID / আইডি নম্বর</label>
                <input type="text" value={uIdInput} onChange={e => setUIdInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm" placeholder="e.g. t101" required />
              </div>
              <div>
                <label className="text-xs font-semibold block mb-1 text-slate-600">Password / পাসওয়ার্ড</label>
                <input type="password" value={uPassInput} onChange={e => setUPassInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm" placeholder="••••••••" required />
              </div>
              <button type="submit" className="w-full bg-sky-600 hover:bg-sky-700 font-bold text-white py-3 rounded-xl text-xs sm:text-sm tracking-wide transition-all cursor-pointer">
                Log In
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-8 animate-fade-in text-left">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 text-white shadow-xl">
            <h2 className="text-xl sm:text-2xl font-bold font-display tracking-tight text-white flex items-center gap-2">
              <BookOpenIcon />
              <span>Welcome back, {loggedInTeacher.teacher_name}!</span>
            </h2>
            <p className="text-sm text-slate-300 mt-1">Logged in with Teacher ID: <span className="font-mono text-sky-400 font-bold">{loggedInTeacher.teacher_id}</span></p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 space-y-6">
              <h3 className="text-base sm:text-lg font-bold font-display text-slate-900 border-b pb-2">
                {editingPlanId ? 'Edit Existing Lesson Plan' : 'Record Classroom Activity'}
              </h3>

              <form onSubmit={handleFormSubmit} className="space-y-5">
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Teacher Account</label>
                    <input type="text" value={selectedTeacher} disabled className="w-full bg-slate-100 border px-3 py-2 rounded-xl text-sm h-11 font-bold text-slate-500 cursor-not-allowed" />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
                    <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
                    <select value={section} onChange={e => setSection(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {SECTIONS.map(sec => <option key={sec} value={sec}>Section {sec}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Shift</label>
                    <select value={shift} onChange={e => setShift(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {SHIFTS.map(sh => <option key={sh} value={sh}>{sh} Shift</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Subject</label>
                    <input type="text" value={subjectName} onChange={e => setSubjectName(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11" required />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Date</label>
                    <input type="date" value={classDate} onChange={e => setClassDate(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11" required />
                  </div>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Syllabus Week</label>
                  <select value={weekNumber} onChange={e => setWeekNumber(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                    {WEEKS.map(wk => <option key={wk} value={wk}>{wk}</option>)}
                  </select>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Class Work Details</label>
                  <textarea value={classWork} onChange={e => setClassWork(e.target.value)} className="w-full bg-slate-50 border p-3 rounded-2xl text-sm min-h-[100px]" required />
                </div>

                <div className="space-y-3">
                  <div onClick={() => setHasHomework(!hasHomework)} className="flex items-center space-x-3 bg-slate-50 p-4 rounded-xl border border-slate-200 cursor-pointer select-none">
                    <input type="checkbox" checked={hasHomework} readOnly className="h-5 w-5" />
                    <span className="text-sm font-semibold">Assign Student Homework?</span>
                  </div>
                  {hasHomework && (
                    <div>
                      <label className="text-xs font-semibold text-slate-600 block mb-1">Homework Details</label>
                      <textarea value={homeworkText} onChange={e => setHomeworkText(e.target.value)} className="w-full bg-slate-50 border p-3 rounded-2xl text-sm min-h-[70px]" required />
                    </div>
                  )}
                </div>

                <div className="flex justify-between items-center pt-2">
                  <div className="flex-grow">
                    {successMsg && <div className="text-emerald-800 bg-emerald-50 text-xs p-3 rounded-xl inline-block">{successMsg}</div>}
                    {errorMsg && <div className="text-rose-800 bg-rose-50 text-xs p-3 rounded-xl inline-block">{errorMsg}</div>}
                  </div>
                  <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-6 rounded-xl text-sm cursor-pointer">
                    {editingPlanId ? 'Save Update' : 'Submit Plan'}
                  </button>
                </div>
              </form>
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-200 h-fit">
              <h4 className="font-bold text-slate-900 border-b pb-2 flex items-center gap-1.5"><BookOpenIcon /> Lesson Guidelines</h4>
              <p className="text-xs text-slate-600 mt-3 leading-relaxed">
                Logged workspace entries are tied directly to your teacher account name and automatically sync into the school system matrix.
              </p>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 space-y-6">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
              <h3 className="text-base sm:text-lg font-bold text-slate-900">Your Activity Logs</h3>
              <div className="flex gap-2">
                <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Search..." className="border px-3 py-1.5 rounded-xl text-xs bg-slate-50 w-44" />
                <select value={filterClass} onChange={e => setFilterClass(e.target.value)} className="border rounded-xl text-xs bg-slate-50">
                  <option value="All">All Classes</option>
                  {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                </select>
              </div>
            </div>

            <div className="flex items-center space-x-2 bg-slate-50 p-3 rounded-xl border text-sm no-print">
              <span className="font-bold text-slate-700">Display Filter:</span>
              <select value={currentWeek} onChange={(e) => onCurrentWeekChange(e.target.value)} className="bg-white border rounded px-2 py-1 text-xs font-bold cursor-pointer">
                {WEEKS.map(wk => <option key={wk} value={wk}>{wk}</option>)}
              </select>
            </div>

            <div className="overflow-x-auto rounded-xl border">
              <table className="w-full text-left text-sm border-collapse">
                <thead className="bg-slate-50">
                  <tr>
                    <th className="p-4 font-bold border-b">Schedule</th>
                    <th className="p-4 font-bold border-b">Subject</th>
                    <th className="p-4 font-bold border-b">Class Work Details</th>
                    <th className="p-4 font-bold border-b">Homework Task</th>
                    <th className="p-4 font-bold border-b text-center">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y">
                  {paginatedPlans.length === 0 ? (
                    <tr>
                      <td colSpan="5" className="p-8 text-center text-slate-400">No plans recorded matching this filter.</td>
                    </tr>
                  ) : (
                    paginatedPlans.map(plan => (
                      <tr key={plan.id}>
                        <td className="p-4 whitespace-nowrap">
                          <b>{plan.lesson_date}</b>
                          <div className="text-xs text-slate-400 mt-0.5">{plan.teacher_name}</div>
                        </td>
                        <td className="p-4">
                          <span className="bg-sky-50 text-sky-800 text-[10px] font-bold px-2 py-0.5 rounded border">
                            Class {plan.class_name} ({plan.section})
                          </span>
                          <div className="font-bold text-slate-700 mt-1">{plan.subject_name}</div>
                        </td>
                        <td className="p-4 whitespace-pre-wrap text-xs max-w-sm">{plan.class_work}</td>
                        <td className="p-4 text-xs italic text-slate-600">
                          {plan.homework === 'No Homework' ? <span className="text-slate-300">None</span> : plan.homework}
                        </td>
                        <td className="p-4 text-center">
                          <div className="inline-flex gap-2">
                            {planIdToDelete === plan.id ? (
                              <div className="flex items-center gap-1">
                                <button onClick={() => { onDeletePlan(plan.id); setPlanIdToDelete(null); }} className="bg-rose-600 text-white font-bold px-2 py-0.5 rounded text-xs cursor-pointer">Confirm</button>
                                <button onClick={() => setPlanIdToDelete(null)} className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-xs cursor-pointer">No</button>
                              </div>
                            ) : (
                              <>
                                <button onClick={() => handleEditClick(plan)} disabled={plan.teacher_name !== loggedInTeacher.teacher_name} className={`p-1.5 rounded-lg ${plan.teacher_name === loggedInTeacher.teacher_name ? 'text-sky-500 bg-sky-50 hover:bg-sky-100 cursor-pointer' : 'text-slate-300 cursor-not-allowed'}`}><EditIcon /></button>
                                <button onClick={() => setPlanIdToDelete(plan.id)} disabled={plan.teacher_name !== loggedInTeacher.teacher_name} className={`p-1.5 rounded-lg ${plan.teacher_name === loggedInTeacher.teacher_name ? 'text-rose-500 bg-rose-50 hover:bg-rose-100 cursor-pointer' : 'text-slate-300 cursor-not-allowed'}`}><TrashIcon /></button>
                              </>
                            )}
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
            
            {totalPages > 1 && (
              <div className="flex justify-between items-center pt-2">
                <button disabled={currentPage === 1} onClick={() => setCurrentPage(p => p - 1)} className="px-3 py-1 border rounded text-xs disabled:opacity-40 cursor-pointer">Previous</button>
                <span className="text-xs">Page {currentPage} of {totalPages}</span>
                <button disabled={currentPage === totalPages} onClick={() => setCurrentPage(p => p + 1)} className="px-3 py-1 border rounded text-xs disabled:opacity-40 cursor-pointer">Next</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function HeadmasterPortal({ isAdminLoggedIn, teachersList, lessonPlans, onLogin, onAddTeacher, onDeleteTeacher, currentWeek, onCurrentWeekChange }) {
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [activeOfficeTab, setActiveOfficeTab] = useState('routine');

      const [targetClass, setTargetClass] = useState('');
      const [targetSection, setTargetSection] = useState('');
      const [targetShift, setTargetShift] = useState('');
      const [targetWeek, setTargetWeek] = useState(currentWeek);

      const [newTeacherName, setNewTeacherName] = useState('');
      const [newTeacherId, setNewTeacherId] = useState('');
      const [newTeacherPass, setNewTeacherPass] = useState('');
      const [teacherIdToDelete, setTeacherIdToDelete] = useState(null);
      const [dirAlert, setDirAlert] = useState(null);

      const isSearchParameterSet = !!(targetClass && targetSection && targetShift && targetWeek);

      const filteredRoutinePlans = useMemo(() => {
        if (!isSearchParameterSet) return [];
        return lessonPlans.filter(plan => {
          return plan.class_name === targetClass &&
                 plan.section === targetSection &&
                 plan.shift === targetShift &&
                 plan.week_number === targetWeek;
        });
      }, [lessonPlans, targetClass, targetSection, targetShift, targetWeek, isSearchParameterSet]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const success = onLogin(passwordInput);
        if (!success) {
          setLoginError('Passcode invalid! Enter correct system administrator password.');
        }
      };

      const handleAddTeacherSubmit = (e) => {
        e.preventDefault();
        setDirAlert(null);
        if (!newTeacherName.trim() || !newTeacherId.trim() || !newTeacherPass.trim()) return;
        
        if (teachersList.some(t => t.teacher_id.toLowerCase() === newTeacherId.trim().toLowerCase())) {
          setDirAlert({ type: 'error', text: 'Error: This Teacher ID is already registered.' });
          return;
        }
        
        onAddTeacher(newTeacherName.trim(), newTeacherId.trim(), newTeacherPass.trim());
        setNewTeacherName('');
        setNewTeacherId('');
        setNewTeacherPass('');
        setDirAlert({ type: 'success', text: 'Success: Educator credential profile stored.' });
      };

      if (!isAdminLoggedIn) {
        return (
          <div className="max-w-md w-full mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 mt-10 text-left space-y-6 shadow-xl animate-fade-in">
            <h3 className="text-lg font-bold font-display text-slate-900 text-center flex justify-center items-center gap-1.5"><ShieldIcon /> Verification Gate</h3>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 p-2 rounded-xl text-center font-bold">{loginError}</p>}
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold block mb-1">Office Password / পাসকোড</label>
                <input type="password" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm" placeholder="e.g. hikma123" required />
              </div>
              <button type="submit" className="w-full bg-rose-600 hover:bg-rose-700 font-bold text-white py-3 rounded-xl text-xs sm:text-sm cursor-pointer">Authorize</button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-6 animate-fade-in text-left">
          <div className="flex bg-slate-200 p-1.5 rounded-2xl max-w-md border no-print">
            <button onClick={() => setActiveOfficeTab('routine')} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer ${activeOfficeTab === 'routine' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>Check Routine</button>
            <button onClick={() => setActiveOfficeTab('teachers')} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer ${activeOfficeTab === 'teachers' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>Teachers List</button>
          </div>

          {activeOfficeTab === 'routine' ? (
            <div className="space-y-6">
              <div className="bg-white p-6 rounded-3xl border space-y-4 no-print">
                <h3 className="font-bold text-slate-900 flex items-center gap-1.5"><SearchIcon /> Select Routine Filters</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
                    <select value={targetClass} onChange={e => setTargetClass(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                      <option value="">-- Choose Class --</option>
                      {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
                    <select value={targetSection} onChange={e => setTargetSection(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                      <option value="">-- Choose Section --</option>
                      {SECTIONS.map(sec => <option key={sec} value={sec}>Section {sec}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Shift</label>
                    <select value={targetShift} onChange={e => setTargetShift(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                      <option value="">-- Choose Shift --</option>
                      {SHIFTS.map(sh => <option key={sh} value={sh}>{sh} Shift</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Week</label>
                    <select value={targetWeek} onChange={e => setTargetWeek(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                      {WEEKS.map(wk => <option key={wk} value={wk}>{wk}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              {isSearchParameterSet ? (
                <div className="bg-white rounded-3xl border p-6 sm:p-8 space-y-6 shadow-sm" id="printable-report-card">
                  <div className="flex md:items-center md:justify-between border-b pb-4 gap-4 no-print flex-wrap">
                    <h4 className="font-bold text-slate-900">Syllabus Sheet Output</h4>
                    <button onClick={() => window.print()} className="flex items-center gap-1.5 px-4 py-2 bg-slate-900 text-white font-bold text-xs sm:text-sm rounded-xl cursor-pointer">
                      <PrinterIcon />
                      <span>Print Class Routine</span>
                    </button>
                  </div>

                  {/* PDF/Print Document Header containing Logo and updated label replacement */}
                  <div className="text-center pb-5 border-b-2 border-slate-800 flex flex-col items-center justify-center">
                    <div className="mb-3 bg-white p-2 rounded-xl border flex items-center justify-center">
                      <Logo className="h-[64px] w-[64px]" />
                    </div>
                    <h1 className="text-2xl font-black font-display tracking-wide uppercase text-slate-900">Hikma International School</h1>
                    <h2 className="text-lg font-bold text-slate-700 mt-1">Class Routine</h2>
                    <div className="flex flex-wrap items-center justify-center gap-2 text-xs font-mono font-semibold text-slate-600 pt-2">
                      <span>Class: {targetClass}</span> • <span>Section: {targetSection}</span> • <span>Shift: {targetShift}</span> • <span>{targetWeek}</span>
                    </div>
                  </div>

                  {filteredRoutinePlans.length === 0 ? (
                    <div className="py-12 text-center text-slate-400 italic font-medium">No classroom routine tasks recorded matching this selection framework.</div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-sm border-collapse">
                        <thead className="bg-slate-50 border-b">
                          <tr>
                            <th className="p-4 font-bold">Date</th>
                            <th className="p-4 font-bold">Educator</th>
                            <th className="p-4 font-bold">Subject</th>
                            <th className="p-4 font-bold">Class Work Details</th>
                            <th className="p-4 font-bold">Assigned Homework</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {filteredRoutinePlans.map(p => (
                            <tr key={p.id}>
                              <td className="p-4 whitespace-nowrap"><b>{p.lesson_date}</b></td>
                              <td className="p-4 font-semibold">{p.teacher_name}</td>
                              <td className="p-4 font-bold text-slate-800">{p.subject_name}</td>
                              <td className="p-4 text-xs sm:text-sm whitespace-pre-wrap">{p.class_work}</td>
                              <td className="p-4 text-xs italic">
                                {p.homework === 'No Homework' ? <span className="text-slate-300">None</span> : p.homework}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              ) : (
                <div className="bg-slate-100 p-8 rounded-3xl text-center text-slate-500 font-medium">Awaiting parameter selection. Please configure active Class, Section, Shift, and Week specifications.</div>
              )}
            </div>
          ) : (
            <div className="bg-white border p-6 sm:p-8 rounded-3xl space-y-6 max-w-3xl mx-auto shadow-sm">
              <h3 className="font-bold border-b pb-3 text-slate-900 text-lg">Faculty Management Directory</h3>
              
              <form onSubmit={handleAddTeacherSubmit} className="bg-slate-50 p-4 rounded-2xl border space-y-4">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Register New Teacher Profile</h4>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Full Name</label>
                    <input type="text" value={newTeacherName} onChange={e => setNewTeacherName(e.target.value)} placeholder="e.g. Tasnim Alom" className="w-full border p-2 rounded-xl text-sm bg-white" required />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">User Login ID</label>
                    <input type="text" value={newTeacherId} onChange={e => setNewTeacherId(e.target.value)} placeholder="e.g. t106" className="w-full border p-2 rounded-xl text-sm bg-white" required />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Secret Password</label>
                    <input type="text" value={newTeacherPass} onChange={e => setNewTeacherPass(e.target.value)} placeholder="Passcode string" className="w-full border p-2 rounded-xl text-sm bg-white" required />
                  </div>
                </div>
                <div className="flex justify-end pt-1">
                  <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-2 px-4 rounded-xl flex items-center gap-1.5 cursor-pointer"><PlusIcon /> Save Credentials</button>
                </div>
              </form>
              
              {dirAlert && (
                <p className={`p-3 rounded-xl text-xs font-semibold ${dirAlert.type === 'success' ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-50 text-rose-900'}`}>
                  {dirAlert.text}
                </p>
              )}
              
              <div className="border rounded-xl overflow-hidden mt-4">
                <table className="w-full text-left text-sm divide-y">
                  <thead className="bg-slate-50">
                    <tr>
                      <th className="p-4 font-bold">Teacher Name</th>
                      <th className="p-4 font-bold">Workspace ID</th>
                      <th className="p-4 font-bold">Secret Passcode</th>
                      <th className="p-4 font-bold text-right">Office Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y bg-white">
                    {teachersList.map((teacher) => (
                      <tr key={teacher.id}>
                        <td className="p-4 font-bold text-slate-800">{teacher.teacher_name}</td>
                        <td className="p-4 font-mono text-xs text-sky-700 bg-sky-50/40">{teacher.teacher_id}</td>
                        <td className="p-4 font-mono text-xs text-slate-600">{teacher.passcode}</td>
                        <td className="p-4 text-right">
                          {teacherIdToDelete === teacher.id ? (
                            <div className="inline-flex gap-1.5 items-center">
                              <button onClick={() => { onDeleteTeacher(teacher.id); setTeacherIdToDelete(null); }} className="bg-rose-600 text-white text-xs px-2 py-1 rounded cursor-pointer">Confirm</button>
                              <button onClick={() => setTeacherIdToDelete(null)} className="bg-slate-200 text-slate-700 text-xs px-2 py-1 rounded cursor-pointer">No</button>
                            </div>
                          ) : (
                            <button onClick={() => setTeacherIdToDelete(teacher.id)} className="text-rose-500 hover:text-rose-700 p-1 bg-rose-50 rounded-lg cursor-pointer"><TrashIcon /></button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
</html>
