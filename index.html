    function App() {
      const [activeTab, setActiveTab] = useState('teacher');
      
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('hikma_admin_auth') === 'true';
      });

      const [loggedInTeacher, setLoggedInTeacher] = useState(() => {
        const cached = localStorage.getItem('hikma_logged_in_teacher_v2');
        return cached ? JSON.parse(cached) : null;
      });

      const [teachers, setTeachers] = useState(() => {
        const cached = localStorage.getItem('hikma_teachers_roster_v2');
        return cached ? JSON.parse(cached) : SEED_TEACHERS;
      });

      const [plans, setPlans] = useState(() => {
        const cached = localStorage.getItem('hikma_lessons_plans_v2');
        return cached ? JSON.parse(cached) : SEED_PLANS;
      });

      const [currentFilterMonth, setCurrentFilterMonth] = useState('January');
      const [currentFilterWeek, setCurrentFilterWeek] = useState('Week 1');

      // Database Sync State & Config
      const [supabaseConfig, setSupabaseConfig] = useState(() => {
        const cached = localStorage.getItem('hikma_supabase_config');
        return cached ? JSON.parse(cached) : {
          url: 'https://noddojjnufbemzdqukjr.supabase.co',
          key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vZGRvampudWZiZW16ZHF1a2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDg3NTQsImV4cCI6MjA5NjEyNDc1NH0.bdVOO10mcwAaV2R26aGG-vhRBkef-Su37x0oJagsGDM'
        };
      });

      const [onlineStatus, setOnlineStatus] = useState(navigator.onLine);
      const [syncStatus, setSyncStatus] = useState('unconfigured'); // 'synced' | 'syncing' | 'unsynced' | 'disconnected' | 'unconfigured' | 'error'
      const [isSyncing, setIsSyncing] = useState(false);
      const [showDbModal, setShowDbModal] = useState(false);

      const [deletedPlans, setDeletedPlans] = useState(() => {
        const cached = localStorage.getItem('hikma_deleted_plans_queue');
        return cached ? JSON.parse(cached) : [];
      });

      const [deletedTeachers, setDeletedTeachers] = useState(() => {
        const cached = localStorage.getItem('hikma_deleted_teachers_queue');
        return cached ? JSON.parse(cached) : [];
      });

      const supabase = useMemo(() => {
        if (supabaseConfig.url && supabaseConfig.key) {
          try {
            return window.supabase.createClient(supabaseConfig.url, supabaseConfig.key);
          } catch (e) {
            console.error("Failed to initialize Supabase client:", e);
            return null;
          }
        }
        return null;
      }, [supabaseConfig]);

      useEffect(() => {
        localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(teachers));
      }, [teachers]);

      useEffect(() => {
        localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(plans));
      }, [plans]);

      useEffect(() => {
        localStorage.setItem('hikma_admin_auth', String(isAdminLoggedIn));
      }, [isAdminLoggedIn]);

      useEffect(() => {
        if (loggedInTeacher) {
          localStorage.setItem('hikma_logged_in_teacher_v2', JSON.stringify(loggedInTeacher));
        } else {
          localStorage.removeItem('hikma_logged_in_teacher_v2');
        }
      }, [loggedInTeacher]);

      useEffect(() => {
        localStorage.setItem('hikma_deleted_plans_queue', JSON.stringify(deletedPlans));
      }, [deletedPlans]);

      useEffect(() => {
        localStorage.setItem('hikma_deleted_teachers_queue', JSON.stringify(deletedTeachers));
      }, [deletedTeachers]);

      // Online status listener
      useEffect(() => {
        const handleOnline = () => setOnlineStatus(true);
        const handleOffline = () => setOnlineStatus(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      // Computed sync status for UI indicators
      const computedSyncStatus = useMemo(() => {
        if (!supabaseConfig.url || !supabaseConfig.key) {
          return 'unconfigured';
        }
        if (!onlineStatus) {
          const hasUnsynced = plans.some(p => p._dirty) || 
                              teachers.some(t => t._dirty) || 
                              deletedPlans.length > 0 || 
                              deletedTeachers.length > 0;
          return hasUnsynced ? 'offline-unsynced' : 'disconnected';
        }
        if (isSyncing) {
          return 'syncing';
        }
        const hasUnsynced = plans.some(p => p._dirty) || 
                            teachers.some(t => t._dirty) || 
                            deletedPlans.length > 0 || 
                            deletedTeachers.length > 0;
        if (hasUnsynced) {
          return 'unsynced';
        }
        return syncStatus === 'error' ? 'error' : 'synced';
      }, [supabaseConfig, onlineStatus, isSyncing, plans, teachers, deletedPlans, deletedTeachers, syncStatus]);

      // Supabase Synchronization Engine
      const syncWithSupabase = async (forceConfig = null) => {
        const client = forceConfig 
          ? window.supabase.createClient(forceConfig.url, forceConfig.key)
          : supabase;
          
        if (!client) {
          setSyncStatus('unconfigured');
          return;
        }

        if (!navigator.onLine) {
          setSyncStatus('disconnected');
          return;
        }

        setIsSyncing(true);
        setSyncStatus('syncing');

        try {
          // Read absolute current states from localStorage to bypass react closure lag
          let currentPlans = JSON.parse(localStorage.getItem('hikma_lessons_plans_v2') || '[]');
          let currentTeachers = JSON.parse(localStorage.getItem('hikma_teachers_roster_v2') || '[]');
          let currentDeletedPlans = JSON.parse(localStorage.getItem('hikma_deleted_plans_queue') || '[]');
          let currentDeletedTeachers = JSON.parse(localStorage.getItem('hikma_deleted_teachers_queue') || '[]');

          // 1. Process plan deletions
          const plansToDelete = [...currentDeletedPlans];
          for (const planId of plansToDelete) {
            const { error } = await client.from('hikma_plans').delete().eq('id', planId);
            if (!error) {
              currentDeletedPlans = currentDeletedPlans.filter(id => id !== planId);
              localStorage.setItem('hikma_deleted_plans_queue', JSON.stringify(currentDeletedPlans));
              setDeletedPlans(currentDeletedPlans);
            } else {
              throw error;
            }
          }

          // 2. Process teacher deletions
          const teachersToDelete = [...currentDeletedTeachers];
          for (const teacherId of teachersToDelete) {
            const { error } = await client.from('hikma_teachers').delete().eq('id', teacherId);
            if (!error) {
              currentDeletedTeachers = currentDeletedTeachers.filter(id => id !== teacherId);
              localStorage.setItem('hikma_deleted_teachers_queue', JSON.stringify(currentDeletedTeachers));
              setDeletedTeachers(currentDeletedTeachers);
            } else {
              throw error;
            }
          }

          // 3. Sync dirty plan additions/updates
          const dirtyPlans = currentPlans.filter(p => p._dirty);
          for (const p of dirtyPlans) {
            const { _dirty, ...cleanPlan } = p;
            const { error } = await client.from('hikma_plans').upsert(cleanPlan);
            if (!error) {
              currentPlans = currentPlans.map(item => item.id === p.id ? cleanPlan : item);
              localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(currentPlans));
              setPlans(currentPlans);
            } else {
              throw error;
            }
          }

          // 4. Sync dirty teacher additions/updates
          const dirtyTeachers = currentTeachers.filter(t => t._dirty);
          for (const t of dirtyTeachers) {
            const { _dirty, ...cleanTeacher } = t;
            const { error } = await client.from('hikma_teachers').upsert(cleanTeacher);
            if (!error) {
              currentTeachers = currentTeachers.map(item => item.id === t.id ? cleanTeacher : item);
              localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(currentTeachers));
              setTeachers(currentTeachers);
            } else {
              throw error;
            }
          }

          // 5. Download latest data from cloud database
          const { data: serverTeachers, error: fetchTeachersError } = await client
            .from('hikma_teachers')
            .select('*');

          if (fetchTeachersError) throw fetchTeachersError;

          const { data: serverPlans, error: fetchPlansError } = await client
            .from('hikma_plans')
            .select('*')
            .order('created_at', { ascending: false });

          if (fetchPlansError) throw fetchPlansError;

          // Re-fetch local cache to ensure no overlap during operations
          currentPlans = JSON.parse(localStorage.getItem('hikma_lessons_plans_v2') || '[]');
          currentTeachers = JSON.parse(localStorage.getItem('hikma_teachers_roster_v2') || '[]');

          const dirtyTeachersMap = new Map(currentTeachers.filter(t => t._dirty).map(t => [t.id, t]));
          const mergedTeachers = serverTeachers.map(st => {
            return dirtyTeachersMap.has(st.id) ? dirtyTeachersMap.get(st.id) : st;
          });
          const serverTeacherIds = new Set(serverTeachers.map(st => st.id));
          currentTeachers.filter(t => t._dirty).forEach(dt => {
            if (!serverTeacherIds.has(dt.id)) {
              mergedTeachers.push(dt);
            }
          });

          const dirtyPlansMap = new Map(currentPlans.filter(p => p._dirty).map(p => [p.id, p]));
          const mergedPlans = serverPlans.map(sp => {
            return dirtyPlansMap.has(sp.id) ? dirtyPlansMap.get(sp.id) : sp;
          });
          const serverPlanIds = new Set(serverPlans.map(sp => sp.id));
          currentPlans.filter(p => p._dirty).forEach(dp => {
            if (!serverPlanIds.has(dp.id)) {
              mergedPlans.push(dp);
            }
          });

          mergedPlans.sort((a, b) => b.created_at - a.created_at);

          localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(mergedTeachers));
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(mergedPlans));
          
          setTeachers(mergedTeachers);
          setPlans(mergedPlans);
          setSyncStatus('synced');
        } catch (e) {
          console.error("Database synchronization failed:", e);
          setSyncStatus('error');
        } finally {
          setIsSyncing(false);
        }
      };

      const saveSupabaseConfig = (url, key) => {
        const config = { url, key };
        setSupabaseConfig(config);
        localStorage.setItem('hikma_supabase_config', JSON.stringify(config));
        
        // Mark all existing offline data as dirty to trigger initialization migration
        setTeachers(prev => {
          const updated = prev.map(t => ({ ...t, _dirty: true }));
          localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(updated));
          return updated;
        });
        setPlans(prev => {
          const updated = prev.map(p => ({ ...p, _dirty: true }));
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(updated));
          return updated;
        });

        // Trigger migration sync
        syncWithSupabase(config);
      };

      // Auto-trigger sync on network re-establishment or initialization
      useEffect(() => {
        if (supabase && onlineStatus) {
          syncWithSupabase();
        } else if (!supabase) {
          setSyncStatus('unconfigured');
        } else if (!onlineStatus) {
          setSyncStatus('disconnected');
        }
      }, [supabase, onlineStatus]);

      const handleAddPlan = (newPlan) => {
        const planWithDirty = { ...newPlan, _dirty: true };
        setPlans((prev) => {
          const updated = [planWithDirty, ...prev];
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleUpdatePlan = (updatedPlan) => {
        const planWithDirty = { ...updatedPlan, _dirty: true };
        setPlans((prev) => {
          const updated = prev.map((p) => (p.id === updatedPlan.id ? planWithDirty : p));
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleDeletePlan = (id) => {
        const targetPlan = plans.find(p => p.id === id);
        if (targetPlan && !targetPlan._dirty) {
          setDeletedPlans(prev => {
            const updated = [...prev, id];
            localStorage.setItem('hikma_deleted_plans_queue', JSON.stringify(updated));
            return updated;
          });
        }
        setPlans((prev) => {
          const updated = prev.filter((p) => p.id !== id);
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleAddTeacher = (name, customId, password) => {
        const newTeach = {
          id: 'teach_' + Date.now(),
          teacher_id: customId.trim(),
          teacher_name: name.trim(),
          passcode: password.trim(),
          _dirty: true
        };
        setTeachers((prev) => {
          const updated = [...prev, newTeach];
          localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleDeleteTeacher = (id) => {
        const targetTeacher = teachers.find(t => t.id === id);
        if (targetTeacher && !targetTeacher._dirty) {
          setDeletedTeachers(prev => {
            const updated = [...prev, id];
            localStorage.setItem('hikma_deleted_teachers_queue', JSON.stringify(updated));
            return updated;
          });
        }
        setTeachers((prev) => {
          const updated = prev.filter((t) => t.id !== id);
          localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleAdminLogin = (passcode) => {
        if (passcode.trim() === 'hikma123') {
          setIsAdminLoggedIn(true);
          return true;
        }
        return false;
      };

      const handleTeacherLogin = (userId, password) => {
        if (!userId || !password) return false;
        
        const matched = teachers.find((t) => {
          const storedId = String(t.teacher_id).trim().toLowerCase();
          const providedId = String(userId).trim().toLowerCase();
          const storedPass = String(t.passcode).trim();
          const providedPass = String(password).trim();
          
          return storedId === providedId && storedPass === providedPass;
        });

        if (matched) {
          setLoggedInTeacher(matched);
          return true;
        }
        return false;
      };

      const handleLogout = () => {
        setIsAdminLoggedIn(false);
        setLoggedInTeacher(null);
        setActiveTab('teacher');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans pb-12">
          <header className="bg-slate-900 border-b border-slate-800 text-white shadow-xl no-print mt-4 md:mt-2 rounded-2xl mx-4 sm:mx-6 md:mx-8 px-4 py-3 md:py-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-4">
                <div className="bg-white p-2 rounded-xl shadow-md shrink-0 flex items-center justify-center">
                  <Logo className="h-[56px] w-[56px]" />
                </div>
                <div className="text-left">
                  <h1 className="text-lg sm:text-xl font-bold font-display tracking-tight text-white">
                    Hikma International School
                  </h1>
                  <p className="text-xs sm:text-sm text-sky-400 font-medium mt-1">
                    Weekly Lesson Plan Portal
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto justify-end flex-wrap sm:flex-nowrap">
                {/* Database Sync Status Badge */}
                <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700 select-none">
                  <div className="relative flex h-2 w-2 shrink-0">
                    {computedSyncStatus === 'synced' && (
                      <>
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                      </>
                    )}
                    {computedSyncStatus === 'syncing' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500 animate-pulse"></span>
                    )}
                    {computedSyncStatus === 'unsynced' && (
                      <>
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-400"></span>
                      </>
                    )}
                    {computedSyncStatus === 'offline-unsynced' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                    )}
                    {computedSyncStatus === 'disconnected' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                    )}
                    {computedSyncStatus === 'unconfigured' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-slate-500"></span>
                    )}
                    {computedSyncStatus === 'error' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-rose-600 animate-bounce"></span>
                    )}
                  </div>
                  
                  <div className="flex flex-col text-left shrink-0 max-w-[120px]">
                    <span className="text-[9px] text-slate-400 font-bold uppercase tracking-wider leading-none">Database</span>
                    <span className="text-[11px] font-semibold text-white mt-0.5 truncate leading-none">
                      {computedSyncStatus === 'synced' && 'Synced'}
                      {computedSyncStatus === 'syncing' && 'Syncing...'}
                      {computedSyncStatus === 'unsynced' && 'Unsynced'}
                      {computedSyncStatus === 'disconnected' && 'Offline'}
                      {computedSyncStatus === 'offline-unsynced' && 'Offline (Dirty)'}
                      {computedSyncStatus === 'unconfigured' && 'Not Setup'}
                      {computedSyncStatus === 'error' && 'Sync Error'}
                    </span>
                  </div>

                  {/* Manual Sync Trigger */}
                  {(computedSyncStatus === 'unsynced' || computedSyncStatus === 'error') && (
                    <button 
                      onClick={() => syncWithSupabase()}
                      disabled={isSyncing}
                      className="ml-1 p-1 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-[9px] font-bold px-1.5 transition-all cursor-pointer select-none"
                    >
                      Sync
                    </button>
                  )}

                  <button 
                    onClick={() => setShowDbModal(true)}
                    className="p-1 text-slate-400 hover:text-white rounded-lg transition-all ml-0.5 cursor-pointer"
                    title="Database Connection Settings"
                  >
                    <CogIcon />
                  </button>
                </div>

                <button
                  onClick={() => setActiveTab('teacher')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'teacher'
                      ? 'bg-sky-600 text-white shadow-lg border border-sky-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <BookOpenIcon />
                  <span>Teacher Portal</span>
                </button>

                <button
                  onClick={() => setActiveTab('admin')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'admin'
                      ? 'bg-rose-600 text-white shadow-lg border border-rose-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <ShieldIcon />
                  <span>Headmaster Office</span>
                </button>

                {(isAdminLoggedIn || loggedInTeacher) && (
                  <button
                    onClick={handleLogout}
                    className="px-4 py-2.5 bg-slate-800 hover:bg-rose-950/40 text-rose-400 font-bold rounded-xl text-sm transition-all border border-slate-700 min-h-[44px] flex items-center justify-center gap-1.5 cursor-pointer"
                  >
                    <LogOutIcon />
                    <span>Sign Out</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'teacher' ? (
              <TeacherPortal
                loggedInTeacher={loggedInTeacher}
                onTeacherLogin={handleTeacherLogin}
                teachersList={teachers}
                lessonPlans={plans}
                onAddPlan={handleAddPlan}
                onUpdatePlan={handleUpdatePlan}
                onDeletePlan={handleDeletePlan}
                currentFilterMonth={currentFilterMonth}
                setCurrentFilterMonth={setCurrentFilterMonth}
                currentFilterWeek={currentFilterWeek}
                setCurrentFilterWeek={setCurrentFilterWeek}
              />
            ) : (
              <HeadmasterPortal
                isAdminLoggedIn={isAdminLoggedIn}
                teachersList={teachers}
                lessonPlans={plans}
                onLogin={handleAdminLogin}
                onAddTeacher={handleAddTeacher}
                onDeleteTeacher={handleDeleteTeacher}
                currentFilterMonth={currentFilterMonth}
                setCurrentFilterMonth={setCurrentFilterMonth}
                currentFilterWeek={currentFilterWeek}
                setCurrentFilterWeek={setCurrentFilterWeek}
                supabase={supabase}
              />
            )}
          </main>

          <footer className="w-full text-center py-6 mt-12 border-t border-slate-200 text-slate-500 font-semibold text-xs sm:text-sm no-print">
            <div className="max-w-7xl mx-auto px-4">
              <span>Developed by Chinmoy</span>
            </div>
          </footer>

          {/* Supabase Database Config Modal */}
          {showDbModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in no-print">
              <div className="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl relative text-left space-y-6">
                <button 
                  onClick={() => setShowDbModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 cursor-pointer flex items-center justify-center h-8 w-8"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>

                <div className="flex items-center space-x-3 border-b pb-3">
                  <div className="bg-sky-50 text-sky-600 p-2.5 rounded-2xl border">
                    <DatabaseIcon />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold font-display text-slate-900">Database Connection</h3>
                    <p className="text-xs text-slate-500 font-medium">Configure Supabase connection for persistent cloud storage.</p>
                  </div>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const url = e.target.elements.supabaseUrl.value.trim();
                  const key = e.target.elements.supabaseKey.value.trim();
                  saveSupabaseConfig(url, key);
                  setShowDbModal(false);
                }} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Supabase URL</label>
                    <input 
                      name="supabaseUrl"
                      type="url" 
                      defaultValue={supabaseConfig.url}
                      className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-mono font-medium focus:ring-2 focus:ring-sky-500" 
                      placeholder="https://your-project.supabase.co" 
                      required 
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Supabase Anon Key</label>
                    <input 
                      name="supabaseKey"
                      type="password" 
                      defaultValue={supabaseConfig.key}
                      className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-mono font-medium focus:ring-2 focus:ring-sky-500" 
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." 
                      required 
                    />
                  </div>

                  <div className="bg-slate-50 p-3 rounded-2xl border text-xs text-slate-600 space-y-2 leading-relaxed">
                    <p className="font-semibold text-slate-800">Connection Status:</p>
                    <div className="flex items-center space-x-1.5 font-medium">
                      <span>Current Mode:</span>
                      <span className="font-bold text-slate-800 capitalize">{computedSyncStatus}</span>
                    </div>
                    <p>Configuring a database will automatically upload all existing offline roster profiles and lesson plans to your database instance.</p>
                  </div>

                  <div className="flex gap-3 pt-2">
                    <button 
                      type="button" 
                      onClick={() => {
                        setSupabaseConfig({ url: '', key: '' });
                        localStorage.removeItem('hikma_supabase_config');
                        setSyncStatus('unconfigured');
                        setShowDbModal(false);
                      }}
                      className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs sm:text-sm cursor-pointer transition-all text-center border"
                    >
                      Clear Config
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm cursor-pointer transition-all shadow-md"
                    >
                      Save & Sync
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function TeacherPortal({ loggedInTeacher, onTeacherLogin, teachersList, lessonPlans, onAddPlan, onUpdatePlan, onDeletePlan, currentFilterMonth, setCurrentFilterMonth, currentFilterWeek, setCurrentFilterWeek }) {
      const [uIdInput, setUIdInput] = useState('');
      const [uPassInput, setUPassInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [selectedTeacher, setSelectedTeacher] = useState('');
      const [selectedClass, setSelectedClass] = useState(CLASSES[0]);
      const [section, setSection] = useState(SECTIONS[0]);
      const [shift, setShift] = useState('Morning');
      const [subjectName, setSubjectName] = useState('');
      const [classDate, setClassDate] = useState(() => new Date().toISOString().split('T')[0]);
      
      const [lessonMonth, setLessonMonth] = useState(currentFilterMonth);
      const [lessonWeek, setLessonWeek] = useState(currentFilterWeek);
      
      const [classWork, setClassWork] = useState('');
      const [hasHomework, setHasHomework] = useState(false);
      const [homeworkText, setHomeworkText] = useState('');

      const [editingPlanId, setEditingPlanId] = useState(null);
      const [planIdToDelete, setPlanIdToDelete] = useState(null);

      const [successMsg, setSuccessMsg] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterClass, setFilterClass] = useState('All');
      const [currentPage, setCurrentPage] = useState(1);

      useEffect(() => {
        if (loggedInTeacher) {
          setSelectedTeacher(loggedInTeacher.teacher_name);
        } else {
          setSelectedTeacher('');
        }
      }, [loggedInTeacher]);

      useEffect(() => {
        if (!editingPlanId) {
          setLessonMonth(currentFilterMonth);
          setLessonWeek(currentFilterWeek);
        }
      }, [currentFilterMonth, currentFilterWeek, editingPlanId]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const success = onTeacherLogin(uIdInput, uPassInput);
        if (!success) {
          setLoginError('Invalid ID or Password credentials. Please verify your data entry syntax.');
        }
      };

      const handleEditClick = (plan) => {
        setEditingPlanId(plan.id);
        setSelectedTeacher(plan.teacher_name);
        setSelectedClass(plan.class_name);
        setSection(plan.section);
        setShift(plan.shift);
        setSubjectName(plan.subject_name);
        setClassDate(plan.lesson_date);
        setLessonMonth(plan.lesson_month || 'January');
        setLessonWeek(plan.lesson_week || 'Week 1');
        setClassWork(plan.class_work);
        
        if (plan.homework && plan.homework !== 'No Homework') {
          setHasHomework(true);
          setHomeworkText(plan.homework);
        } else {
          setHasHomework(false);
          setHomeworkText('');
        }
        window.scrollTo({ top: 100, behavior: 'smooth' });
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        const payload = {
          id: editingPlanId || 'plan_' + Date.now(),
          teacher_name: selectedTeacher,
          class_name: selectedClass,
          section,
          shift,
          subject_name: subjectName.trim(),
          lesson_date: classDate,
          lesson_month: lessonMonth,
          lesson_week: lessonWeek,
          class_work: classWork.trim(),
          homework: hasHomework && homeworkText.trim() ? homeworkText.trim() : 'No Homework',
          created_at: Date.now()
        };

        if (editingPlanId) {
          onUpdatePlan(payload);
          setSuccessMsg('Lesson plan successfully updated!');
          setEditingPlanId(null);
        } else {
          onAddPlan(payload);
          setSuccessMsg('Lesson plan successfully submitted!');
        }

        setSubjectName('');
        setClassWork('');
        setHasHomework(false);
        setHomeworkText('');
      };

      const filteredTeacherPlans = useMemo(() => {
        return lessonPlans.filter(plan => {
          const matchSearch = plan.subject_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              plan.teacher_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              plan.class_work.toLowerCase().includes(searchQuery.toLowerCase());
          const matchClass = filterClass === 'All' || plan.class_name === filterClass;
          const matchMonth = (plan.lesson_month || 'January') === currentFilterMonth;
          const matchWeek = (plan.lesson_week || 'Week 1') === currentFilterWeek;
          return matchSearch && matchClass && matchMonth && matchWeek;
        });
      }, [lessonPlans, searchQuery, filterClass, currentFilterMonth, currentFilterWeek]);

      const paginatedPlans = useMemo(() => {
        const startIdx = (currentPage - 1) * 10;
        return filteredTeacherPlans.slice(startIdx, startIdx + 10);
      }, [filteredTeacherPlans, currentPage]);

      const totalPages = Math.max(1, Math.ceil(filteredTeacherPlans.length / 10));

      if (!loggedInTeacher) {
        return (
          <div className="max-w-md w-full mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 mt-10 text-left space-y-6 shadow-xl animate-fade-in">
            <h3 className="text-lg font-bold font-display text-slate-900 text-center flex justify-center items-center gap-1.5"><KeyIcon /> Teacher Security Access</h3>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 p-2.5 rounded-xl text-center font-semibold">{loginError}</p>}
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold block mb-1 text-slate-600">Teacher ID / আইডি নম্বর</label>
                <input type="text" value={uIdInput} onChange={e => setUIdInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-medium" placeholder="e.g. t101" required />
              </div>
              <div>
                <label className="text-xs font-semibold block mb-1 text-slate-600">Password / পাসওয়ার্ড</label>
                <input type="password" value={uPassInput} onChange={e => setUPassInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-medium" placeholder="••••••••" required />
              </div>
              <button type="submit" className="w-full bg-sky-600 hover:bg-sky-700 font-bold text-white py-3 rounded-xl text-xs sm:text-sm tracking-wide transition-all cursor-pointer">
                Log In
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-8 animate-fade-in text-left">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 text-white shadow-xl">
            <h2 className="text-xl sm:text-2xl font-bold font-display tracking-tight text-white flex items-center gap-2">
              <BookOpenIcon />
              <span>Welcome back, {loggedInTeacher.teacher_name}!</span>
            </h2>
            <p className="text-sm text-slate-300 mt-1">Logged in with Teacher ID: <span className="font-mono text-sky-400 font-bold">{loggedInTeacher.teacher_id}</span></p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 space-y-6">
              <h3 className="text-base sm:text-lg font-bold font-display text-slate-900 border-b pb-2">
                {editingPlanId ? 'Edit Existing Lesson Plan' : 'Record Classroom Activity'}
              </h3>

              <form onSubmit={handleFormSubmit} className="space-y-5">
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Teacher Account</label>
                    <input type="text" value={selectedTeacher} disabled className="w-full bg-slate-100 border px-3 py-2 rounded-xl text-sm h-11 font-bold text-slate-500 cursor-not-allowed" />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
                    <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
                    <select value={section} onChange={e => setSection(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {SECTIONS.map(sec => <option key={sec} value={sec}>Section {sec}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Shift</label>
                    <select value={shift} onChange={e => setShift(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {SHIFTS.map(sh => <option key={sh} value={sh}>{sh} Shift</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Subject</label>
                    <input type="text" value={subjectName} onChange={e => setSubjectName(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11" required />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Date</label>
                    <input type="date" value={classDate} onChange={e => setClassDate(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11" required />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Syllabus Month</label>
                    <select value={lessonMonth} onChange={e => setLessonMonth(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Syllabus Week</label>
                    <select value={lessonWeek} onChange={e => setLessonWeek(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {WEEKS.map(w => <option key={w} value={w}>{w}</option>)}
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Class Work Details</label>
                  <textarea value={classWork} onChange={e => setClassWork(e.target.value)} className="w-full bg-slate-50 border p-3 rounded-2xl text-sm min-h-[100px]" required />
                </div>

                <div className="space-y-3">
                  <div onClick={() => setHasHomework(!hasHomework)} className="flex items-center space-x-3 bg-slate-50 p-4 rounded-xl border border-slate-200 cursor-pointer select-none">
                    <input type="checkbox" checked={hasHomework} readOnly className="h-5 w-5" />
                    <span className="text-sm font-semibold">Assign Student Homework?</span>
                  </div>

    }
    function SQLConsole({ supabase }) {
      const [sqlQuery, setSqlQuery] = useState('SELECT * FROM public.hikma_plans ORDER BY created_at DESC LIMIT 10;');
      const [results, setResults] = useState(null);
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(false);

      const runQuery = async () => {
        if (!supabase) {
          setError('Supabase database client is not configured. Please click the Cog icon in the header to set up your credentials.');
          setResults(null);
          return;
        }
        setLoading(true);
        setError(null);
        setResults(null);
        try {
          const { data, error: rpcError } = await supabase.rpc('exec_sql', { sql_query: sqlQuery });
          if (rpcError) {
            setError(rpcError.message || JSON.stringify(rpcError));
          } else if (data && data.error) {
            setError(data.error);
          } else {
            setResults(data);
          }
        } catch (err) {
          setError(err.message || 'An unexpected error occurred while executing the query.');
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
      };

      const tableDDL = `-- 1. Create Teachers Table
CREATE TABLE IF NOT EXISTS public.hikma_teachers (
  id TEXT PRIMARY KEY,
  teacher_id TEXT NOT NULL UNIQUE,
  teacher_name TEXT NOT NULL,
  passcode TEXT NOT NULL,
  created_at BIGINT DEFAULT EXTRACT(epoch FROM now()) * 1000
);

-- 2. Create Lesson Plans Table
CREATE TABLE IF NOT EXISTS public.hikma_plans (
  id TEXT PRIMARY KEY,
  teacher_name TEXT NOT NULL,
  class_name TEXT NOT NULL,
  section TEXT NOT NULL,
  shift TEXT NOT NULL,
  subject_name TEXT NOT NULL,
  lesson_date TEXT NOT NULL,
  lesson_month TEXT NOT NULL,
  lesson_week TEXT NOT NULL,
  class_work TEXT NOT NULL,
  homework TEXT NOT NULL,
  created_at BIGINT DEFAULT EXTRACT(epoch FROM now()) * 1000
);

-- 3. Enable RLS
ALTER TABLE public.hikma_teachers ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.hikma_plans ENABLE ROW LEVEL SECURITY;

-- 4. Enable Public Access Policies
CREATE POLICY "Allow public read" ON public.hikma_teachers FOR SELECT USING (true);
CREATE POLICY "Allow public insert" ON public.hikma_teachers FOR INSERT WITH CHECK (true);
CREATE POLICY "Allow public update" ON public.hikma_teachers FOR UPDATE USING (true);
CREATE POLICY "Allow public delete" ON public.hikma_teachers FOR DELETE USING (true);

CREATE POLICY "Allow public read plans" ON public.hikma_plans FOR SELECT USING (true);
CREATE POLICY "Allow public insert plans" ON public.hikma_plans FOR INSERT WITH CHECK (true);
CREATE POLICY "Allow public update plans" ON public.hikma_plans FOR UPDATE USING (true);
CREATE POLICY "Allow public delete plans" ON public.hikma_plans FOR DELETE USING (true);`;

      const rpcDDL = `CREATE OR REPLACE FUNCTION exec_sql(sql_query text)
RETURNS jsonb
LANGUAGE plpgsql
SECURITY DEFINER
AS $$
DECLARE
  result jsonb;
BEGIN
  IF sql_query ~* '^\\s*(select|show|with|explain)\\s' THEN
    EXECUTE 'select coalesce(jsonb_agg(t), ''[]''::jsonb) from (' || sql_query || ') t' INTO result;
  ELSE
    EXECUTE sql_query;
    result := jsonb_build_object('status', 'success', 'message', 'Command executed successfully');
  END IF;
  RETURN result;
EXCEPTION WHEN OTHERS THEN
  RETURN jsonb_build_object('error', SQLERRM);
END;
$$;`;

      return (
        <div className="space-y-6 animate-fade-in text-left">
          <div className="bg-white border p-6 sm:p-8 rounded-3xl shadow-sm space-y-6">
            <div className="border-b pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <h3 className="font-bold text-slate-900 text-lg flex items-center gap-1.5 font-display">
                  <DatabaseIcon />
                  <span>Supabase SQL Console</span>
                </h3>
                <p className="text-xs text-slate-500 font-medium mt-1">Execute SQL statements directly on your Supabase database instance.</p>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setSqlQuery('SELECT * FROM public.hikma_plans ORDER BY created_at DESC LIMIT 10;')}
                  className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl border cursor-pointer transition-all"
                >
                  Plans Query
                </button>
                <button 
                  onClick={() => setSqlQuery('SELECT * FROM public.hikma_teachers ORDER BY teacher_name ASC;')}
                  className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl border cursor-pointer transition-all"
                >
                  Teachers Query
                </button>
              </div>
            </div>

            <div className="space-y-4">
              <div className="relative">
                <textarea
                  value={sqlQuery}
                  onChange={(e) => setSqlQuery(e.target.value)}
                  className="w-full bg-slate-900 text-emerald-400 font-mono text-sm p-4 rounded-2xl min-h-[150px] border border-slate-800 focus:ring-2 focus:ring-sky-500 focus:outline-none leading-relaxed"
                  placeholder="SELECT * FROM public.hikma_plans LIMIT 10;"
                />
              </div>

              <div className="flex justify-between items-center">
                <span className="text-[11px] text-slate-400 font-mono font-medium">
                  {!supabase ? "⚠️ Database client not configured" : "⚡ Database client connected"}
                </span>
                <button
                  onClick={runQuery}
                  disabled={loading}
                  className="bg-slate-900 hover:bg-slate-800 disabled:bg-slate-400 text-white font-bold py-2.5 px-6 rounded-xl text-sm transition-all shadow-md cursor-pointer flex items-center gap-2"
                >
                  {loading ? (
                    <>
                      <span className="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                      <span>Running...</span>
                    </>
                  ) : (
                    <span>Execute Query</span>
                  )}
                </button>
              </div>
            </div>

            {error && (
              <div className="bg-rose-50 border border-rose-100 text-rose-800 p-4 rounded-2xl space-y-2 text-xs sm:text-sm animate-fade-in">
                <p className="font-bold flex items-center gap-1.5 text-rose-900">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  <span>Query Execution Error</span>
                </p>
                <pre className="font-mono bg-rose-100/50 p-3 rounded-xl overflow-x-auto text-[11px] font-medium leading-relaxed whitespace-pre-wrap">{error}</pre>
                <p className="text-[11px] font-semibold text-rose-700">Note: If you haven't created the <code>exec_sql</code> RPC function yet, check the setup guidelines below.</p>
              </div>
            )}

            {results && (
              <div className="space-y-3 animate-fade-in">
                <h4 className="font-bold text-slate-800 text-sm flex items-center gap-1">
                  <span>Query Results</span>
                  <span className="text-xs font-mono font-medium text-slate-400">({Array.isArray(results) ? results.length : 1} items)</span>
                </h4>
                
                {Array.isArray(results) && results.length > 0 ? (
                  <div className="overflow-x-auto border rounded-xl max-h-[300px]">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead className="bg-slate-50 sticky top-0 border-b shadow-sm z-10">
                        <tr>
                          {Object.keys(results[0]).map((key) => (
                            <th key={key} className="p-3 font-bold border-b text-slate-700 bg-slate-50 uppercase tracking-wider text-[10px]">{key}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y font-mono font-medium text-slate-600">
                        {results.map((row, idx) => (
                          <tr key={idx} className="hover:bg-slate-50/50">
                            {Object.values(row).map((val, cellIdx) => (
                              <td key={cellIdx} className="p-3 whitespace-nowrap max-w-[200px] truncate" title={val !== null ? String(val) : 'NULL'}>
                                {val === null ? <span className="text-slate-300 italic">NULL</span> : String(val)}
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <pre className="font-mono bg-slate-50 border p-4 rounded-xl text-xs overflow-x-auto leading-relaxed text-slate-700">
                    {JSON.stringify(results, null, 2)}
                  </pre>
                )}
              </div>
            )}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Table DDL Helper */}
            <div className="bg-white border p-6 rounded-3xl shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-2">
                <h4 className="font-bold text-slate-900 text-sm">Table Schema Setup</h4>
                <button 
                  onClick={() => copyToClipboard(tableDDL)}
                  className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border cursor-pointer transition-all"
                >
                  Copy DDL SQL
                </button>
              </div>
              <p className="text-xs text-slate-500 leading-relaxed font-medium">
                Run this script in the Supabase SQL editor to construct the required tables (<code>hikma_teachers</code> and <code>hikma_plans</code>) and configure public access policies.
              </p>
              <pre className="bg-slate-50 p-3 rounded-xl border font-mono text-[10px] text-slate-600 overflow-x-auto max-h-[220px] leading-relaxed">
                {tableDDL}
              </pre>
            </div>

            {/* RPC Function Helper */}
            <div className="bg-white border p-6 rounded-3xl shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-2">
                <h4 className="font-bold text-slate-900 text-sm">Enable Remote Execution (RPC)</h4>
                <button 
                  onClick={() => copyToClipboard(rpcDDL)}
                  className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border cursor-pointer transition-all"
                >
                  Copy RPC SQL
                </button>
              </div>
              <p className="text-xs text-slate-500 leading-relaxed font-medium">
                To execute raw SQL directly from this portal, you must define the following database helper function in your Supabase project.
              </p>
              <pre className="bg-slate-50 p-3 rounded-xl border font-mono text-[10px] text-slate-600 overflow-x-auto max-h-[220px] leading-relaxed">
                {rpcDDL}
              </pre>
            </div>
          </div>
        </div>
      );
    }

    function HeadmasterPortal({ isAdminLoggedIn, teachersList, lessonPlans, onLogin, onAddTeacher, onDeleteTeacher, currentFilterMonth, setCurrentFilterMonth, currentFilterWeek, setCurrentFilterWeek, supabase }) {
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [activeOfficeTab, setActiveOfficeTab] = useState('routine');

      const [searchMode, setSearchMode] = useState('class'); // 'class' | 'teacher'
      const [targetTeacherName, setTargetTeacherName] = useState('');
      const [targetClass, setTargetClass] = useState('');
      const [targetSection, setTargetSection] = useState('');
      const [targetShift, setTargetShift] = useState('');
      const [targetMonth, setTargetMonth] = useState(currentFilterMonth);
      const [targetWeek, setTargetWeek] = useState(currentFilterWeek);

      const [newTeacherName, setNewTeacherName] = useState('');
      const [newTeacherId, setNewTeacherId] = useState('');
      const [newTeacherPass, setNewTeacherPass] = useState('');
      const [teacherIdToDelete, setTeacherIdToDelete] = useState(null);
      const [dirAlert, setDirAlert] = useState(null);

      const isSearchParameterSet = searchMode === 'class'
        ? !!(targetClass && targetSection && targetShift && targetMonth && targetWeek)
        : !!(targetTeacherName && targetMonth && targetWeek);

      const filteredRoutinePlans = useMemo(() => {
        if (!isSearchParameterSet) return [];
        return lessonPlans.filter(plan => {
          if (searchMode === 'class') {
            return plan.class_name === targetClass &&
                   plan.section === targetSection &&
                   plan.shift === targetShift &&
                   (plan.lesson_month || 'January') === targetMonth &&
                   (plan.lesson_week || 'Week 1') === targetWeek;
          } else {
            return plan.teacher_name === targetTeacherName &&
                   (plan.lesson_month || 'January') === targetMonth &&
                   (plan.lesson_week || 'Week 1') === targetWeek;
          }
        });
      }, [lessonPlans, targetClass, targetSection, targetShift, targetTeacherName, targetMonth, targetWeek, searchMode, isSearchParameterSet]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const success = onLogin(passwordInput);
        if (!success) {
          setLoginError('Passcode invalid! Enter correct system administrator password.');
        }
      };

      const handleAddTeacherSubmit = (e) => {
        e.preventDefault();
        setDirAlert(null);
        
        const nameClean = newTeacherName.trim();
        const idClean = newTeacherId.trim();
        const passClean = newTeacherPass.trim();

        if (!nameClean || !idClean || !passClean) return;
        
        if (teachersList.some(t => t.teacher_id.toLowerCase() === idClean.toLowerCase())) {
          setDirAlert({ type: 'error', text: 'Error: This Teacher ID is already registered.' });
          return;
        }
        
        onAddTeacher(nameClean, idClean, passClean);
        
        setNewTeacherName('');
        setNewTeacherId('');
        setNewTeacherPass('');
        setDirAlert({ type: 'success', text: 'Success: Educator credential profile stored.' });
      };

      if (!isAdminLoggedIn) {
        return (
          <div className="max-w-md w-full mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 mt-10 text-left space-y-6 shadow-xl animate-fade-in">
            <h3 className="text-lg font-bold font-display text-slate-900 text-center flex justify-center items-center gap-1.5"><ShieldIcon /> Verification Gate</h3>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 p-2 rounded-xl text-center font-bold">{loginError}</p>}
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold block mb-1">Office Password / পাসকোড</label>
                <input type="password" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm" placeholder="e.g. hikma123" required />
              </div>
              <button type="submit" className="w-full bg-rose-600 hover:bg-rose-700 font-bold text-white py-3 rounded-xl text-xs sm:text-sm cursor-pointer">Authorize</button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-6 animate-fade-in text-left">
          <div className="flex bg-slate-200 p-1.5 rounded-2xl max-w-lg border no-print">
            <button onClick={() => setActiveOfficeTab('routine')} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer ${activeOfficeTab === 'routine' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>Check Routine</button>
            <button onClick={() => setActiveOfficeTab('teachers')} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer ${activeOfficeTab === 'teachers' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>Teachers List</button>
            <button onClick={() => setActiveOfficeTab('sql_console')} className={`flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl cursor-pointer ${activeOfficeTab === 'sql_console' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>SQL Console</button>
          </div>

          {activeOfficeTab === 'routine' && (
            <div className="space-y-6">
              <div className="bg-white p-6 rounded-3xl border space-y-4 no-print">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <h3 className="font-bold text-slate-900 flex items-center gap-1.5"><SearchIcon /> Select Routine Filters</h3>
                  
                  {/* Search Mode Toggle */}
                  <div className="flex bg-slate-100 p-1 rounded-xl border w-full sm:w-auto">
                    <button 
                      onClick={() => setSearchMode('class')}
                      className={`flex-1 sm:flex-initial py-1 px-3 text-xs font-bold rounded-lg cursor-pointer transition-all ${
                        searchMode === 'class' ? 'bg-white text-slate-900 shadow border border-slate-200' : 'text-slate-500 hover:text-slate-900'
                      }`}
                    >
                      Class Search
                    </button>
                    <button 
                      onClick={() => setSearchMode('teacher')}
                      className={`flex-1 sm:flex-initial py-1 px-3 text-xs font-bold rounded-lg cursor-pointer transition-all ${
                        searchMode === 'teacher' ? 'bg-white text-slate-900 shadow border border-slate-200' : 'text-slate-500 hover:text-slate-900'
                      }`}
                    >
                      Teacher Search
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                  {searchMode === 'class' ? (
                    <>
                      <div>
                        <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
                        <select value={targetClass} onChange={e => setTargetClass(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                          <option value="">-- Choose Class --</option>
                          {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
                        <select value={targetSection} onChange={e => setTargetSection(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                          <option value="">-- Choose Section --</option>
                          {SECTIONS.map(sec => <option key={sec} value={sec}>Section {sec}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-600 block mb-1">Shift</label>
                        <select value={targetShift} onChange={e => setTargetShift(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                          <option value="">-- Choose Shift --</option>
                          {SHIFTS.map(sh => <option key={sh} value={sh}>{sh} Shift</option>)}
                        </select>
                      </div>
                    </>
                  ) : (
                    <div className="sm:col-span-2 lg:col-span-3">
                      <label className="text-xs font-semibold text-slate-600 block mb-1">Teacher Name</label>
                      <select value={targetTeacherName} onChange={e => setTargetTeacherName(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                        <option value="">-- Select Teacher --</option>
                        {teachersList.map(t => <option key={t.id} value={t.teacher_name}>{t.teacher_name} ({t.teacher_id})</option>)}
                      </select>
                    </div>
                  )}
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Month</label>
                    <select value={targetMonth} onChange={e => setTargetMonth(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                      {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Week</label>
                    <select value={targetWeek} onChange={e => setTargetWeek(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm h-11 cursor-pointer">
                      {WEEKS.map(w => <option key={w} value={w}>{w}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              {isSearchParameterSet ? (
                <div className="bg-white rounded-3xl border p-6 sm:p-8 space-y-6 shadow-sm" id="printable-report-card">
                  <div className="flex md:items-center md:justify-between border-b pb-4 gap-4 no-print flex-wrap">
                    <h4 className="font-bold text-slate-900">Syllabus Sheet Output</h4>
                    <button onClick={() => window.print()} className="flex items-center gap-1.5 px-4 py-2 bg-slate-900 text-white font-bold text-xs sm:text-sm rounded-xl cursor-pointer">
                      <PrinterIcon />
                      <span>{searchMode === 'class' ? 'Print Class Routine' : 'Print Teacher Schedule'}</span>
                    </button>
                  </div>

                  <div className="text-center pb-5 border-b-2 border-slate-800 flex flex-col items-center justify-center">
                    <div className="mb-3 bg-white p-2 rounded-xl border flex items-center justify-center">
                      <Logo className="h-[64px] w-[64px]" />
                    </div>
                    <h1 className="text-2xl font-black font-display tracking-wide uppercase text-slate-900">Hikma International School</h1>
                    <h2 className="text-lg font-bold text-slate-700 mt-1">
                      {searchMode === 'class' ? 'Class Routine' : 'Teacher Schedule'}
                    </h2>
                    <div className="flex flex-wrap items-center justify-center gap-2 text-xs font-mono font-semibold text-slate-600 pt-2">
                      {searchMode === 'class' ? (
                        <>
                          <span>Class: {targetClass}</span> • <span>Section: {targetSection}</span> • <span>Shift: {targetShift}</span> • <span>{targetMonth} ({targetWeek})</span>
                        </>
                      ) : (
                        <>
                          <span>Educator: {targetTeacherName}</span> • <span>{targetMonth} ({targetWeek})</span>
                        </>
                      )}
                    </div>
                  </div>

                  {filteredRoutinePlans.length === 0 ? (
                    <div className="py-12 text-center text-slate-400 italic font-medium">No classroom routine tasks recorded matching this selection framework.</div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-sm border-collapse">
                        <thead className="bg-slate-50 border-b">
                          <tr>
                            <th className="p-4 font-bold">Date</th>
                            <th className="p-4 font-bold">
                              {searchMode === 'class' ? 'Educator' : 'Class / Shift'}
                            </th>
                            <th className="p-4 font-bold">Subject</th>
                            <th className="p-4 font-bold">Class Work Details</th>
                            <th className="p-4 font-bold">Assigned Homework</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y">
                          {filteredRoutinePlans.map(p => (
                            <tr key={p.id}>
                              <td className="p-4 whitespace-nowrap"><b>{p.lesson_date}</b></td>
                              <td className="p-4 font-semibold">
                                {searchMode === 'class' ? (
                                  p.teacher_name
                                ) : (
                                  <span className="bg-sky-50 text-sky-800 text-[10px] font-bold px-2 py-0.5 rounded border inline-block">
                                    Class {p.class_name} ({p.section}) - {p.shift}
                                  </span>
                                )}
                              </td>
                              <td className="p-4 font-bold text-slate-800">{p.subject_name}</td>
                              <td className="p-4 text-xs sm:text-sm whitespace-pre-wrap">{p.class_work}</td>
                              <td className="p-4 text-xs italic">
                                {p.homework === 'No Homework' ? <span className="text-slate-300">None</span> : p.homework}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              ) : (
                <div className="bg-slate-100 p-8 rounded-3xl text-center text-slate-500 font-medium">
                  {searchMode === 'class' 
                    ? "Awaiting parameter selection. Please configure active Class, Section, Shift, Month, and Week specifications."
                    : "Awaiting parameter selection. Please configure active Teacher Name, Month, and Week specifications."}
                </div>
              )}
            </div>
          )}

          {activeOfficeTab === 'teachers' && (
            <div className="bg-white border p-6 sm:p-8 rounded-3xl space-y-6 max-w-3xl mx-auto shadow-sm">
              <h3 className="font-bold border-b pb-3 text-slate-900 text-lg">Faculty Management Directory</h3>
              
              <form onSubmit={handleAddTeacherSubmit} className="bg-slate-50 p-4 rounded-2xl border space-y-4">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Register New Teacher Profile</h4>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Full Name</label>
                    <input type="text" value={newTeacherName} onChange={e => setNewTeacherName(e.target.value)} placeholder="e.g. Tasnim Alom" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">User Login ID</label>
                    <input type="text" value={newTeacherId} onChange={e => setNewTeacherId(e.target.value)} placeholder="e.g. t106" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Secret Password</label>
                    <input type="text" value={newTeacherPass} onChange={e => setNewTeacherPass(e.target.value)} placeholder="Passcode string" className="w-full border p-2 rounded-xl text-sm bg-white font-medium" required />
                  </div>
                </div>
                <div className="flex justify-end pt-1">
                  <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-2 px-4 rounded-xl flex items-center gap-1.5 cursor-pointer"><PlusIcon /> Save Credentials</button>
                </div>
              </form>
              
              {dirAlert && (
                <p className={`p-3 rounded-xl text-xs font-semibold ${dirAlert.type === 'success' ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-50 text-rose-900'}`}>
                  {dirAlert.text}
                </p>
              )}
              
              <div className="border rounded-xl overflow-hidden mt-4">
                <table className="w-full text-left text-sm divide-y">
                  <thead className="bg-slate-50">
                    <tr>
                      <th className="p-4 font-bold">Teacher Name</th>
                      <th className="p-4 font-bold">Workspace ID</th>
                      <th className="p-4 font-bold">Secret Passcode</th>
                      <th className="p-4 font-bold text-right">Office Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y bg-white">
                    {teachersList.map((teacher) => (
                      <tr key={teacher.id}>
                        <td className="p-4 font-bold text-slate-800">{teacher.teacher_name}</td>
                        <td className="p-4 font-mono text-xs text-sky-700 bg-sky-50/40 font-bold">{teacher.teacher_id}</td>
                        <td className="p-4 font-mono text-xs text-slate-600 font-medium">{teacher.passcode}</td>
                        <td className="p-4 text-right">
                          {teacherIdToDelete === teacher.id ? (
                            <div className="inline-flex gap-1.5 items-center">
                              <button onClick={() => { onDeleteTeacher(teacher.id); setTeacherIdToDelete(null); }} className="bg-rose-600 text-white text-xs px-2 py-1 rounded cursor-pointer font-bold">Confirm</button>
                              <button onClick={() => setTeacherIdToDelete(null)} className="bg-slate-200 text-slate-700 text-xs px-2 py-1 rounded cursor-pointer font-bold">No</button>
                            </div>
                          ) : (
                            <button onClick={() => setTeacherIdToDelete(teacher.id)} className="text-rose-500 hover:text-rose-700 p-1 bg-rose-50 rounded-lg cursor-pointer"><TrashIcon /></button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeOfficeTab === 'sql_console' && (
            <SQLConsole supabase={supabase} />
          )}
        </div>
      );
    }

    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
</html>
