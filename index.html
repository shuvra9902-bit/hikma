        extend: {
          fontFamily: {

  <style>
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        color: black !important;
      }
      .print-visible {
        display: block !important;
      }

    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }

  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CLASSES = ['Play Group', 'Nursery', 'KG', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'SSC'];
    const SECTIONS = ['A', 'B', 'C', 'Gold', 'Silver'];
    const SHIFTS = ['Morning', 'Day'];
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WEEKS = ['Week 1', 'Week 2', 'Week 3', 'Week 4'];

    // Initial default seed arrays acting as standard fallback values when network is connecting
    const FALLBACK_TEACHERS = [
      { id: 'teach_1', teacher_id: 't101', teacher_name: 'Mustafa Rahman', passcode: 'hikma11' },
      { id: 'teach_2', teacher_id: 't102', teacher_name: 'Dr. Fatema Nasrin', passcode: 'hikma22' },
      { id: 'teach_3', teacher_id: 't103', teacher_name: 'Sheikh Abdullah', passcode: 'hikma33' },
      { id: 'teach_4', teacher_id: 't104', teacher_name: 'Rumana Chowdhury', passcode: 'hikma44' },
      { id: 'teach_5', teacher_id: 't105', teacher_name: 'Farhan Ahmed', passcode: 'hikma55' },
    ];

    // Initialize Supabase Client Connection explicitly
    const SUPABASE_URL = "https://noddojjnufbemzdqukjr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vZGRvampudWZiZW16ZHF1a2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDg3NTQsImV4cCI6MjA5NjEyNDc1NH0.bdVOO10mcwAaV2R26aGG-vhRBkef-Su37x0oJagsGDM";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function Logo({ className = "h-12 w-12" }) {
      return (
        <svg viewBox="0 0 320 300" className={className} xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="100" height="300" fill="#0082C8" rx="4" />
          <rect x="110" y="0" width="100" height="300" fill="#0082C8" rx="4" />

          <path d="M 0,0 L 100,0 L 100,102.4 Q 50,110.5 0,105 Z" fill="#046582" />
          <path d="M 110,0 L 210,0 L 210,81.3 Q 160,93.5 110,101.4 Z" fill="#942A2D" />
          <path d="M 220,0 L 320,0 L 320,35 Q 270,59.3 220,79.1 Z" fill="#046582" />
          <path d="M 0,105 Q 160,115 320,35" stroke="#FFFFFF" strokeWidth="8" fill="none" strokeLinecap="round" />
          <text x="50" y="225" fill="#FFFFFF" fontFamily="'Times New Roman', Georgia, serif" fontWeight="bold" fontSize="88" textAnchor="middle">H</text>

        </svg>
      );
    }

    function BookOpenIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>; }
    function ShieldIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2A1 1 0 0 1 20 6z"/></svg>; }
    function LogOutIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>; }
    function TrashIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>; }
    function EditIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/></svg>; }
    function PrinterIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>; }
    function SearchIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>; }
    function PlusIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>; }
    function KeyIcon() { return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>; }

    function App() {
      const [activeTab, setActiveTab] = useState('teacher');
      
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('hikma_admin_auth') === 'true';
      });

      const [loggedInTeacher, setLoggedInTeacher] = useState(() => {
        const cached = localStorage.getItem('hikma_logged_in_teacher_v2');
        return cached ? JSON.parse(cached) : null;
      });

      // Synchronized states backed up remotely inside Supabase instance
      const [teachers, setTeachers] = useState(FALLBACK_TEACHERS);
      const [plans, setPlans] = useState([]);

      const [currentFilterMonth, setCurrentFilterMonth] = useState('January');
      const [currentFilterWeek, setCurrentFilterWeek] = useState('Week 1');

      // ASYNCHRONOUS DATABASE SYNCHRONIZER ENGINE
      const fetchDatabaseState = async () => {
        try {
          // 1. Fetch live authorized faculty roster sorted alphabetically
          const { data: remoteTeachers, error: tErr } = await supabaseClient
            .from('teachers')
            .select('*')
            .order('teacher_name', { ascending: true });
          
          if (!tErr && remoteTeachers && remoteTeachers.length > 0) {
            setTeachers(remoteTeachers);
          }

          // 2. Fetch remote log logs sorted with newest inputs listed first
          const { data: remotePlans, error: pErr } = await supabaseClient
            .from('lesson_plans')
            .select('*')
            .order('created_at', { ascending: false });

          if (!pErr && remotePlans) {
            setPlans(remotePlans);
          }
        } catch (error) {
          console.error("Supabase network fetch cycle skipped:", error);
        }
      };

      // Trigger automatic sync on page initialization
      useEffect(() => {
        fetchDatabaseState();
      }, []);

      useEffect(() => {
        localStorage.setItem('hikma_admin_auth', String(isAdminLoggedIn));
      }, [isAdminLoggedIn]);

      useEffect(() => {
        if (loggedInTeacher) {
          localStorage.setItem('hikma_logged_in_teacher_v2', JSON.stringify(loggedInTeacher));
        } else {
          localStorage.removeItem('hikma_logged_in_teacher_v2');
        }
      }, [loggedInTeacher]);

      // SUBMIT AND WRITE NEW WORKSPACE LOG ENTRY TO CLOUD
      const handleAddPlan = async (newPlan) => {
        try {
          const { error } = await supabaseClient
            .from('lesson_plans')
            .insert([{
              teacher_id: loggedInTeacher ? loggedInTeacher.teacher_id : 't101',
              teacher_name: newPlan.teacher_name,
              class_name: newPlan.class_name,
              section: newPlan.section,
              shift: newPlan.shift,
              subject_name: newPlan.subject_name,
              lesson_date: newPlan.lesson_date,
              lesson_month: newPlan.lesson_month,
              lesson_week: newPlan.lesson_week,
              class_work: newPlan.class_work,
              homework: newPlan.homework
            }]);

          if (error) throw error;
          await fetchDatabaseState(); // Smoothly sync client state arrays
        } catch (e) {
          alert("Supabase Log Insert Error: " + e.message);
          // Local fallback mechanism to ensure portal functionality if offline
          setPlans((prev) => [newPlan, ...prev]);
        }
      };

      // PERSIST EDITED ACTIVITY SPECIFICATIONS INTO THE DATABASE
      const handleUpdatePlan = async (updatedPlan) => {
        try {
          // If ID contains fallback string flag, filter out locally, otherwise update remote Postgres row
          if (String(updatedPlan.id).startsWith('plan_')) {
            setPlans((prev) => prev.map((p) => (p.id === updatedPlan.id ? updatedPlan : p)));
            return;
          }

          const { error } = await supabaseClient
            .from('lesson_plans')
            .update({
              class_name: updatedPlan.class_name,
              section: updatedPlan.section,
              shift: updatedPlan.shift,
              subject_name: updatedPlan.subject_name,
              lesson_date: updatedPlan.lesson_date,
              lesson_month: updatedPlan.lesson_month,
              lesson_week: updatedPlan.lesson_week,
              class_work: updatedPlan.class_work,
              homework: updatedPlan.homework
            })
            .eq('id', updatedPlan.id);

          if (error) throw error;
          await fetchDatabaseState();
        } catch (e) {
          alert("Supabase Log Update Error: " + e.message);
          setPlans((prev) => prev.map((p) => (p.id === updatedPlan.id ? updatedPlan : p)));
        }
      };

      // REMOVE AN ENTRY ROW PERMANENTLY VIA TARGET MATRIX UUID KEY
      const handleDeletePlan = async (id) => {
        try {
          if (String(id).startsWith('plan_')) {
            setPlans((prev) => prev.filter((p) => p.id !== id));
            return;
          }

          const { error } = await supabaseClient
            .from('lesson_plans')
            .delete()
            .eq('id', id);

          if (error) throw error;
          await fetchDatabaseState();
        } catch (e) {
          alert("Supabase Log Delete Error: " + e.message);
          setPlans((prev) => prev.filter((p) => p.id !== id));
        }
      };

      // HEADMASTER DIRECTORY MAPPING: STORE AN AUTHORIZED USER CREDENTIAL PROFILE
      const handleAddTeacher = async (name, customId, password) => {
        const cleanId = customId.trim();
        const cleanName = name.trim();
        const cleanPass = password.trim();

        try {
          const { error } = await supabaseClient
            .from('teachers')
            .insert([{
              teacher_id: cleanId,
              teacher_name: cleanName,
              passcode: cleanPass
            }]);

          if (error) throw error;
          await fetchDatabaseState();
        } catch (e) {
          alert("Supabase Teacher Profile Registration Error: " + e.message);
          const newTeach = {
            id: 'teach_' + Date.now(),
            teacher_id: cleanId,
            teacher_name: cleanName,
            passcode: cleanPass
          };
          setTeachers((prev) => [...prev, newTeach]);
        }
      };

      // HEADMASTER DIRECTORY MAPPING: REMOVE USER DATA SPACE NODE
      const handleDeleteTeacher = async (id) => {
        try {
          if (String(id).startsWith('teach_')) {
            setTeachers((prev) => prev.filter((t) => t.id !== id));
            return;
          }

          const { error } = await supabaseClient
            .from('teachers')
            .delete()
            .eq('id', id);

          if (error) throw error;
          await fetchDatabaseState();
        } catch (e) {
          alert("Supabase Profile Revocation Notice: Ensure teacher has no recorded logs before removing entry. details: " + e.message);
          setTeachers((prev) => prev.filter((t) => t.id !== id));
        }
      };

      const handleAdminLogin = (passcode) => {
        if (passcode.trim() === 'hikma123') {
          setIsAdminLoggedIn(true);
          return true;
        }
        return false;
      };

      const handleTeacherLogin = (userId, password) => {
        if (!userId || !password) return false;
        
        const matched = teachers.find((t) => {
          const storedId = String(t.teacher_id).trim().toLowerCase();
          const providedId = String(userId).trim().toLowerCase();
          const storedPass = String(t.passcode).trim();
          const providedPass = String(password).trim();
          
          return storedId === providedId && storedPass === providedPass;
        });

        if (matched) {
          setLoggedInTeacher(matched);
          return true;
        }
        return false;
      };

      const handleLogout = () => {
        setIsAdminLoggedIn(false);
        setLoggedInTeacher(null);
        setActiveTab('teacher');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans pb-12">
          <header className="bg-slate-900 border-b border-slate-800 text-white shadow-xl no-print mt-4 md:mt-2 rounded-2xl mx-4 sm:mx-6 md:mx-8 px-4 py-3 md:py-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-4">
                <div className="bg-white p-2 rounded-xl shadow-md shrink-0 flex items-center justify-center">
                  <Logo className="h-[56px] w-[56px]" />
                </div>
                <div className="text-left">
                  <h1 className="text-lg sm:text-xl font-bold font-display tracking-tight text-white">
                    Hikma International School
                  </h1>
                  <p className="text-xs sm:text-sm text-sky-400 font-medium mt-1">
                    Weekly Lesson Plan Portal
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto justify-end">
                <button
                  onClick={() => setActiveTab('teacher')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'teacher'
                      ? 'bg-sky-600 text-white shadow-lg border border-sky-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <BookOpenIcon />
                  <span>Teacher Portal</span>
                </button>

                <button
                  onClick={() => setActiveTab('admin')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'admin'
                      ? 'bg-rose-600 text-white shadow-lg border border-rose-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <ShieldIcon />
                  <span>Headmaster Office</span>
                </button>

                {(isAdminLoggedIn || loggedInTeacher) && (
                  <button
                    onClick={handleLogout}
                    className="px-4 py-2.5 bg-slate-800 hover:bg-rose-950/40 text-rose-400 font-bold rounded-xl text-sm transition-all border border-slate-700 min-h-[44px] flex items-center justify-center gap-1.5 cursor-pointer"
                  >
                    <LogOutIcon />
                    <span>Sign Out</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'teacher' ? (
              <TeacherPortal
                loggedInTeacher={loggedInTeacher}
                onTeacherLogin={handleTeacherLogin}
                teachersList={teachers}
                lessonPlans={plans}
                onAddPlan={handleAddPlan}
                onUpdatePlan={handleUpdatePlan}
                onDeletePlan={handleDeletePlan}
                currentFilterMonth={currentFilterMonth}
                setCurrentFilterMonth={setCurrentFilterMonth}
                currentFilterWeek={currentFilterWeek}
                setCurrentFilterWeek={setCurrentFilterWeek}
              />
            ) : (
              <HeadmasterPortal
                isAdminLoggedIn={isAdminLoggedIn}
                teachersList={teachers}
                lessonPlans={plans}
                onLogin={handleAdminLogin}
                onAddTeacher={handleAddTeacher}
                onDeleteTeacher={handleDeleteTeacher}
                currentFilterMonth={currentFilterMonth}
                setCurrentFilterMonth={setCurrentFilterMonth}
                currentFilterWeek={currentFilterWeek}
                setCurrentFilterWeek={setCurrentFilterWeek}
              />
            )}
          </main>

          <footer className="w-full text-center py-6 mt-12 border-t border-slate-200 text-slate-500 font-semibold text-xs sm:text-sm no-print">
            <div className="max-w-7xl mx-auto px-4">
              <span>Developed by Chinmoy</span>
            </div>
          </footer>
        </div>
      );
    }

    function TeacherPortal({ loggedInTeacher, onTeacherLogin, teachersList, lessonPlans, onAddPlan, onUpdatePlan, onDeletePlan, currentFilterMonth, setCurrentFilterMonth, currentFilterWeek, setCurrentFilterWeek }) {
      const [uIdInput, setUIdInput] = useState('');
      const [uPassInput, setUPassInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [selectedTeacher, setSelectedTeacher] = useState('');
      const [selectedClass, setSelectedClass] = useState(CLASSES[0]);
      const [section, setSection] = useState(SECTIONS[0]);
      const [shift, setShift] = useState('Morning');
      const [subjectName, setSubjectName] = useState('');
      const [classDate, setClassDate] = useState(() => new Date().toISOString().split('T')[0]);
      
      const [lessonMonth, setLessonMonth] = useState(currentFilterMonth);
      const [lessonWeek, setLessonWeek] = useState(currentFilterWeek);
      
      const [classWork, setClassWork] = useState('');
      const [hasHomework, setHasHomework] = useState(false);
      const [homeworkText, setHomeworkText] = useState('');

      const [editingPlanId, setEditingPlanId] = useState(null);
      const [planIdToDelete, setPlanIdToDelete] = useState(null);

      const [successMsg, setSuccessMsg] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterClass, setFilterClass] = useState('All');
      const [currentPage, setCurrentPage] = useState(1);

      useEffect(() => {
        if (loggedInTeacher) {
          setSelectedTeacher(loggedInTeacher.teacher_name);
        } else {
          setSelectedTeacher('');
        }
      }, [loggedInTeacher]);

      useEffect(() => {
        if (!editingPlanId) {
          setLessonMonth(currentFilterMonth);
          setLessonWeek(currentFilterWeek);
        }
      }, [currentFilterMonth, currentFilterWeek, editingPlanId]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const success = onTeacherLogin(uIdInput, uPassInput);
        if (!success) {
          setLoginError('Invalid ID or Password credentials. Please verify your data entry syntax.');
        }
      };

      const handleEditClick = (plan) => {
        setEditingPlanId(plan.id);
        setSelectedTeacher(plan.teacher_name);
        setSelectedClass(plan.class_name);
        setSection(plan.section);
        setShift(plan.shift);
        setSubjectName(plan.subject_name);
        setClassDate(plan.lesson_date);
        setLessonMonth(plan.lesson_month || 'January');
        setLessonWeek(plan.lesson_week || 'Week 1');
        setClassWork(plan.class_work);
        
        if (plan.homework && plan.homework !== 'No Homework') {
          setHasHomework(true);
          setHomeworkText(plan.homework);
        } else {
          setHasHomework(false);
          setHomeworkText('');
        }
        window.scrollTo({ top: 100, behavior: 'smooth' });
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        const payload = {
          id: editingPlanId || 'plan_' + Date.now(),
          teacher_name: selectedTeacher,
          class_name: selectedClass,
          section,
          shift,
          subject_name: subjectName.trim(),
          lesson_date: classDate,
          lesson_month: lessonMonth,
          lesson_week: lessonWeek,
          class_work: classWork.trim(),
          homework: hasHomework && homeworkText.trim() ? homeworkText.trim() : 'No Homework',
          created_at: Date.now()
        };

        if (editingPlanId) {
          onUpdatePlan(payload);
          setSuccessMsg('Lesson plan successfully updated!');
          setEditingPlanId(null);
        } else {
          onAddPlan(payload);
          setSuccessMsg('Lesson plan successfully submitted!');
        }

        setSubjectName('');
        setClassWork('');
        setHasHomework(false);
        setHomeworkText('');
      };

      const filteredTeacherPlans = useMemo(() => {
        return lessonPlans.filter(plan => {
          const matchSearch = plan.subject_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              plan.teacher_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              plan.class_work.toLowerCase().includes(searchQuery.toLowerCase());
          const matchClass = filterClass === 'All' || plan.class_name === filterClass;
          const matchMonth = (plan.lesson_month || 'January') === currentFilterMonth;
          const matchWeek = (plan.lesson_week || 'Week 1') === currentFilterWeek;
          return matchSearch && matchClass && matchMonth && matchWeek;
        });
      }, [lessonPlans, searchQuery, filterClass, currentFilterMonth, currentFilterWeek]);

      const paginatedPlans = useMemo(() => {
        const startIdx = (currentPage - 1) * 10;
        return filteredTeacherPlans.slice(startIdx, startIdx + 10);
      }, [filteredTeacherPlans, currentPage]);

      const totalPages = Math.max(1, Math.ceil(filteredTeacherPlans.length / 10));

      if (!loggedInTeacher) {
        return (
          <div className="max-w-md w-full mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 mt-10 text-left space-y-6 shadow-xl animate-fade-in">
            <h3 className="text-lg font-bold font-display text-slate-900 text-center flex justify-center items-center gap-1.5"><KeyIcon /> Teacher Security Access</h3>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 p-2.5 rounded-xl text-center font-semibold">{loginError}</p>}
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold block mb-1 text-slate-600">Teacher ID / আইডি নম্বর</label>
                <input type="text" value={uIdInput} onChange={e => setUIdInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-medium" placeholder="e.g. t101" required />
              </div>
              <div>
                <label className="text-xs font-semibold block mb-1 text-slate-600">Password / পাসওয়ার্ড</label>
                <input type="password" value={uPassInput} onChange={e => setUPassInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-medium" placeholder="••••••••" required />
              </div>
              <button type="submit" className="w-full bg-sky-600 hover:bg-sky-700 font-bold text-white py-3 rounded-xl text-xs sm:text-sm tracking-wide transition-all cursor-pointer">
                Log In
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-8 animate-fade-in text-left">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 text-white shadow-xl">
            <h2 className="text-xl sm:text-2xl font-bold font-display tracking-tight text-white flex items-center gap-2">
              <BookOpenIcon />
              <span>Welcome back, {loggedInTeacher.teacher_name}!</span>
            </h2>
            <p className="text-sm text-slate-300 mt-1">Logged in with Teacher ID: <span className="font-mono text-sky-400 font-bold">{loggedInTeacher.teacher_id}</span></p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 space-y-6">
              <h3 className="text-base sm:text-lg font-bold font-display text-slate-900 border-b pb-2">
                {editingPlanId ? 'Edit Existing Lesson Plan' : 'Record Classroom Activity'}
              </h3>

              <form onSubmit={handleFormSubmit} className="space-y-5">
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Teacher Account</label>
                    <input type="text" value={selectedTeacher} disabled className="w-full bg-slate-100 border px-3 py-2 rounded-xl text-sm h-11 font-bold text-slate-500 cursor-not-allowed" />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
                    <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
                    <select value={section} onChange={e => setSection
