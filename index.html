    function getDayNameFromDate(dateStr) {
      if (!dateStr) return '';
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const date = new Date(dateStr + 'T12:00:00');
      return days[date.getDay()];
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr + 'T12:00:00');
      return date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr + 'T12:00:00');
      return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatDateRangeLabel(startStr, endStr) {
      if (!startStr || !endStr) return '';
      return `${formatShortDate(startStr)} — ${formatShortDate(endStr)}`;
    }

    function getSchoolDatesInRange(startStr, endStr) {
      if (!startStr || !endStr) return [];
      const start = new Date(startStr + 'T12:00:00');
      const end = new Date(endStr + 'T12:00:00');
      if (start > end) return [];
      const dates = [];
      const cur = new Date(start);
      while (cur <= end) {
        const dateStr = cur.toISOString().split('T')[0];
        const dayName = getDayNameFromDate(dateStr);
        if (dayName !== 'Friday') {
          dates.push({ dateStr, dayName });
        }
        cur.setDate(cur.getDate() + 1);
      }
      return dates;
    }

        localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(teachers));
      }, [teachers]);

      useEffect(() => {
        localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(plans));
      }, [plans]);

      useEffect(() => {
        localStorage.setItem('hikma_routines_v2', JSON.stringify(routines));

      useEffect(() => {
        localStorage.setItem('hikma_coordinators_v2', JSON.stringify(coordinators));

      useEffect(() => {

          localStorage.setItem('hikma_logged_in_coordinator_v2', JSON.stringify(loggedInCoordinator));

      useEffect(() => {

        } else {

      }, [loggedInTeacher]);

      useEffect(() => {
        localStorage.setItem('hikma_deleted_plans_queue', JSON.stringify(deletedPlans));
      }, [deletedPlans]);

      useEffect(() => {
        localStorage.setItem('hikma_deleted_teachers_queue', JSON.stringify(deletedTeachers));

      useEffect(() => {
        localStorage.setItem('hikma_deleted_routines_queue', JSON.stringify(deletedRoutines));
      }, [deletedRoutines]);

      useEffect(() => {
        localStorage.setItem('hikma_deleted_coordinators_queue', JSON.stringify(deletedCoordinators));
      }, [deletedCoordinators]);

      // Scrub other teachers' data from local cache when a teacher session is restored
      useEffect(() => {
        const cachedTeacher = JSON.parse(localStorage.getItem('hikma_logged_in_teacher_v2') || 'null');
        if (cachedTeacher?.teacher_id) {
          const profile = {

            p.teacher_id === profile.teacher_id || p.teacher_name === profile.teacher_name

      }, []);

      // Online status listener
      useEffect(() => {
        const handleOnline = () => setOnlineStatus(true);
        const handleOffline = () => setOnlineStatus(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);

      }, []);

      // Computed sync status for UI indicators
      const computedSyncStatus = useMemo(() => {
        if (!supabaseConfig.url || !supabaseConfig.key) {
          return 'unconfigured';
        }
        if (!onlineStatus) {
          const hasUnsynced = plans.some(p => p._dirty) || 
                              teachers.some(t => t._dirty) || 
                              routines.some(r => r._dirty) || 
                              coordinators.some(c => c._dirty) ||
                              deletedPlans.length > 0 || 
                              deletedTeachers.length > 0 ||
                              deletedRoutines.length > 0 ||
                              deletedCoordinators.length > 0;
          return hasUnsynced ? 'offline-unsynced' : 'disconnected';
        }
        if (isSyncing) {
          return 'syncing';
        }
        const hasUnsynced = plans.some(p => p._dirty) || 
                            teachers.some(t => t._dirty) || 
                            routines.some(r => r._dirty) || 
                            coordinators.some(c => c._dirty) ||
                            deletedPlans.length > 0 || 
                            deletedTeachers.length > 0 ||
                            deletedRoutines.length > 0 ||
                            deletedCoordinators.length > 0;
        if (hasUnsynced) {
          return 'unsynced';
        }
        return syncStatus === 'error' ? 'error' : 'synced';
      }, [supabaseConfig, onlineStatus, isSyncing, plans, teachers, routines, coordinators, deletedPlans, deletedTeachers, deletedRoutines, deletedCoordinators, syncStatus]);

      // Supabase Synchronization Engine (secure RPC — role-based access)
      const syncWithSupabase = async (forceConfig = null) => {
        const client = forceConfig
          ? window.supabase.createClient(forceConfig.url, forceConfig.key)
          : supabase;

        if (!client) {
          setSyncStatus('unconfigured');
          return;
        }

        if (!navigator.onLine) {
          setSyncStatus('disconnected');
          return;
        }

        const cachedTeacher = JSON.parse(localStorage.getItem('hikma_logged_in_teacher_v2') || 'null');
        const cachedCoordinator = JSON.parse(localStorage.getItem('hikma_logged_in_coordinator_v2') || 'null');
        const isAdmin = localStorage.getItem('hikma_admin_auth') === 'true';
        const teacherPass = sessionStorage.getItem(SESSION_TEACHER_PASS);
        const coordPass = sessionStorage.getItem(SESSION_COORD_PASS);
        const adminPass = sessionStorage.getItem(SESSION_ADMIN_PASS);

        const syncAsTeacher = cachedTeacher && teacherPass;
        const syncAsCoordinator = cachedCoordinator && coordPass;
        const syncAsAdmin = isAdmin && adminPass;

        if (!syncAsTeacher && !syncAsCoordinator && !syncAsAdmin) {
          return;
        }

        setIsSyncing(true);
        setSyncStatus('syncing');

        try {
          if (syncAsTeacher) {
            let currentPlans = JSON.parse(localStorage.getItem('hikma_lessons_plans_v2') || '[]');
            let currentDeletedPlans = JSON.parse(localStorage.getItem('hikma_deleted_plans_queue') || '[]');

            for (const planId of [...currentDeletedPlans]) {
              const { data, error } = await client.rpc('hikma_teacher_delete_plan', {
                p_teacher_id: cachedTeacher.teacher_id,
                p_passcode: teacherPass,
                p_plan_id: planId
              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to delete plan');
              currentDeletedPlans = currentDeletedPlans.filter(id => id !== planId);
              localStorage.setItem('hikma_deleted_plans_queue', JSON.stringify(currentDeletedPlans));
              setDeletedPlans(currentDeletedPlans);
            }

            const dirtyPlans = currentPlans.filter(p =>
              p._dirty && (p.teacher_id === cachedTeacher.teacher_id || p.teacher_name === cachedTeacher.teacher_name)
            );
            for (const p of dirtyPlans) {
              const { _dirty, lesson_month, lesson_week, ...cleanPlan } = p;
              const planPayload = {
                ...cleanPlan,
                teacher_id: cachedTeacher.teacher_id,
                teacher_name: cachedTeacher.teacher_name
              };
              const { data, error } = await client.rpc('hikma_teacher_save_plan', {
                p_teacher_id: cachedTeacher.teacher_id,
                p_passcode: teacherPass,
                p_plan: planPayload
              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to save plan');
              currentPlans = currentPlans.map(item => item.id === p.id ? planPayload : item);
            }

            const { data: syncData, error: syncError } = await client.rpc('hikma_teacher_sync', {
              p_teacher_id: cachedTeacher.teacher_id,
              p_passcode: teacherPass
            });
            if (syncError) throw syncError;
            if (!syncData?.ok) throw new Error(syncData?.error || 'Teacher sync failed');

            const serverPlans = syncData.plans || [];
            const serverRoutines = syncData.routines || [];
            const dirtyPlansMap = new Map(currentPlans.filter(p => p._dirty).map(p => [p.id, p]));
            const mergedPlans = serverPlans.map(sp => dirtyPlansMap.has(sp.id) ? dirtyPlansMap.get(sp.id) : sp);
            const serverPlanIds = new Set(serverPlans.map(sp => sp.id));
            currentPlans.filter(p => p._dirty).forEach(dp => {
              if (!serverPlanIds.has(dp.id)) mergedPlans.push(dp);
            });
            mergedPlans.sort((a, b) => b.created_at - a.created_at);

            const selfTeacher = {
              id: cachedTeacher.id,
              teacher_id: cachedTeacher.teacher_id,
              teacher_name: cachedTeacher.teacher_name
            };

            localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(mergedPlans));
            localStorage.setItem('hikma_routines_v2', JSON.stringify(serverRoutines));
            localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify([selfTeacher]));
            setPlans(mergedPlans);
            setRoutines(serverRoutines);
            setTeachers([selfTeacher]);
          } else if (syncAsCoordinator) {
            let currentTeachers = JSON.parse(localStorage.getItem('hikma_teachers_roster_v2') || '[]');
            let currentRoutines = JSON.parse(localStorage.getItem('hikma_routines_v2') || '[]');
            let currentDeletedTeachers = JSON.parse(localStorage.getItem('hikma_deleted_teachers_queue') || '[]');
            let currentDeletedRoutines = JSON.parse(localStorage.getItem('hikma_deleted_routines_queue') || '[]');

            for (const teacherId of [...currentDeletedTeachers]) {
              const { data, error } = await client.rpc('hikma_coordinator_delete_teacher', {
                p_coordinator_id: cachedCoordinator.coordinator_id,
                p_passcode: coordPass,
                p_teacher_row_id: teacherId
              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to delete teacher');
              currentDeletedTeachers = currentDeletedTeachers.filter(id => id !== teacherId);
              localStorage.setItem('hikma_deleted_teachers_queue', JSON.stringify(currentDeletedTeachers));
              setDeletedTeachers(currentDeletedTeachers);
            }

            for (const routineId of [...currentDeletedRoutines]) {
              const { data, error } = await client.rpc('hikma_coordinator_delete_routine', {
                p_coordinator_id: cachedCoordinator.coordinator_id,

              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to delete routine');
              currentDeletedRoutines = currentDeletedRoutines.filter(id => id !== routineId);
              localStorage.setItem('hikma_deleted_routines_queue', JSON.stringify(currentDeletedRoutines));
              setDeletedRoutines(currentDeletedRoutines);

            for (const t of currentTeachers.filter(item => item._dirty)) {

              const { data, error } = await client.rpc('hikma_coordinator_save_teacher', {

                p_teacher: cleanTeacher
              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to save teacher');
              currentTeachers = currentTeachers.map(item => item.id === t.id ? cleanTeacher : item);
            }

            for (const r of currentRoutines.filter(item => item._dirty)) {
              const { _dirty, ...cleanRoutine } = r;
              const { data, error } = await client.rpc('hikma_coordinator_save_routine', {

                p_passcode: coordPass,
                p_routine: cleanRoutine
              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to save routine');
              currentRoutines = currentRoutines.map(item => item.id === r.id ? cleanRoutine : item);
            }

            const { data: syncData, error: syncError } = await client.rpc('hikma_coordinator_sync', {
              p_coordinator_id: cachedCoordinator.coordinator_id,
              p_passcode: coordPass
            });
            if (syncError) throw syncError;
            if (!syncData?.ok) throw new Error(syncData?.error || 'Coordinator sync failed');

            const serverTeachers = (syncData.teachers || []).map(t => ({
              id: t.id,
              teacher_id: t.teacher_id,
              teacher_name: t.teacher_name,
              created_at: t.created_at
            }));
            const serverPlans = syncData.plans || [];
            const serverRoutines = syncData.routines || [];

            const dirtyTeachersMap = new Map(currentTeachers.filter(t => t._dirty).map(t => [t.id, t]));
            const mergedTeachers = serverTeachers.map(st => dirtyTeachersMap.has(st.id) ? {
              ...dirtyTeachersMap.get(st.id),
              passcode: dirtyTeachersMap.get(st.id).passcode
            } : st);
            const serverTeacherIds = new Set(serverTeachers.map(st => st.id));
            currentTeachers.filter(t => t._dirty).forEach(dt => {
              if (!serverTeacherIds.has(dt.id)) mergedTeachers.push(dt);
            });

            const dirtyRoutinesMap = new Map(currentRoutines.filter(r => r._dirty).map(r => [r.id, r]));
            const mergedRoutines = serverRoutines.map(sr => dirtyRoutinesMap.has(sr.id) ? dirtyRoutinesMap.get(sr.id) : sr);
            const serverRoutineIds = new Set(serverRoutines.map(sr => sr.id));
            currentRoutines.filter(r => r._dirty).forEach(dr => {
              if (!serverRoutineIds.has(dr.id)) mergedRoutines.push(dr);
            });

            serverPlans.sort((a, b) => b.created_at - a.created_at);
            const serverCoordinators = syncData.coordinators || [];
            localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(mergedTeachers));
            localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(serverPlans));
            localStorage.setItem('hikma_routines_v2', JSON.stringify(mergedRoutines));
            localStorage.setItem('hikma_coordinators_v2', JSON.stringify(serverCoordinators));
            setTeachers(mergedTeachers);
            setPlans(serverPlans);
            setRoutines(mergedRoutines);
            setCoordinators(serverCoordinators);
          } else if (syncAsAdmin) {
            let currentTeachers = JSON.parse(localStorage.getItem('hikma_teachers_roster_v2') || '[]');
            let currentCoordinators = JSON.parse(localStorage.getItem('hikma_coordinators_v2') || '[]');
            let currentDeletedTeachers = JSON.parse(localStorage.getItem('hikma_deleted_teachers_queue') || '[]');
            let currentDeletedCoordinators = JSON.parse(localStorage.getItem('hikma_deleted_coordinators_queue') || '[]');

            for (const teacherId of [...currentDeletedTeachers]) {
              const { data, error } = await client.rpc('hikma_admin_delete_teacher', {
                p_admin_passcode: adminPass,
                p_teacher_row_id: teacherId
              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to delete teacher');
              currentDeletedTeachers = currentDeletedTeachers.filter(id => id !== teacherId);
              localStorage.setItem('hikma_deleted_teachers_queue', JSON.stringify(currentDeletedTeachers));
              setDeletedTeachers(currentDeletedTeachers);
            }

            for (const coordId of [...currentDeletedCoordinators]) {

                p_admin_passcode: adminPass,

              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to delete coordinator');
              currentDeletedCoordinators = currentDeletedCoordinators.filter(id => id !== coordId);
              localStorage.setItem('hikma_deleted_coordinators_queue', JSON.stringify(currentDeletedCoordinators));
              setDeletedCoordinators(currentDeletedCoordinators);
            }

            for (const t of currentTeachers.filter(item => item._dirty)) {
              const { _dirty, ...cleanTeacher } = t;
              const { data, error } = await client.rpc('hikma_admin_save_teacher', {
                p_admin_passcode: adminPass,
                p_teacher: cleanTeacher
              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to save teacher');
              currentTeachers = currentTeachers.map(item => item.id === t.id ? cleanTeacher : item);
            }

            for (const c of currentCoordinators.filter(item => item._dirty)) {
              const { _dirty, ...cleanCoord } = c;
              const { data, error } = await client.rpc('hikma_admin_save_coordinator', {
                p_admin_passcode: adminPass,
                p_coordinator: cleanCoord
              });
              if (error) throw error;
              if (!data?.ok) throw new Error(data?.error || 'Failed to save coordinator');
              currentCoordinators = currentCoordinators.map(item => item.id === c.id ? cleanCoord : item);
            }

            const { data: syncData, error: syncError } = await client.rpc('hikma_admin_sync', {
              p_admin_passcode: adminPass
            });
            if (syncError) throw syncError;
            if (!syncData?.ok) throw new Error(syncData?.error || 'Admin sync failed');

            const dirtyTeachersMap = new Map(currentTeachers.filter(t => t._dirty).map(t => [t.id, t]));
            const mergedTeachers = (syncData.teachers || []).map(st => dirtyTeachersMap.has(st.id) ? dirtyTeachersMap.get(st.id) : st);
            const dirtyCoordinatorsMap = new Map(currentCoordinators.filter(c => c._dirty).map(c => [c.id, c]));
            const mergedCoordinators = (syncData.coordinators || []).map(sc => dirtyCoordinatorsMap.has(sc.id) ? dirtyCoordinatorsMap.get(sc.id) : sc);
            const mergedPlans = (syncData.plans || []).sort((a, b) => b.created_at - a.created_at);

            localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(mergedTeachers));
            localStorage.setItem('hikma_coordinators_v2', JSON.stringify(mergedCoordinators));
            localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(mergedPlans));
            localStorage.setItem('hikma_routines_v2', JSON.stringify(syncData.routines || []));
            setTeachers(mergedTeachers);
            setCoordinators(mergedCoordinators);
            setPlans(mergedPlans);
            setRoutines(syncData.routines || []);
          }

          setSyncStatus('synced');
        } catch (e) {
          console.error("Database synchronization failed:", e);
          setSyncStatus('error');
        } finally {
          setIsSyncing(false);
        }
      };

      const saveSupabaseConfig = (url, key) => {
        const config = { url, key };
        setSupabaseConfig(config);
        localStorage.setItem('hikma_supabase_config', JSON.stringify(config));
        
        // Mark all existing offline data as dirty to trigger initialization migration
        setTeachers(prev => {
          const updated = prev.map(t => ({ ...t, _dirty: true }));
          localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(updated));
          return updated;
        });
        setPlans(prev => {
          const updated = prev.map(p => ({ ...p, _dirty: true }));
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(updated));
          return updated;
        });
        setRoutines(prev => {
          const updated = prev.map(r => ({ ...r, _dirty: true }));
          localStorage.setItem('hikma_routines_v2', JSON.stringify(updated));
          return updated;
        });
        setCoordinators(prev => {
          const updated = prev.map(c => ({ ...c, _dirty: true }));
          localStorage.setItem('hikma_coordinators_v2', JSON.stringify(updated));
          return updated;
        });

        // Trigger migration sync
        syncWithSupabase(config);
      };

      // Auto-trigger sync on network re-establishment or initialization
      useEffect(() => {
        if (supabase && onlineStatus) {
          syncWithSupabase();
        } else if (!supabase) {
          setSyncStatus('unconfigured');
        } else if (!onlineStatus) {
          setSyncStatus('disconnected');
        }
      }, [supabase, onlineStatus]);

      const handleAddPlan = (newPlan) => {
        const planWithDirty = { ...newPlan, _dirty: true };
        setPlans((prev) => {
          const updated = [planWithDirty, ...prev];
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleUpdatePlan = (updatedPlan) => {
        const planWithDirty = { ...updatedPlan, _dirty: true };
        setPlans((prev) => {
          const updated = prev.map((p) => (p.id === updatedPlan.id ? planWithDirty : p));
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleDeletePlan = (id) => {
        const targetPlan = plans.find(p => p.id === id);
        if (targetPlan && !targetPlan._dirty) {
          setDeletedPlans(prev => {
            const updated = [...prev, id];
            localStorage.setItem('hikma_deleted_plans_queue', JSON.stringify(updated));
            return updated;
          });
        }
        setPlans((prev) => {
          const updated = prev.filter((p) => p.id !== id);
          localStorage.setItem('hikma_lessons_plans_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleAddRoutine = (newRoutine) => {
        const routineWithDirty = { ...newRoutine, _dirty: true };
        setRoutines((prev) => {
          const updated = [...prev, routineWithDirty];
          localStorage.setItem('hikma_routines_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleDeleteRoutine = (id) => {
        const targetRoutine = routines.find(r => r.id === id);
        if (targetRoutine && !targetRoutine._dirty) {
          setDeletedRoutines(prev => {
            const updated = [...prev, id];
            localStorage.setItem('hikma_deleted_routines_queue', JSON.stringify(updated));
            return updated;
          });
        }
        setRoutines((prev) => {
          const updated = prev.filter((r) => r.id !== id);
          localStorage.setItem('hikma_routines_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleAddTeacher = (name, customId, password) => {
        const newTeach = {
          id: 'teach_' + Date.now(),
          teacher_id: customId.trim(),
          teacher_name: name.trim(),
          passcode: password.trim(),
          _dirty: true
        };
        setTeachers((prev) => {
          const updated = [...prev, newTeach];
          localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleDeleteTeacher = (id) => {
        const targetTeacher = teachers.find(t => t.id === id);
        if (targetTeacher && !targetTeacher._dirty) {
          setDeletedTeachers(prev => {
            const updated = [...prev, id];
            localStorage.setItem('hikma_deleted_teachers_queue', JSON.stringify(updated));
            return updated;
          });
        }
        setTeachers((prev) => {
          const updated = prev.filter((t) => t.id !== id);
          localStorage.setItem('hikma_teachers_roster_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleAddCoordinator = (name, customId, password) => {
        const newCoord = {
          id: 'coord_' + Date.now(),
          coordinator_id: customId.trim(),
          coordinator_name: name.trim(),
          passcode: password.trim(),
          _dirty: true
        };
        setCoordinators((prev) => {
          const updated = [...prev, newCoord];
          localStorage.setItem('hikma_coordinators_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleDeleteCoordinator = (id) => {
        const target = coordinators.find(c => c.id === id);
        if (target && !target._dirty) {
          setDeletedCoordinators(prev => {
            const updated = [...prev, id];
            localStorage.setItem('hikma_deleted_coordinators_queue', JSON.stringify(updated));
            return updated;
          });
        }
        setCoordinators((prev) => {
          const updated = prev.filter((c) => c.id !== id);
          localStorage.setItem('hikma_coordinators_v2', JSON.stringify(updated));
          return updated;
        });
        setTimeout(() => syncWithSupabase(), 100);
      };

      const handleAdminLogin = (passcode) => {
        if (passcode.trim() === 'hikma123') {
          sessionStorage.setItem(SESSION_ADMIN_PASS, passcode.trim());
          sessionStorage.removeItem(SESSION_TEACHER_PASS);
          sessionStorage.removeItem(SESSION_COORD_PASS);
          setIsAdminLoggedIn(true);
          setLoggedInCoordinator(null);
          setLoggedInTeacher(null);
          setTimeout(() => syncWithSupabase(), 100);
          return true;
        }
        return false;
      };

      const handleTeacherLogin = async (userId, password) => {
        if (!userId || !password) return false;

        if (supabase && navigator.onLine) {
          try {
            const { data, error } = await supabase.rpc('hikma_teacher_login', {
              p_teacher_id: userId.trim(),
              p_passcode: password.trim()
            });
            if (!error && data?.ok && data.teacher) {
              sessionStorage.setItem(SESSION_TEACHER_PASS, password.trim());
              sessionStorage.removeItem(SESSION_COORD_PASS);
              sessionStorage.removeItem(SESSION_ADMIN_PASS);
              setLoggedInTeacher(data.teacher);
              setLoggedInCoordinator(null);
              setIsAdminLoggedIn(false);
              scrubTeacherLocalData(data.teacher);
              setPlans(prev => prev.filter(p => p.teacher_id === data.teacher.teacher_id || p.teacher_name === data.teacher.teacher_name));
              setTeachers([data.teacher]);
              setTimeout(() => syncWithSupabase(), 100);
              return true;
            }
          } catch (e) {
            console.warn('Online teacher login failed, trying offline cache:', e);
          }
        }

        const matched = teachers.find((t) => {
          const storedId = String(t.teacher_id).trim().toLowerCase();
          const providedId = String(userId).trim().toLowerCase();
          const storedPass = String(t.passcode || '').trim();
          const providedPass = String(password).trim();
          return storedId === providedId && storedPass === providedPass;
        });

        if (matched) {
          const profile = {
            id: matched.id,
            teacher_id: matched.teacher_id,
            teacher_name: matched.teacher_name
          };
          sessionStorage.setItem(SESSION_TEACHER_PASS, password.trim());
          sessionStorage.removeItem(SESSION_COORD_PASS);
          sessionStorage.removeItem(SESSION_ADMIN_PASS);
          setLoggedInTeacher(profile);
          setLoggedInCoordinator(null);
          setIsAdminLoggedIn(false);
          scrubTeacherLocalData(profile);
          setPlans(prev => prev.filter(p => p.teacher_id === profile.teacher_id || p.teacher_name === profile.teacher_name));
          setTeachers([profile]);
          return true;
        }
        return false;
      };

      const handleCoordinatorLogin = async (userId, password) => {
        if (!userId || !password) return false;

        if (supabase && navigator.onLine) {
          try {
            const { data, error } = await supabase.rpc('hikma_coordinator_login', {
              p_coordinator_id: userId.trim(),
              p_passcode: password.trim()
            });
            if (!error && data?.ok && data.coordinator) {
              sessionStorage.setItem(SESSION_COORD_PASS, password.trim());
              sessionStorage.removeItem(SESSION_TEACHER_PASS);
              sessionStorage.removeItem(SESSION_ADMIN_PASS);
              setLoggedInCoordinator(data.coordinator);
              setLoggedInTeacher(null);
              setIsAdminLoggedIn(false);
              setActiveTab('coordinator');
              setTimeout(() => syncWithSupabase(), 100);
              return true;
            }
          } catch (e) {
            console.warn('Online coordinator login failed, trying offline cache:', e);
          }
        }

        const matched = coordinators.find((c) => {
          const storedId = String(c.coordinator_id).trim().toLowerCase();
          const providedId = String(userId).trim().toLowerCase();
          const storedPass = String(c.passcode).trim();
          const providedPass = String(password).trim();
          return storedId === providedId && storedPass === providedPass;
        });

        if (matched) {
          const profile = {
            id: matched.id,
            coordinator_id: matched.coordinator_id,
            coordinator_name: matched.coordinator_name
          };
          sessionStorage.setItem(SESSION_COORD_PASS, password.trim());
          sessionStorage.removeItem(SESSION_TEACHER_PASS);
          sessionStorage.removeItem(SESSION_ADMIN_PASS);
          setLoggedInCoordinator(profile);
          setLoggedInTeacher(null);
          setIsAdminLoggedIn(false);
          setActiveTab('coordinator');
          return true;
        }
        return false;
      };

      const handleLogout = () => {
        sessionStorage.removeItem(SESSION_TEACHER_PASS);
        sessionStorage.removeItem(SESSION_COORD_PASS);
        sessionStorage.removeItem(SESSION_ADMIN_PASS);
        setIsAdminLoggedIn(false);
        setLoggedInTeacher(null);
        setLoggedInCoordinator(null);
        setActiveTab('teacher');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans pb-12">
          <header className="bg-slate-900 border-b border-slate-800 text-white shadow-xl no-print mt-4 md:mt-2 rounded-2xl mx-4 sm:mx-6 md:mx-8 px-4 py-3 md:py-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-4">
                <div className="bg-white p-2 rounded-xl shadow-md shrink-0 flex items-center justify-center">
                  <Logo className="h-[56px] w-[56px]" />
                </div>
                <div className="text-left">
                  <h1 className="text-lg sm:text-xl font-bold font-display tracking-tight text-white">
                    Hikma International School
                  </h1>
                  <p className="text-xs sm:text-sm text-sky-400 font-medium mt-1">
                    Daily Lesson Plan Portal
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto justify-end flex-wrap sm:flex-nowrap">
                {/* Database Sync Status Badge */}
                <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700 select-none">
                  <div className="relative flex h-2 w-2 shrink-0">
                    {computedSyncStatus === 'synced' && (
                      <>
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                      </>
                    )}
                    {computedSyncStatus === 'syncing' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500 animate-pulse"></span>
                    )}
                    {computedSyncStatus === 'unsynced' && (
                      <>
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-400"></span>
                      </>
                    )}
                    {computedSyncStatus === 'offline-unsynced' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                    )}
                    {computedSyncStatus === 'disconnected' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                    )}
                    {computedSyncStatus === 'unconfigured' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-slate-500"></span>
                    )}
                    {computedSyncStatus === 'error' && (
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-rose-600 animate-bounce"></span>
                    )}
                  </div>
                  
                  <div className="flex flex-col text-left shrink-0 max-w-[120px]">
                    <span className="text-[9px] text-slate-400 font-bold uppercase tracking-wider leading-none">Database</span>
                    <span className="text-[11px] font-semibold text-white mt-0.5 truncate leading-none">
                      {computedSyncStatus === 'synced' && 'Synced'}
                      {computedSyncStatus === 'syncing' && 'Syncing...'}
                      {computedSyncStatus === 'unsynced' && 'Unsynced'}
                      {computedSyncStatus === 'disconnected' && 'Offline'}
                      {computedSyncStatus === 'offline-unsynced' && 'Offline (Dirty)'}
                      {computedSyncStatus === 'unconfigured' && 'Not Setup'}
                      {computedSyncStatus === 'error' && 'Sync Error'}
                    </span>
                  </div>

                  {/* Manual Sync Trigger */}
                  {(computedSyncStatus === 'unsynced' || computedSyncStatus === 'error') && (
                    <button 
                      onClick={() => syncWithSupabase()}
                      disabled={isSyncing}
                      className="ml-1 p-1 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-[9px] font-bold px-1.5 transition-all cursor-pointer select-none"
                    >
                      Sync
                    </button>
                  )}

                  <button 
                    onClick={() => setShowDbModal(true)}
                    className="p-1 text-slate-400 hover:text-white rounded-lg transition-all ml-0.5 cursor-pointer"
                    title="Database Connection Settings"
                  >
                    <CogIcon />
                  </button>
                </div>

                <button
                  onClick={() => setActiveTab('teacher')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'teacher'
                      ? 'bg-sky-600 text-white shadow-lg border border-sky-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <BookOpenIcon />
                  <span>Teacher Portal</span>
                </button>

                <button
                  onClick={() => setActiveTab('admin')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'admin'
                      ? 'bg-rose-600 text-white shadow-lg border border-rose-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <ShieldIcon />
                  <span>Headmaster Office</span>
                </button>

                <button
                  onClick={() => setActiveTab('coordinator')}
                  className={`flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all min-h-[44px] cursor-pointer flex-1 sm:flex-initial ${
                    activeTab === 'coordinator'
                      ? 'bg-violet-600 text-white shadow-lg border border-violet-500'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <UsersIcon />
                  <span>Coordinator</span>
                </button>

                {(isAdminLoggedIn || loggedInTeacher || loggedInCoordinator) && (
                  <button
                    onClick={handleLogout}
                    className="px-4 py-2.5 bg-slate-800 hover:bg-rose-950/40 text-rose-400 font-bold rounded-xl text-sm transition-all border border-slate-700 min-h-[44px] flex items-center justify-center gap-1.5 cursor-pointer"
                  >
                    <LogOutIcon />
                    <span>Sign Out</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'teacher' ? (
              <TeacherPortal
                loggedInTeacher={loggedInTeacher}
                onTeacherLogin={handleTeacherLogin}
                teachersList={teachers}
                lessonPlans={plans}
                onAddPlan={handleAddPlan}
                onUpdatePlan={handleUpdatePlan}
                onDeletePlan={handleDeletePlan}
                routines={routines}
              />
            ) : activeTab === 'coordinator' ? (
              <CoordinatorPortal
                loggedInCoordinator={loggedInCoordinator}
                onCoordinatorLogin={handleCoordinatorLogin}
                teachersList={teachers}
                lessonPlans={plans}
                routines={routines}
                onAddRoutine={handleAddRoutine}
                onDeleteRoutine={handleDeleteRoutine}
                onAddTeacher={handleAddTeacher}
                onDeleteTeacher={handleDeleteTeacher}
              />
            ) : (
              <HeadmasterPortal
                isAdminLoggedIn={isAdminLoggedIn}
                coordinatorsList={coordinators}
                lessonPlans={plans}
                onLogin={handleAdminLogin}
                onAddCoordinator={handleAddCoordinator}
                onDeleteCoordinator={handleDeleteCoordinator}
                routines={routines}
                supabase={supabase}
              />
            )}
          </main>

          <footer className="w-full text-center py-6 mt-12 border-t border-slate-200 text-slate-500 font-semibold text-xs sm:text-sm no-print">
            <div className="max-w-7xl mx-auto px-4">
              <span>Developed by Chinmoy</span>
            </div>
          </footer>

          {/* Supabase Database Config Modal */}
          {showDbModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in no-print">
              <div className="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl relative text-left space-y-6">
                <button 
                  onClick={() => setShowDbModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 cursor-pointer flex items-center justify-center h-8 w-8"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>

                <div className="flex items-center space-x-3 border-b pb-3">
                  <div className="bg-sky-50 text-sky-600 p-2.5 rounded-2xl border">
                    <DatabaseIcon />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold font-display text-slate-900">Database Connection</h3>
                    <p className="text-xs text-slate-500 font-medium">Configure Supabase connection for persistent cloud storage.</p>
                  </div>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const url = e.target.elements.supabaseUrl.value.trim();
                  const key = e.target.elements.supabaseKey.value.trim();
                  saveSupabaseConfig(url, key);
                  setShowDbModal(false);
                }} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Supabase URL</label>
                    <input 
                      name="supabaseUrl"
                      type="url" 
                      defaultValue={supabaseConfig.url}
                      className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-mono font-medium focus:ring-2 focus:ring-sky-500" 
                      placeholder="https://your-project.supabase.co" 
                      required 
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Supabase Anon Key</label>
                    <input 
                      name="supabaseKey"
                      type="password" 
                      defaultValue={supabaseConfig.key}
                      className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-mono font-medium focus:ring-2 focus:ring-sky-500" 
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." 
                      required 
                    />
                  </div>

                  <div className="bg-slate-50 p-3 rounded-2xl border text-xs text-slate-600 space-y-2 leading-relaxed">
                    <p className="font-semibold text-slate-800">Connection Status:</p>
                    <div className="flex items-center space-x-1.5 font-medium">
                      <span>Current Mode:</span>
                      <span className="font-bold text-slate-800 capitalize">{computedSyncStatus}</span>
                    </div>
                    <p>Configuring a database will automatically upload all existing offline roster profiles and lesson plans to your database instance.</p>
                  </div>

                  <div className="flex gap-3 pt-2">
                    <button 
                      type="button" 
                      onClick={() => {
                        setSupabaseConfig({ url: '', key: '' });
                        localStorage.removeItem('hikma_supabase_config');
                        setSyncStatus('unconfigured');
                        setShowDbModal(false);
                      }}
                      className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs sm:text-sm cursor-pointer transition-all text-center border"
                    >
                      Clear Config
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm cursor-pointer transition-all shadow-md"
                    >
                      Save & Sync
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function TeacherPortal({ loggedInTeacher, onTeacherLogin, teachersList, lessonPlans, onAddPlan, onUpdatePlan, onDeletePlan, routines }) {
      const [uIdInput, setUIdInput] = useState('');
      const [uPassInput, setUPassInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [selectedTeacher, setSelectedTeacher] = useState('');
      const [selectedClass, setSelectedClass] = useState(CLASSES[0]);
      const [section, setSection] = useState(SECTIONS[0]);
      const [shift, setShift] = useState('Morning');
      const [subjectName, setSubjectName] = useState('');
      const [classDate, setClassDate] = useState(() => new Date().toISOString().split('T')[0]);

      const [classWork, setClassWork] = useState('');
      const [hasHomework, setHasHomework] = useState(false);
      const [homeworkText, setHomeworkText] = useState('');

      const [editingPlanId, setEditingPlanId] = useState(null);
      const [planIdToDelete, setPlanIdToDelete] = useState(null);

      const [successMsg, setSuccessMsg] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterClass, setFilterClass] = useState('All');
      const [filterDate, setFilterDate] = useState('');
      const [currentPage, setCurrentPage] = useState(1);

      const selectedDayName = useMemo(() => getDayNameFromDate(classDate), [classDate]);

      const myAssignmentsForDate = useMemo(() => {
        if (!loggedInTeacher || !classDate) return [];
        return routines.filter(r =>
          r.teacher_id === loggedInTeacher.teacher_id &&
          r.day_name === selectedDayName
        );
      }, [routines, loggedInTeacher, classDate, selectedDayName]);

      useEffect(() => {
        if (loggedInTeacher) {
          setSelectedTeacher(loggedInTeacher.teacher_name);
        } else {
          setSelectedTeacher('');
        }
      }, [loggedInTeacher]);

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        const success = await onTeacherLogin(uIdInput, uPassInput);
        if (!success) {
          setLoginError('Invalid ID or Password credentials. Please verify your data entry syntax.');
        }
      };

      const applyAssignment = (assignment) => {
        setSelectedClass(assignment.class_name);
        setSection(assignment.section);
        setShift(assignment.shift);
        setSubjectName(assignment.subject_name);
      };

      const handleEditClick = (plan) => {
        setEditingPlanId(plan.id);
        setSelectedTeacher(plan.teacher_name);
        setSelectedClass(plan.class_name);
        setSection(plan.section);
        setShift(plan.shift);
        setSubjectName(plan.subject_name);
        setClassDate(plan.lesson_date);
        setClassWork(plan.class_work);

        if (plan.homework && plan.homework !== 'No Homework') {
          setHasHomework(true);
          setHomeworkText(plan.homework);
        } else {
          setHasHomework(false);
          setHomeworkText('');
        }
        window.scrollTo({ top: 100, behavior: 'smooth' });
      };

      const handleCancelEdit = () => {
        setEditingPlanId(null);
        setSubjectName('');
        setClassWork('');
        setHasHomework(false);
        setHomeworkText('');
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        const payload = {
          id: editingPlanId || 'plan_' + Date.now(),
          teacher_id: loggedInTeacher.teacher_id,
          teacher_name: selectedTeacher,
          class_name: selectedClass,
          section,
          shift,
          subject_name: subjectName.trim(),
          lesson_date: classDate,
          class_work: classWork.trim(),
          homework: hasHomework && homeworkText.trim() ? homeworkText.trim() : 'No Homework',
          created_at: editingPlanId
            ? (lessonPlans.find(p => p.id === editingPlanId)?.created_at || Date.now())
            : Date.now()
        };

        if (editingPlanId) {
          onUpdatePlan(payload);
          setSuccessMsg('Lesson plan successfully updated!');
          setEditingPlanId(null);
        } else {
          onAddPlan(payload);
          setSuccessMsg('Lesson plan successfully submitted!');
        }

        setSubjectName('');
        setClassWork('');
        setHasHomework(false);
        setHomeworkText('');
      };

      const filteredTeacherPlans = useMemo(() => {
        return lessonPlans
          .filter(plan => plan.teacher_id === loggedInTeacher?.teacher_id || plan.teacher_name === loggedInTeacher?.teacher_name)
          .filter(plan => {
            const matchSearch = plan.subject_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                plan.class_work.toLowerCase().includes(searchQuery.toLowerCase());
            const matchClass = filterClass === 'All' || plan.class_name === filterClass;
            const matchDate = !filterDate || plan.lesson_date === filterDate;
            return matchSearch && matchClass && matchDate;
          })
          .sort((a, b) => b.lesson_date.localeCompare(a.lesson_date) || b.created_at - a.created_at);
      }, [lessonPlans, loggedInTeacher, searchQuery, filterClass, filterDate]);

      const paginatedPlans = useMemo(() => {
        const startIdx = (currentPage - 1) * 10;
        return filteredTeacherPlans.slice(startIdx, startIdx + 10);
      }, [filteredTeacherPlans, currentPage]);

      const totalPages = Math.max(1, Math.ceil(filteredTeacherPlans.length / 10));

      if (!loggedInTeacher) {
        return (
          <div className="max-w-md w-full mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 mt-10 text-left space-y-6 shadow-xl animate-fade-in">
            <h3 className="text-lg font-bold font-display text-slate-900 text-center flex justify-center items-center gap-1.5"><KeyIcon /> Teacher Security Access</h3>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 p-2.5 rounded-xl text-center font-semibold">{loginError}</p>}
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold block mb-1 text-slate-600">Teacher ID / আইডি নম্বর</label>
                <input type="text" value={uIdInput} onChange={e => setUIdInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-medium" placeholder="e.g. t101" required />
              </div>
              <div>
                <label className="text-xs font-semibold block mb-1 text-slate-600">Password / পাসওয়ার্ড</label>
                <input type="password" value={uPassInput} onChange={e => setUPassInput(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl text-sm font-medium" placeholder="••••••••" required />
              </div>
              <button type="submit" className="w-full bg-sky-600 hover:bg-sky-700 font-bold text-white py-3 rounded-xl text-xs sm:text-sm tracking-wide transition-all cursor-pointer">
                Log In
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-8 animate-fade-in text-left">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 text-white shadow-xl">
            <h2 className="text-xl sm:text-2xl font-bold font-display tracking-tight text-white flex items-center gap-2">
              <BookOpenIcon />
              <span>Welcome back, {loggedInTeacher.teacher_name}!</span>
            </h2>
            <p className="text-sm text-slate-300 mt-1">Logged in with Teacher ID: <span className="font-mono text-sky-400 font-bold">{loggedInTeacher.teacher_id}</span></p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 space-y-6">
              <h3 className="text-base sm:text-lg font-bold font-display text-slate-900 border-b pb-2">
                {editingPlanId ? 'Edit Existing Lesson Plan' : 'Record Classroom Activity'}
              </h3>

              <form onSubmit={handleFormSubmit} className="space-y-5">
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Teacher Account</label>
                    <input type="text" value={selectedTeacher} disabled className="w-full bg-slate-100 border px-3 py-2 rounded-xl text-sm h-11 font-bold text-slate-500 cursor-not-allowed" />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Class</label>
                    <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Section</label>
                    <select value={section} onChange={e => setSection(e.target.value)} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-sm h-11 cursor-pointer">
                      {SECTIONS.map(sec => <option key={sec} value={sec}>Section {sec}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 block mb-1">Shift</label>

    function SQLConsole({ supabase }) {

          setResults(null);
          return;

        setLoading(true);
        setError(null);
        setResults(null);
        try {
          setError('The in-app SQL console is disabled for security. Run supabase_fresh_setup.sql in Supabase Dashboard → SQL Editor. Test RPCs there, e.g. SELECT public.hikma_teacher_login(\'t101\', \'hikma11\');');
        } catch (err) {
          setError(err.message || 'An unexpected error occurred while executing the query.');
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
      };

      const tableDDL = `-- SECURE FRESH SETUP — copy the FULL script from supabase_fresh_setup.sql
-- Run it in Supabase Dashboard → SQL Editor (not in this app console).
--
-- Security model:
--   Teachers     → own lesson plans only; cannot read other teachers' IDs/passwords
--   Coordinators → all plans & routines; teacher passwords are NEVER returned
--   Admin        → full access via admin passcode (hikma123)
--   Direct table access from browser is BLOCKED (RPC-only)
--
-- Your project URL: https://noddojjnufbemzdqukjr.supabase.co
-- Open supabase_fresh_setup.sql in this project folder and paste the entire file.`;

      const rpcDDL = `-- exec_sql has been REMOVED for security (it allowed arbitrary SQL from the browser).
-- Use Supabase Dashboard → SQL Editor to run queries instead.
--
-- Available secure RPC functions (called automatically by the app):
--   hikma_teacher_login, hikma_teacher_sync, hikma_teacher_save_plan, hikma_teacher_delete_plan
--   hikma_coordinator_login, hikma_coordinator_sync, hikma_coordinator_save_teacher, ...
--   hikma_admin_sync, hikma_admin_save_teacher, ...
--
-- Example test in SQL Editor:
-- SELECT public.hikma_teacher_login('t101', 'hikma11');`;

      return (
        <div className="space-y-6 animate-fade-in text-left">
          <div className="bg-white border p-6 sm:p-8 rounded-3xl shadow-sm space-y-6">
            <div className="border-b pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <h3 className="font-bold text-slate-900 text-lg flex items-center gap-1.5 font-display">
                  <DatabaseIcon />
                  <span>Supabase SQL Console</span>

                <p className="text-xs text-slate-500 font-medium mt-1">Execute SQL statements directly on your Supabase database instance.</p>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setSqlQuery('SELECT * FROM public.hikma_plans ORDER BY created_at DESC LIMIT 10;')}

                >
                  Plans Query
                </button>
                <button 
                  onClick={() => setSqlQuery('SELECT * FROM public.hikma_teachers ORDER BY teacher_name ASC;')}
                  className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl border cursor-pointer transition-all"
                >
                  Teachers Query
                </button>
                <button 
                  onClick={() => setSqlQuery('SELECT * FROM public.hikma_routines ORDER BY class_name, section, shift, day_name;')}
                  className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl border cursor-pointer transition-all"
                >
                  Routines Query
                </button>
                <button 
                  onClick={() => setSqlQuery('SELECT * FROM public.hikma_coordinators ORDER BY coordinator_name ASC;')}
                  className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl border cursor-pointer transition-all"
                >
                  Coordinators Query
                </button>
              </div>
            </div>

            <div className="space-y-4">
              <div className="relative">
                <textarea
                  value={sqlQuery}
                  onChange={(e) => setSqlQuery(e.target.value)}
                  className="w-full bg-slate-900 text-emerald-400 font-mono text-sm p-4 rounded-2xl min-h-[150px] border border-slate-800 focus:ring-2 focus:ring-sky-500 focus:outline-none leading-relaxed"
                  placeholder="SELECT * FROM public.hikma_plans LIMIT 10;"
                />
              </div>

              <div className="flex justify-between items-center">
                <span className="text-[11px] text-slate-400 font-mono font-medium">
                  {!supabase ? "⚠️ Database client not configured" : "⚡ Database client connected"}
                </span>
                <button
                  onClick={runQuery}
                  disabled={loading}
                  className="bg-slate-900 hover:bg-slate-800 disabled:bg-slate-400 text-white font-bold py-2.5 px-6 rounded-xl text-sm transition-all shadow-md cursor-pointer flex items-center gap-2"
                >
                  {loading ? (
                    <>
                      <span className="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                      <span>Running...</span>
                    </>
                  ) : (
                    <span>Execute Query</span>
                  )}

              </div>
            </div>

            {error && (
              <div className="bg-rose-50 border border-rose-100 text-rose-800 p-4 rounded-2xl space-y-2 text-xs sm:text-sm animate-fade-in">
                <p className="font-bold flex items-center gap-1.5 text-rose-900">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  <span>Query Execution Error</span>
                </p>
                <pre className="font-mono bg-rose-100/50 p-3 rounded-xl overflow-x-auto text-[11px] font-medium leading-relaxed whitespace-pre-wrap">{error}</pre>
                <p className="text-[11px] font-semibold text-rose-700">Note: If you haven't created the <code>exec_sql</code> RPC function yet, check the setup guidelines below.</p>
              </div>
            )}

            {results && (
              <div className="space-y-3 animate-fade-in">
                <h4 className="font-bold text-slate-800 text-sm flex items-center gap-1">
                  <span>Query Results</span>
                  <span className="text-xs font-mono font-medium text-slate-400">({Array.isArray(results) ? results.length : 1} items)</span>
                </h4>
                
                {Array.isArray(results) && results.length > 0 ? (
                  <div className="overflow-x-auto border rounded-xl max-h-[300px]">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead className="bg-slate-50 sticky top-0 border-b shadow-sm z-10">
                        <tr>
                          {Object.keys(results[0]).map((key) => (
                            <th key={key} className="p-3 font-bold border-b text-slate-700 bg-slate-50 uppercase tracking-wider text-[10px]">{key}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y font-mono font-medium text-slate-600">
                        {results.map((row, idx) => (
                          <tr key={idx} className="hover:bg-slate-50/50">
                            {Object.values(row).map((val, cellIdx) => (
                              <td key={cellIdx} className="p-3 whitespace-nowrap max-w-[200px] truncate" title={val !== null ? String(val) : 'NULL'}>
                                {val === null ? <span className="text-slate-300 italic">NULL</span> : String(val)}
                              </td>
                            ))}

                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <pre className="font-mono bg-slate-50 border p-4 rounded-xl text-xs overflow-x-auto leading-relaxed text-slate-700">
                    {JSON.stringify(results, null, 2)}
                  </pre>
                )}
              </div>
            )}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Table DDL Helper */}
            <div className="bg-white border p-6 rounded-3xl shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-2">
                <h4 className="font-bold text-slate-900 text-sm">Table Schema Setup</h4>
                <button 
                  onClick={() => copyToClipboard(tableDDL)}
                  className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border cursor-pointer transition-all"
                >
                  Copy DDL SQL
                </button>
              </div>
              <p className="text-xs text-slate-500 leading-relaxed font-medium">
                Run this script in the Supabase SQL editor to construct the required tables (<code>hikma_teachers</code>, <code>hikma_plans</code>, <code>hikma_routines</code>, and <code>hikma_coordinators</code>) and configure public access policies.
              </p>
              <pre className="bg-slate-50 p-3 rounded-xl border font-mono text-[10px] text-slate-600 overflow-x-auto max-h-[220px] leading-relaxed">
                {tableDDL}
              </pre>
            </div>

            {/* RPC Function Helper */}
            <div className="bg-white border p-6 rounded-3xl shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-2">
                <h4 className="font-bold text-slate-900 text-sm">Enable Remote Execution (RPC)</h4>
                <button 
                  onClick={() => copyToClipboard(rpcDDL)}
                  className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border cursor-pointer transition-all"
                >
                  Copy RPC SQL
                </button>
              </div>
              <p className="text-xs text-slate-500 leading-relaxed font-medium">

              <pre className="bg-slate-50 p-3 rounded-xl border font-mono text-[10px] text-slate-600 overflow-x-auto max-h-[220px] leading-relaxed">
                {rpcDDL}
              </pre>
            </div>
          </div>
        </div>
      );
    }

    function RoutineSetupDashboard({ teachersList, routines, onAddRoutine, onDeleteRoutine }) {
      const [routineClass, setRoutineClass] = useState('');
      const [routineSection, setRoutineSection] = useState('');
      const [routineShift, setRoutineShift] = useState('');
      const [routineDay, setRoutineDay] = useState('Saturday');
      const [routineTeacherId, setRoutineTeacherId] = useState('');
      const [routineSubject, setRoutineSubject] = useState('');
      const [routineIdToDelete, setRoutineIdToDelete] = useState(null);
      const [routineAlert, setRoutineAlert] = useState(null);
      const [filterRoutineClass, setFilterRoutineClass] = useState('');
      const [filterRoutineSection, setFilterRoutineSection] = useState('');
      const [filterRoutineShift, setFilterRoutineShift] = useState('');

      const handleAddRoutineSubmit = (e) => {
        e.preventDefault();
        setRoutineAlert(null);
        const teacher = teachersList.find(t => t.teacher_id === routineTeacherId);
        if (!routineClass || !routineSection || !routineShift || !routineTeacherId || !routineSubject.trim()) {
          setRoutineAlert({ type: 'error', text: 'Please fill in all fields before saving.' });
          return;
        }
        if (!teacher) {
          setRoutineAlert({ type: 'error', text: 'Selected teacher not found.' });
          return;
        }
        onAddRoutine({
          id: 'routine_' + Date.now(),
          class_name: routineClass,
          section: routineSection,
          shift: routineShift,
          day_name: routineDay,
          teacher_id: teacher.teacher_id,
          teacher_name: teacher.teacher_name,
          subject_name: routineSubject.trim(),
          created_at: Date.now()
        });
        setRoutineSubject('');
        setRoutineAlert({ type: 'success', text: 'Routine assignment saved and synced to teacher portal.' });
      };

      const filteredRoutines = useMemo(() => {
        return routines.filter(r => {
          const matchClass = !filterRoutineClass || r.class_name === filterRoutineClass;
          const matchSection = !filterRoutineSection || r.section === filterRoutineSection;
          const matchShift = !filterRoutineShift || r.shift === filterRoutineShift;
          return matchClass && matchSection && matchShift;
        }).sort((a, b) => {
          const classCmp = a.class_name.localeCompare(b.class_name);
          if (classCmp !== 0) return classCmp;
          const secCmp = a.section.localeCompare(b.section);
          if (secCmp !== 0) return secCmp;
          const shiftCmp = a.shift.localeCompare(b.shift);
          if (shiftCmp !== 0) return shiftCmp;
          return SCHOOL_DAYS.indexOf(a.day_name) - SCHOOL_DAYS.indexOf(b.day_name);
        });
      }, [routines, filterRoutineClass, filterRoutineSection, filterRoutineShift]);

      const groupedRoutines = useMemo(() => {
        const groups = {};
        filteredRoutines.forEach(r => {
          const key = `${r.class_name}|${r.section}|${r.shift}`;
          if (!groups[key]) {
            groups[key] = { class_name: r.class_name, section: r.section, shift: r.shift, byDay: {} };
            SCHOOL_DAYS.forEach(d => { groups[key].byDay[d] = []; });
          }
          groups[key].byDay[r.day_name].push(r);
        });
        return Object.values(groups);
      }, [filteredRoutines]);

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl border space-y-5">
            <div>
              <h3 className="font-bold text-slate-900 text-lg">Class Routine Setup</h3>
              <p className="text-xs text-slate-500 mt-1">Assign teachers and subjects for each class, section, shift, and day. Data syncs automatically to all teacher portals.</p>
            </div>

            <form onSubmit={handleAddRoutineSubmit} className="bg-slate-50 p-4 rounded-2xl border space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <div>
                  <label className="text-[11px] font-bold text-slate-600 block mb-1">Class</label>
                  <select value={routineClass} onChange={e => setRoutineClass(e.target.value)} className="w-full border p-2 rounded-xl text-sm bg-white cursor-pointer" required>
                    <option value="">-- Class --</option>
                    {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                  </select>
                </div>
                <div>

                  <select value={routineSection} onChange={e => setRoutineSection(e.target.value)} className="w-full border p-2 rounded-xl text-sm bg-white cursor-pointer" required>
                    <option value="">-- Section --</option>

              <div className="flex justify-end">
                <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-2 px-4 rounded-xl flex items-center gap-1.5 cursor-pointer"><PlusIcon /> Add Assignment</button>

          <div className="bg-white p-6 rounded-3xl border space-y-4">

              <h4 className="font-bold text-slate-900">Uploaded Routines</h4>
              <div className="flex flex-wrap gap-2">
                <select value={filterRoutineClass} onChange={e => setFilterRoutineClass(e.target.value)} className="border rounded-xl text-xs px-2 py-1.5 bg-slate-50 cursor-pointer">
                  <option value="">All Classes</option>
                  {CLASSES.map(cls => <option key={cls} value={cls}>Class {cls}</option>)}
                </select>
                <select value={filterRoutineSection} onChange={e => setFilterRoutineSection(e.target.value)} className="border rounded-xl text-xs px-2 py-1.5 bg-slate-50 cursor-pointer">
                  <option value="">All Sections</option>
                  {SECTIONS.map(sec => <option key={sec} value={sec}>Section {sec}</option>)}
                </select>
                <select value={filterRoutineShift} onChange={e => setFilterRoutineShift(e.target.value)} className="border rounded-xl text-xs px-2 py-1.5 bg-slate-50 cursor-pointer">
                  <option value="">All Shifts</option>
                  {SHIFTS.map(sh => <option key={sh} value={sh}>{sh}</option>)}
                </select>
              </div>

            {groupedRoutines.length === 0 ? (
              <p className="text-center text-slate-400 py-8 text-sm italic">No routine assignments uploaded yet.</p>
